plugins { id 'com.android.application' }
android {
 namespace 'com.survivalparadise.nativegame'
 compileSdk 35
 defaultConfig {
  applicationId 'com.survivalparadise.nativegame.v148compacttest'
  minSdk 24
  targetSdk 34
  versionCode 148
  versionName '0.148-compact-trade-wallet-test'
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
 // Local JVM Canvas validation requires packaged source assets but never
 // builds or installs an Android application.
 testOptions {
  unitTests.includeAndroidResources = true
 }
 // Production-safe signing support. Configure Android keystore securely as
 // GH Actions secrets; do NOT commit a private signing key into this public repo.
 def signStore=System.getenv('SP_SIGNING_STORE')
 def signPassword=System.getenv('SP_SIGNING_PASSWORD')
 if(signStore && signPassword) {
  signingConfigs {
   stable {
    storeFile file(signStore)
    storePassword signPassword
    keyAlias System.getenv('SP_SIGNING_ALIAS') ?: 'survivalparadise'
    keyPassword System.getenv('SP_SIGNING_KEY_PASSWORD') ?: signPassword
   }
  }
 }
 buildTypes {
  debug {
   if(signStore && signPassword) signingConfig signingConfigs.stable
  }
  release {
   minifyEnabled false
   if(signStore && signPassword) signingConfig signingConfigs.stable
  }
 }
}
// Source-only visual QA; these dependencies affect unit tests, not the APK.
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.13.1'
}
