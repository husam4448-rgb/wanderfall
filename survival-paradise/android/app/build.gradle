plugins { id 'com.android.application' }
android {
    namespace 'com.survivalparadise.simulation'
    compileSdk 35
    defaultConfig {
        applicationId 'com.survivalparadise.simulation'
        minSdk 24
        targetSdk 34
        versionCode 32
        versionName '0.32.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
