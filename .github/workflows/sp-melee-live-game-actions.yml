name: SP Melee — Six Real-Game Combat Actions and Screenshots
on:
  push:
    branches: [sp-v256-independent-aim-edge-locks]
    paths:
      - 'tools/sp_melee_live_game_qa.gd'
      - 'patches/apply_sp_v256_dual_edge_locks.py'
      - 'controls/EdgeLockJoystick.gd'
      - 'tools/build_sp_melee_walk_layers.py'
      - '.github/workflows/sp-melee-live-game-actions.yml'
      - 'melee-six-prototype/FirearmVisual.gd'
      - 'melee-six-prototype/HandVisual.gd'
      - 'melee-six-prototype/KnifeVisual.gd'
      - 'melee-six-prototype/MeleeController.gd'
      - 'melee-six-prototype/SlashMath.gd'
      - 'melee-six-prototype/SurvivorWalkSprite.gd'
      - 'tools/build_sp_melee_walk_layers.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-game-physics-render:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and patch real Phase16 game
        run: |
          set -euo pipefail
          cat source_parts/part_*.b64 | base64 -d > /tmp/sp_real_source.tar.xz
          echo 'ae4eff17e5f281f5867ac2d82207fcf96e6c8b649432acd48816aebab76fa308  /tmp/sp_real_source.tar.xz' | sha256sum -c -
          mkdir -p /tmp/sp_realgame
          tar -xJf /tmp/sp_real_source.tar.xz -C /tmp/sp_realgame
          python3 patches/apply_godot_47_fixes.py /tmp/sp_realgame
          python3 -m pip install --quiet Pillow
          python3 patches/apply_sp_melee_phase16_experimental.py /tmp/sp_realgame
          python3 patches/apply_sp_v256_dual_edge_locks.py /tmp/sp_realgame
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/sp_realgame')
          source=Path('tools/sp_melee_live_game_qa.gd')
          dest=root/'assets/sp_melee/LiveGameQA.gd'
          dest.write_text(source.read_text(encoding='utf-8'),encoding='utf-8')
          dummy=Path('melee-six-prototype/DamageDummy.gd').read_text(encoding='utf-8')
          dummy=dummy.replace('func take_damage(amount: float) -> void:', 'func take_damage(amount: float, _source: Node = null) -> void:')
          (root/'assets/sp_melee/DamageDummy.gd').write_text(dummy,encoding='utf-8')
          path=root/'scenes/main.tscn'
          t=path.read_text(encoding='utf-8')
          t=t.replace('load_steps=23','load_steps=24',1)
          t=t.replace('[sub_resource', '[ext_resource type="Script" path="res://assets/sp_melee/LiveGameQA.gd" id="sp_live_qa"]\n\n[sub_resource',1)
          t += '\n[node name="SP_Melee_RealGameQATest" type="Node" parent="."]\nscript = ExtResource("sp_live_qa")\n'
          path.write_text(t,encoding='utf-8')
          print('SP_MELEE_6_ANGLE_GAMEPLAY_TEST_SCENE_INJECTED')
          PY
      - name: Prepare verified native Godot/Xvfb runtime
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path /tmp/sp_realgame --quit >sp_melee_live_parse.log 2>&1
          cat sp_melee_live_parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' sp_melee_live_parse.log; then exit 1; fi
      - name: Execute six actual real-game attacks, target/energy/ammo/collision tests and capture screenshots
        run: |
          set -euo pipefail
          timeout 110s xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path /tmp/sp_realgame --resolution 1280x720 >sp_melee_live_actions.log 2>&1
          cat sp_melee_live_actions.log | grep 'SP_MELEE_LIVE_GAME'
          grep -q 'SP_MELEE_LIVE_GAME_QA_PASS checks=42' sp_melee_live_actions.log
          grep -q 'SP_MELEE_GAIT_QA_PASS' sp_melee_live_actions.log
          grep -q 'SP_MELEE_FAST_SLASH_QA_PASS' sp_melee_live_actions.log
          grep -q 'SP_FIREARM_V254_ART_QA_PASS' sp_melee_live_actions.log
          grep -q 'SP_WEAPON_HANDS_V255_QA_PASS' sp_melee_live_actions.log
          grep -q 'SP_V256_DUAL_STICK_QA_PASS' sp_melee_live_actions.log
          grep -q 'SP_V256_KNIFE_TARGET_QA_PASS' sp_melee_live_actions.log
          test "$(find /tmp/sp_realgame -maxdepth 1 -name 'sp_melee_game_qa_*.png' | wc -l)" -eq 6
          test "$(find /tmp/sp_realgame -maxdepth 1 -name 'sp_melee_walk_qa_*.png' | wc -l)" -eq 6
          test "$(find /tmp/sp_realgame -maxdepth 1 -name 'sp_v255_gun_*.png' | wc -l)" -eq 4
      - name: Preserve six native in-world screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP-Melee-Actual-Original-Game-6Angles-${{ github.sha }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            /tmp/sp_realgame/sp_melee_game_qa_*.png
            /tmp/sp_realgame/sp_melee_walk_qa_*.png
            /tmp/sp_realgame/sp_v255_gun_*.png
            sp_melee_live_*.log
