name: SP Single-Sprite Full-Body NPC Animation — Native Visual QA

on:
  push:
    branches: [sp-unified-fullbody-sprite-gait-20261023]
    paths:
      - tools/build_sp_unified_fullbody.py
      - npc_visuals/sp_unified_fullbody_actor.gd
      - tools/qa_sp_unified_fullbody.gd
      - .github/workflows/sp-unified-fullbody-native-qa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  one-whole-character:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            melee-six-prototype/assets/approved_clean_torso_right.png
            assets/sp_npc_simple/sp_simple_bandit_male_01.png
            tools/build_sp_unified_fullbody.py
            npc_visuals/sp_unified_fullbody_actor.gd
            tools/qa_sp_unified_fullbody.gd
            .github/workflows/sp-unified-fullbody-native-qa.yml
      - name: Bake ONE entire human in each frame (player and bandit)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 tools/build_sp_unified_fullbody.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path("assets/sp_unified_character")
          m=json.loads((root/"manifest.json").read_text())
          assert m["no_static_torso_layer"] and m["no_procedural_or_skeletal_legs"]
          assert m["no_parallel_character_skeleton"]
          assert len(list(root.glob("*/idle/*.png")))==16
          assert len(list(root.glob("*/walk/*.png")))==32
          assert len(list(root.glob("*/run/*.png")))==32
          for f in root.glob("*/*/*.png"):
            with Image.open(f) as img:
              assert img.mode=="RGBA" and img.size==(64,96)
          print("PASS: 80 RGBA whole-character frames, no runtime separate legs")
          PY
      - name: Prepare standalone actual Godot actor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/assets game/npc_visuals game/tools
          cp -a assets/sp_unified_character game/assets/
          cp npc_visuals/sp_unified_fullbody_actor.gd game/npc_visuals/
          cp tools/qa_sp_unified_fullbody.gd game/tools/
          cat > game/project.godot <<'EOF'
          config_version=5
          [application]
          config/name="Survival Paradise FULL BODY single sprite QA"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          curl -fL --retry 3 -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path game --quit > godot_import.log 2>&1 ||
            { tail -100 godot_import.log; exit 1; }
      - name: Native Godot test — no separately rendered static body and legs
        shell: bash
        run: |
          set -euo pipefail
          timeout 130s xvfb-run -a -s '-screen 0 1280x720x24' \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --path game --resolution 1100x650 --script res://tools/qa_sp_unified_fullbody.gd \
            > native_fullbody_qa.log 2>&1 || { tail -150 native_fullbody_qa.log; exit 1; }
          grep -q SP_SINGLE_SPRITE_FULL_BODY_NATIVE_GODOT_PASS native_fullbody_qa.log
          grep -q SP_SINGLE_SPRITE_NO_STATIC_TORSO_OR_SEPARATE_LEG_PASS native_fullbody_qa.log
          test "$(find game/fullbody_frames -name 'walk_*.png' | wc -l)" -eq 32
          test "$(find game/fullbody_frames -name 'idle_*.png' | wc -l)" -eq 8
          test "$(find game/fullbody_frames -name 'run_*.png' | wc -l)" -eq 32
      - name: Real Godot GIF and evidence frames
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          out=Path("assets/sp_unified_character/qa")
          out.mkdir(parents=True,exist_ok=True)
          for mode,count in (("idle",8),("walk",32),("run",32)):
              files=[Path("game/fullbody_frames")/("%s_%02d.png"%(mode,k)) for k in range(count)]
              frames=[Image.open(p).convert("RGB") for p in files]
              unique=len({hashlib.sha256(i.tobytes()).hexdigest() for i in frames})
              assert unique>=(2 if mode=="idle" else 8),(mode,unique)
              frames[0].save(out/f"native_{mode}.gif",save_all=True,append_images=frames[1:],
                             duration=(130 if mode=="idle" else 70),loop=0,optimize=True)
              for index in ([0] if mode=="idle" else [0,8,16,24]):
                  frames[index].save(out/f"{mode}_{index:02d}.png",optimize=True)
              print("SP_FULLBODY_QA",mode,"unique_rendered",unique)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SP_UNIFIED_FULLBODY_ONE_SPRITE_GODOT_UNAPPROVED
          path: |
            assets/sp_unified_character/
            native_fullbody_qa.log
          retention-days: 30
      - name: Commit isolated art and actual native Godot preview — no playable game changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Survival Paradise Full Body Animation QA"
          git config user.email "actions@users.noreply.github.com"
          git add --sparse assets/sp_unified_character
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bake and render 80 unified player and bandit full-body frames; pending human visual QA"
          git push origin HEAD:sp-unified-fullbody-sprite-gait-20261023
