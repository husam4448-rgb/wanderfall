name: Survival Paradise V48 Stabilized Walking Animation
on:
  push:
    branches: [sp-native-v48-stabilized-walk-20261030]
    paths:
      - 'survival-paradise/native-game/**'
      - '.github/workflows/sp-v48-native-stabilized-walk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'survival-paradise/native-game/**'
      - '.github/workflows/sp-v48-native-stabilized-walk.yml'
  workflow_dispatch:
jobs:
  native-android-game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract unchanged approved PNGs from V31 source
        run: |
          python3 survival-paradise/native-game/tools/extract_locked_atlases.py
          test -s survival-paradise/native-game/app/src/main/assets/body.png
          test -s survival-paradise/native-game/app/src/main/assets/gear.png
      - name: Decode original outline reference and original-palette walking atlas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,struct
          root=Path('survival-paradise/native-game')
          for source,output,sha,dims in [
            ('approved_v43_walk.png.b64','user_reference_outline_v43.png',
             '49a40aaf2136c2cafee6850d47d4d8720808939b8a89b8e16439e0130da9c7fc',(800,260)),
            ('approved_v44_walk_palette.png.b64','approved_v44_walk_palette.png',
             'fd01230e9c13ffd3087e933abe976a2179d80e9adc9b0710f899a7bef7fc3d71',(1040,160))
          ]:
            data=base64.b64decode((root/'tools'/source).read_text().strip(),validate=True)
            assert hashlib.sha256(data).hexdigest()==sha
            assert data[:8]==b'\x89PNG\r\n\x1a\n'
            assert struct.unpack('>II',data[16:24])==dims
            (root/'app/src/main/assets'/output).write_bytes(data)
            print('SHA-256 locked',output,sha)
          PY
      - name: Test every original character identity pixel and leg outline
        run: |
          mkdir -p /tmp/sp-v44-classes
          javac -d /tmp/sp-v44-classes \
            survival-paradise/native-game/tools/IdentityWalkV44Test.java \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/AnimationCycle.java
          java -Djava.awt.headless=true -cp /tmp/sp-v44-classes \
            com.survivalparadise.nativegame.IdentityWalkV44Test \
            survival-paradise/native-game/app/src/main/assets/body.png \
            survival-paradise/native-game/app/src/main/assets/user_reference_outline_v43.png \
            survival-paradise/native-game/app/src/main/assets/approved_v44_walk_palette.png
          python3 - <<'PY'
          from pathlib import Path
          r=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/GameView.java').read_text()
          assert 'atlas(c,approvedWalkColors!=null?approvedWalkColors:body' in r
          assert 'playerAnimation.isWalking()?walkMask:bodyMask' in r
          assert 'e.animation.isWalking()?walkMask:bodyMask' in r
          assert 'approved_v43_walk.png' not in r
          assert 'walk_corrected_v42.png' not in r
          assert 'approved_v44_walk_palette.png' in r
          print('PASS: four walking silhouettes, unchanged original V41 body and weapon graphics')
          PY
      - name: Decode approved V29 reference axe into transparent asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          root=Path('survival-paradise/native-game')
          encoded=(root/'tools/approved_v29_axe.png.b64').read_text().strip()
          payload=base64.b64decode(encoded,validate=True)
          assert payload[:8] == b'\x89PNG\r\n\x1a\n'
          assert hashlib.sha256(payload).hexdigest() == 'f0d146757318e620024cae0c2a34243bdd9339a939a7f51e5428ae8250620dee'
          asset=root/'app/src/main/assets/approved_v29_axe.png'
          asset.write_bytes(payload)
          print('Approved red axe overlay restored; transparent image hash verified')
          PY
      - name: Verify torso-centered grip and left/right barrel alignment at all angles
        run: |
          mkdir -p /tmp/sp-v35-classes
          javac -d /tmp/sp-v35-classes \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/Ballistics.java \
            survival-paradise/native-game/tools/BallisticsTest.java
          java -cp /tmp/sp-v35-classes com.survivalparadise.nativegame.BallisticsTest
      - name: Verify exact two-pose head breathing and walk restart
        run: |
          mkdir -p /tmp/sp-v37-classes
          javac -d /tmp/sp-v37-classes \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/AnimationCycle.java \
            survival-paradise/native-game/tools/AnimationCycleTest.java
          java -cp /tmp/sp-v37-classes com.survivalparadise.nativegame.AnimationCycleTest
          python3 - <<'PY'
          from pathlib import Path
          root=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          game=(root/'GameView.java').read_text()
          assert 'walkClock' not in game and 'friend.walk' not in game and 'e.walk' not in game
          assert 'playerAnimation.step(moving,dt,7f)' in game
          assert 'playerAnimation.frame()' in game
          assert 'friend.animation.step(' in game and 'e.animation.step(' in game
          assert 'void releaseControls(){stopWalking();' in game
          assert 'frame=move>0?' not in game
          assert 'character(c,playerX,playerY,gun,face,playerAnimation.frame()' in game
          assert 'idleBody(c,frame,s,breath)' in game
          assert 'Float.POSITIVE_INFINITY:playerAnimation.breathOffset()' in game
          assert 'Float.POSITIVE_INFINITY:f.animation.breathOffset()' in game
          assert 'Float.POSITIVE_INFINITY:e.animation.breathOffset()' in game
          assert 'if(breath!=Float.POSITIVE_INFINITY)c.translate(0,breath*s)' not in game
          assert 'APPROVED_PLANTED_IDLE_FRAME=2' in game # V3-style planted boots from unchanged V31
          assert 'src.set(sx,IDLE_HEAD_BODY_SPLIT,sx+260,160)' in game # original feet fixed
          assert 'src.set(sx,0,sx+260,IDLE_HEAD_OVERLAP)' in game # breathing head only
          assert 'IDLE_HEAD_BODY_SPLIT=92' in game
          assert 'IDLE_HEAD_OVERLAP=101' in game
          anim=(root/'AnimationCycle.java').read_text()
          assert 'IDLE_PHASES=2' in anim and 'BREATH_OFFSETS={0f,-4f}' in anim
          assert 'BREATH_OFFSETS={0f,-4f,-2f}' not in anim
          print('PASS: source frame 2 planted feet static; only head moves in idle')
          PY
      - name: Validate original 10x13 approved planted-foot stance
        run: |
          mkdir -p /tmp/sp-v39-classes
          javac -d /tmp/sp-v39-classes survival-paradise/native-game/tools/IdleFeetTest.java
          java -cp /tmp/sp-v39-classes com.survivalparadise.nativegame.IdleFeetTest \
            survival-paradise/native-game/app/src/main/assets/body.png
      - name: Verify mirrored rifles and precise swept sprite silhouette hits
        run: |
          mkdir -p /tmp/sp-v41-classes
          javac -d /tmp/sp-v41-classes \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/Ballistics.java \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/CharacterCollision.java \
            survival-paradise/native-game/tools/CharacterCollisionTest.java
          java -cp /tmp/sp-v41-classes com.survivalparadise.nativegame.CharacterCollisionTest \
            survival-paradise/native-game/app/src/main/assets/body.png
          python3 - <<'PY'
          from pathlib import Path
          r=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          game=(r/'GameView.java').read_text()
          b=(r/'Ballistics.java').read_text()
          assert 'CharacterCollision.firstHit' in game
          assert 'Ballistics.segmentCircle(bullet.x,bullet.y' not in game
          assert 'Math.abs(dx)' in b and 'Math.max(0f,facing*dx)' not in b
          assert 'Movement joystick is locomotion ONLY' in game
          print('V41 source guards PASS: no circular head hitbox or 90-degree mirrored aiming clamp')
          PY
      - name: V47 shadow geometry and solar clock regression
        run: |
          mkdir -p /tmp/sp-v47-classes
          javac -d /tmp/sp-v47-classes \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/Ballistics.java \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/ShadowGeometryV47.java \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/GameClockV47.java \
            survival-paradise/native-game/tools/ShadowDayNightV47Test.java \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/LightGeometryV45.java \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/LightMathV46.java \
            survival-paradise/native-game/tools/LightingV46Test.java
          java -cp /tmp/sp-v47-classes com.survivalparadise.nativegame.ShadowDayNightV47Test
          java -cp /tmp/sp-v47-classes com.survivalparadise.nativegame.LightingV46Test
          python3 - <<'PY'
          from pathlib import Path
          root=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          game=(root/'GameView.java').read_text()
          light=(root/'LightingV47.java').read_text()
          clock=(root/'GameClockV47.java').read_text()
          activity=(root/'MainActivity.java').read_text()
          assert 'final LightingV47 lighting=new LightingV47()' in game
          assert 'populateLightBlockers()' in game and 'addCharacterShadow(e.x,e.y)' in game
          assert 'lighting.occludeRect(' in game and 'lighting.render(c,camX,camY,viewW,viewH,lightAlpha' in game
          assert 'ShadowGeometryV47.blocksAny' in light and 'if(shadowed(' in light
          assert 'tintBitmap.setPixels(' in light # colored reflections also cast shadows
          assert 'GameClockV47 clock=' in game and 'clock.advance(' in game
          assert 'clock.display()' in game and 'clockMinutes' in game and 'clockDay' in game
          assert 'autoDayNight' in activity and 'dayLength' in activity
          assert 'Movement joystick is locomotion ONLY' in game
          assert 'Right-stick aim persists when released/centered' in game
          assert 'if(!firing){\n                int nextFacing=' not in game
          assert 'Bandit closest=nearest(playerX,playerY,680)' not in game
          assert 'onWindowFocusChanged(boolean hasFocus)' in activity
          assert 'WindowInsetsController' in activity
          assert 'approvedWalkColors' in game
          print('V47 SOURCE GUARDS PASS: all lights cast shadows, aim independent, solar cycle, V46 fullscreen and V44 assets')
          PY
      - name: Verify V48 pixel-exact walking frame horizontal stabilization
        run: |
          mkdir -p /tmp/sp-v48-classes
          javac -d /tmp/sp-v48-classes \
            survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/WalkAlignmentV48.java \
            survival-paradise/native-game/tools/WalkAlignmentV48Test.java
          java -Djava.awt.headless=true -cp /tmp/sp-v48-classes \
            com.survivalparadise.nativegame.WalkAlignmentV48Test \
            survival-paradise/native-game/app/src/main/assets/approved_v44_walk_palette.png
          python3 - <<'PY'
          from pathlib import Path
          r=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          s=(r/'GameView.java').read_text()
          assert 'c.translate(WalkAlignmentV48.sourceOffsetX(frame)*s,0f)' in s
          assert 'WalkAlignmentV48.worldOffsetX(playerAnimation.frame(),face,scale)' in s
          assert 'WalkAlignmentV48.worldOffsetX(e.animation.frame(),e.face,scale)' in s
          assert 'else idleBody(c,frame,s,breath)' in s
          assert 'aimX=face*Math.abs(aimX)' not in s
          assert 'final LightingV47 lighting=new LightingV47()' in s
          assert 'clock.advance(' in s
          assert 'addCharacterShadow' in s
          print('PASS V48: body-only alignment, matching projectile collision, untouched idle, aim lock, lighting, and solar clock')
          PY
      - name: Verify this is a REAL native game, not the previous WebView simulation
        run: |
          set -eu
          ! grep -R 'import android.webkit.WebView;' survival-paradise/native-game/app/src/main/java/
          python3 - <<'PY'
          from pathlib import Path
          s=(Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/GameView.java')).read_text()
          assert 'extends View' in s and 'onDraw(Canvas' in s
          assert 'onTouchEvent(MotionEvent' in s and 'void shoot(' in s
          assert 'void spawnWave(' in s and 'void saveProgress(' in s
          assert 'import android.webkit' not in s and 'new WebView(' not in s, 'Native game must not embed WebView'
          print('NATIVE 2D GAME SYSTEMS PRESENT')
          PY
      - name: Compile real Android game APK
        working-directory: survival-paradise/native-game
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify approved art bytes and Android APK
        run: |
          set -euo pipefail
          APK="survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep 'assets/body.png'
          unzip -l "$APK" | grep 'assets/gear.png'
          unzip -l "$APK" | grep 'assets/approved_v29_axe.png'
          unzip -l "$APK" | grep 'assets/approved_v44_walk_palette.png'
          test "$(unzip -p "$APK" assets/approved_v44_walk_palette.png | sha256sum | cut -d' ' -f1)" = "fd01230e9c13ffd3087e933abe976a2179d80e9adc9b0710f899a7bef7fc3d71"
          test "$(unzip -p "$APK" assets/approved_v29_axe.png | sha256sum | cut -d' ' -f1)" = "f0d146757318e620024cae0c2a34243bdd9339a939a7f51e5428ae8250620dee"
          unzip -p "$APK" assets/body.png | sha256sum > /tmp/apk-body.sha
          sha256sum survival-paradise/native-game/app/src/main/assets/body.png > /tmp/orig-body.sha
          diff -u <(cut -d' ' -f1 /tmp/apk-body.sha) <(cut -d' ' -f1 /tmp/orig-body.sha)
          unzip -p "$APK" assets/gear.png | sha256sum > /tmp/apk-gear.sha
          sha256sum survival-paradise/native-game/app/src/main/assets/gear.png > /tmp/orig-gear.sha
          diff -u <(cut -d' ' -f1 /tmp/apk-gear.sha) <(cut -d' ' -f1 /tmp/orig-gear.sha)
          echo 'LOCKED ASSETS VALIDATED BYTE-FOR-BYTE IN APK'
      - name: Assemble downloadable native-game release
        run: |
          mkdir -p artifacts
          cp survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk artifacts/Survival_Paradise_V48_Native_Game.apk
          cp survival-paradise/native-game/app/src/main/assets/atlas_provenance.json artifacts/
          cd survival-paradise && zip -qr ../artifacts/Survival_Paradise_V48_Native_Source.zip native-game -x 'native-game/.gradle/*' 'native-game/app/build/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP_V48_Native_Game_APK_and_Source
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
