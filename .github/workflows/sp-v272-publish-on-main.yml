name: Publish Survival Paradise v272 S8 physics recovery public APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  public_release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download APK from verified successful v272 native build
        uses: actions/download-artifact@v4
        with:
          name: SP-PlayableWorld-v272
          repository: husam4448-rgb/wanderfall
          run-id: 39622127320
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Validate original verified package and signature metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="release/SurvivalParadise-WorldAssets-v272.apk"
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 25000000
          test "$(stat -c%s "$APK")" -lt 62914560
          unzip -t "$APK" > /tmp/sp267_apk_zip_validation.log
          test -s "release/apk-signature.txt"
          test -s "release/apk-badging.txt"
          grep -q "versionCode='280'" "release/apk-badging.txt"
          grep -q "versionName='0.21.0D2D.14-v272'" "release/apk-badging.txt"
          grep -Eq 'Verified using v2 scheme|Verified using v3 scheme' release/apk-signature.txt
          # Original signed package has already passed its native CI checks;
          # the archived checksum embeds the runner's absolute working path,
          # so validate the downloaded copy's package metadata and generate
          # a fresh portable digest rather than resolving a stale path.
          sha256sum "$APK" | tee release/SP272_PUBLIC_RELEASE_SHA256.txt

      - name: Publish public direct-download Android APK (no GitHub login)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: husam4448-rgb/wanderfall
        run: |
          set -euo pipefail
          TAG=sp-world-v272
          APK=release/SurvivalParadise-WorldAssets-v272.apk
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" release/SP272_PUBLIC_RELEASE_SHA256.txt --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" "$APK" release/SP272_PUBLIC_RELEASE_SHA256.txt \
              --repo "$GH_REPO" \
              --target "850d995fa0a60e858d8682fad172406d35fb39dc" \
              --title "Survival Paradise v272 — Galaxy S8 Physics Recovery Test APK" \
              --notes "Experimental Galaxy S8 physics catch-up recovery, based on measured 3-4 FPS at 60 physics ticks and 10 FPS at 20 ticks, with 57 FPS at true pause. On detected Galaxy S8, the game now requests 20 physics ticks per second and caps physics catch-up at one step per rendered frame. Adds reversible sleeping of distant ambient actors, in-game S8 low-end override controls, preserves nine-biome survival gameplay and authored sprite world. ARM64 Android package versionCode 280, signed, native Godot QA and APK validation passed. Device FPS improvement NOT YET VERIFIED."
          fi
          gh release view "$TAG" --repo "$GH_REPO" --json assets,url,tagName --jq '{tag: .tagName, release: .url, assets: [.assets[].name]}'
