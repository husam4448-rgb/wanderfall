name: PC22 Arm Visual Fix V2

on:
  push:
    branches: [ pc22-arm-visual-fix-v2 ]
    paths:
      - '.ci/trigger-pc22-arm-visual-fix-v2'
      - '.github/workflows/pc22-arm-visual-fix-v2.yml'
      - 'tools/qa_pc22_arm_visual_contract.py'
      - 'tools/build_pc22_canonical_arm_assets.py'
      - 'patches/apply_pc22_canonical_arm_candidate.py'
      - 'assets/authored2d/unified_character/arms/reference_targets/visual_contract.json'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pc22-arm-visual-fix-v2
          fetch-depth: 1
      - name: Install image QA dependency
        run: python3 -m pip install --quiet pillow
      - name: Verify patch syntax
        run: python3 -m py_compile patches/apply_pc22_canonical_arm_candidate.py
      - name: Run visual reference contract
        run: python3 tools/qa_pc22_arm_visual_contract.py "$GITHUB_WORKSPACE"
