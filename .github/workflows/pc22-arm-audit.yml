name: PC22 Canonical Arm Runtime Audit

on:
  push:
    branches: [ pc22-canonical-arm-system ]
    paths:
      - '.ci/trigger-pc22-arm-audit'
      - '.github/workflows/pc22-arm-audit.yml'
      - 'tools/audit_pc22_arm_runtime.py'
      - 'tools/build_pc22_canonical_arm_assets.py'
      - 'tools/render_pc22_arm_qa.py'
      - 'tools/build_pc22_role_overlays.py'
  pull_request:
    branches: [ main ]
    paths:
      - '.ci/trigger-pc22-arm-audit'
      - '.github/workflows/pc22-arm-audit.yml'
      - 'tools/audit_pc22_arm_runtime.py'
      - 'tools/build_pc22_canonical_arm_assets.py'
      - 'tools/render_pc22_arm_qa.py'
      - 'tools/build_pc22_role_overlays.py'

concurrency:
  group: pc22-arm-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_SHA256: ae4eff17e5f281f5867ac2d82207fcf96e6c8b649432acd48816aebab76fa308
  SOURCE_ARCHIVE: /tmp/Wanderfall_Phase16_Game_Source.tar.xz
  PROJECT_DIR: game

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Reconstruct exact PlayerCharacters_v22 runtime
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part_*.b64 > /tmp/wanderfall_source.b64
          base64 --decode /tmp/wanderfall_source.b64 > "$SOURCE_ARCHIVE"
          echo "$SOURCE_SHA256  $SOURCE_ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT_DIR"
          tar -xJf "$SOURCE_ARCHIVE" -C "$PROJECT_DIR"
          python3 patches/apply_godot_47_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v017_ui_overhaul.py "$PROJECT_DIR"
          python3 patches/apply_v0171_inventory_polish.py "$PROJECT_DIR"
          python3 patches/apply_v0172_hud_customization.py "$PROJECT_DIR"
          python3 patches/fix_v0173_applicator_path.py
          python3 patches/apply_v0173_touch_layout_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v0174_ui_pause_completion.py "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patches/apply_v0175_hotbar_sensitivity.py')
          s = p.read_text(encoding='utf-8')
          old = '''replace_once(
              "scripts/settings/settings_hud.gd",
              '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n\\n    var pause_names :=',
              '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n'
              '    if movement_sensitivity_slider != null:\\n'
              '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'
              '    if movement_sensitivity_label != null:\\n'
              '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'
              '    var pause_names :=',
          )'''
          new = '''replace_once(
              "scripts/settings/settings_hud.gd",
              '    var pause_names :=',
              '    if movement_sensitivity_slider != null:\\n'
              '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'
              '    if movement_sensitivity_label != null:\\n'
              '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'
              '    var pause_names :=',
          )'''
          if old not in s:
              raise SystemExit('Expected v0.17.5 applicator block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 patches/apply_v0175_hotbar_sensitivity.py "$PROJECT_DIR"
          python3 patches/apply_v0176_hotbar_deadzone.py "$PROJECT_DIR"
          python3 patches/apply_v0177_mobile_hotbar_layers.py "$PROJECT_DIR"
          python3 patches/apply_v0178_dedicated_hotbar_layer.py "$PROJECT_DIR"
          python3 -m pip install --quiet pillow numpy
          python3 patches/apply_v0179_quick_item_buttons.py "$PROJECT_DIR"
          grep -q 'PLAYER CHARACTERS V22' "$PROJECT_DIR/scripts/art/d2d29_minimal_token_runtime.gd"

      - name: Extract canonical arm evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_pc22_arm_runtime.py "$GITHUB_WORKSPACE" "$PROJECT_DIR"
          test -s assets/authored2d/unified_character/arms/qa/runtime_arm_audit.json
          test -s assets/authored2d/unified_character/arms/qa/runtime_arm_excerpt.gd.txt

      - name: Build canonical arm candidate assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_pc22_canonical_arm_assets.py "$GITHUB_WORKSPACE" "$PROJECT_DIR"
          test -s assets/authored2d/unified_character/core/male/arm_spec.json
          test -s assets/authored2d/unified_character/core/female/arm_spec.json
          test -s assets/authored2d/unified_character/arms/qa/numerical_qa.json

      - name: Render magnified visual QA evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/render_pc22_arm_qa.py "$GITHUB_WORKSPACE"
          test -s assets/authored2d/unified_character/arms/qa/male_arm_contact_sheet.jpg
          test -s assets/authored2d/unified_character/arms/qa/female_arm_contact_sheet.jpg
          test -s assets/authored2d/unified_character/arms/qa/male_aim_sweep.gif
          test -s assets/authored2d/unified_character/arms/qa/female_aim_sweep.gif

      - name: Build canonical role overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_pc22_role_overlays.py "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path("assets/authored2d/unified_character")
          meta=root/"arms/metadata/role_overlays.json"
          sheet=root/"arms/qa/role_overlays_contact_sheet.jpg"
          assert meta.is_file() and meta.stat().st_size>0
          assert sheet.is_file() and sheet.stat().st_size>0
          data=json.loads(meta.read_text(encoding="utf-8"))
          assert data.get("sleeve_asset_count")==24, data
          assert data.get("role_glove_count")==24, data
          assert data.get("role_torso_count")==12, data
          assert len(list((root/"arms/sleeves").glob("*/*/*.png")))==24
          assert len(list((root/"arms/gloves").glob("*/*/glove_dominant.png")))==12
          assert len(list((root/"arms/gloves").glob("*/*/glove_support.png")))==12
          assert len(list((root/"roles").glob("*/*/torso.png")))==12
          print("PC22_ROLE_OVERLAY_WORKSPACE_OK:24_SLEEVES:24_GLOVES:12_TORSOS")
          PY

      - name: Commit audit evidence and passing candidate assets
        shell: bash
        run: |
          set -euo pipefail
          git restore -- patches/apply_v0175_hotbar_sensitivity.py || true

          rm -rf /tmp/pc22-arm-audit-output
          mkdir -p /tmp/pc22-arm-audit-output/arms
          mkdir -p /tmp/pc22-arm-audit-output/core/male
          mkdir -p /tmp/pc22-arm-audit-output/core/female
          mkdir -p /tmp/pc22-arm-audit-output/roles
          cp -a assets/authored2d/unified_character/arms/. /tmp/pc22-arm-audit-output/arms/
          cp assets/authored2d/unified_character/core/male/arm_spec.json /tmp/pc22-arm-audit-output/core/male/
          cp assets/authored2d/unified_character/core/female/arm_spec.json /tmp/pc22-arm-audit-output/core/female/
          cp -a assets/authored2d/unified_character/roles/. /tmp/pc22-arm-audit-output/roles/

          git config user.name "Survival Paradise Arm QA Bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin pc22-canonical-arm-system
            git reset --hard origin/pc22-canonical-arm-system

            mkdir -p assets/authored2d/unified_character/arms
            mkdir -p assets/authored2d/unified_character/core/male
            mkdir -p assets/authored2d/unified_character/core/female
            mkdir -p assets/authored2d/unified_character/roles
            cp -a /tmp/pc22-arm-audit-output/arms/. assets/authored2d/unified_character/arms/
            cp /tmp/pc22-arm-audit-output/core/male/arm_spec.json assets/authored2d/unified_character/core/male/
            cp /tmp/pc22-arm-audit-output/core/female/arm_spec.json assets/authored2d/unified_character/core/female/
            cp -a /tmp/pc22-arm-audit-output/roles/. assets/authored2d/unified_character/roles/

            git add assets/authored2d/unified_character/arms/ \
                    assets/authored2d/unified_character/core/male/arm_spec.json \
                    assets/authored2d/unified_character/core/female/arm_spec.json \
                    assets/authored2d/unified_character/roles/
            if git diff --cached --quiet; then
              echo "Arm audit and role overlays already current."
              exit 0
            fi
            git commit -m "Audit PC22 arms and canonical role overlays"
            if git push origin HEAD:pc22-canonical-arm-system; then
              exit 0
            fi
            sleep $((attempt*3))
          done
          exit 1
