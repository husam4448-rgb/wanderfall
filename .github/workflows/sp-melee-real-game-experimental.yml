name: SP Melee — Original Playable Game Experimental Integration
on:
  push:
    branches: [sp-melee-knife-orientation-and-gait]
    paths:
      - 'patches/apply_sp_melee_phase16_experimental.py'
      - '.github/workflows/sp-melee-real-game-experimental.yml'
      - 'melee-six-prototype/MeleeController.gd'
      - 'melee-six-prototype/SlashMath.gd'
      - 'melee-six-prototype/SurvivorWalkSprite.gd'
      - 'tools/build_sp_melee_walk_layers.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-game:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GAME_DIR: /tmp/sp_original_melee_game
      GODOT_BIN: /tmp/Godot_v4.7.2-stable_linux.x86_64
      APK_PATH: SurvivalParadise-Experimental-Melee-GaitFix.apk
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact source and apply bounded combat patch
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          python3 -m py_compile patches/apply_sp_melee_phase16_experimental.py
          cat source_parts/part_*.b64 | base64 -d > /tmp/sp_source.tar.xz
          echo 'ae4eff17e5f281f5867ac2d82207fcf96e6c8b649432acd48816aebab76fa308  /tmp/sp_source.tar.xz' | sha256sum -c -
          mkdir -p "$GAME_DIR"
          tar -xJf /tmp/sp_source.tar.xz -C "$GAME_DIR"
          python3 patches/apply_godot_47_fixes.py "$GAME_DIR"
          python3 patches/apply_sp_melee_phase16_experimental.py "$GAME_DIR"
          test -s "$GAME_DIR/scripts/player.gd"
          test -s "$GAME_DIR/assets/sp_melee/MeleeController.gd"
          test -s "$GAME_DIR/assets/sp_melee/approved_near_leg.png"
          test -s "$GAME_DIR/assets/sp_melee/approved_far_leg.png"
          grep -q 'SP_SixAngleRotatingKnife' "$GAME_DIR/scripts/player.gd"
      - name: Prepare Godot 4.7.2 native game engine
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
      - name: Parse and import the entire original playable game
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GAME_DIR" --quit >sp_melee_phase16_parser.log 2>&1
          cat sp_melee_phase16_parser.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' sp_melee_phase16_parser.log; then exit 1; fi
      - name: Smoke real game with new gameplay player
        run: |
          set -euo pipefail
          timeout 90s "$GODOT_BIN" --headless --path "$GAME_DIR" --quit-after 180 >sp_melee_phase16_smoke.log 2>&1
          cat sp_melee_phase16_smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid get index' sp_melee_phase16_smoke.log; then exit 1; fi
      - name: Set Java 17, Android SDK and app identity
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Export and verify experimental Android APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          curl -fL --retry 3 -o /tmp/export.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/export.tpz' | sha256sum -c -
          mkdir -p /tmp/sp_android_export
          unzip -q /tmp/export.tpz -d /tmp/sp_android_export
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -a /tmp/sp_android_export/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          mkdir -p "$HOME/.android"
          base64 --decode signing/survival_paradise_debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sp_original_melee_game/export_presets.cfg')
          s=p.read_text(encoding='utf-8')
          s=s.replace('version/code=16','version/code=251',1)
          s=s.replace('version/name="0.16.0"','version/name="0.16.0-EXP-MELEE-GAIT"',1)
          s=s.replace('package/unique_name="org.wanderfall.game"','package/unique_name="org.survivalparadise.meleeexp"',1)
          s=s.replace('package/name="Wanderfall"','package/name="SP Melee Experimental"',1)
          p.write_text(s,encoding='utf-8')
          PY
          "$GODOT_BIN" --headless --path "$GAME_DIR" --export-debug Android "$GITHUB_WORKSPACE/$APK_PATH" >sp_melee_phase16_export.log 2>&1
          cat sp_melee_phase16_export.log
          test -s "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          "$SDK/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK_PATH" >sp_melee_phase16_signature.txt
          "$SDK/build-tools/35.0.1/aapt" dump badging "$APK_PATH" >sp_melee_phase16_identity.txt
          grep -q "name='org.survivalparadise.meleeexp'" sp_melee_phase16_identity.txt
          grep -q "versionCode='251'" sp_melee_phase16_identity.txt
          sha256sum "$APK_PATH" >sp_melee_phase16_sha256.txt
      - name: Retain proof, actual APK and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP-Melee-Real-Game-EXP-Phase16-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            SurvivalParadise-Experimental-Melee-GaitFix.apk
            sp_melee_phase16_*.log
            sp_melee_phase16_*.txt
