name: Survival Paradise V138 - Emulator Headgear Visual QA
on:
  push:
    branches: [sp-native-v138-headgear-visuals-disabled-20261114]
    paths: ['.github/workflows/sp-v138-headgear-visual-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download signed V138 debug test APK from public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sp138
          gh release download survival-paradise-v138-headgear-visuals-off-test \
            --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir /tmp/sp138
          test -s /tmp/sp138/*.apk
      - name: Enable Android emulator KVM access
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          else
            echo "No /dev/kvm device: emulator may run slowly"
          fi
      - name: Launch app and capture actual Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 1536
          disable-animations: false
          script: |
            set -eu
            mkdir -p /tmp/sp138/visual
            adb wait-for-device
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            adb shell wm size 1920x1080 || true
            adb shell wm density 260 || true
            adb install /tmp/sp138/*.apk
            adb shell am start -n com.survivalparadise.nativegame.v138headgearofftest/com.survivalparadise.nativegame.MainActivity
            sleep 8
            # Android's first immersive-mode launch can display a blue
            # "Viewing full screen" coach mark over the character preview.
            # Dismiss its safe-area "Got it" button before taking evidence.
            adb shell input tap 1130 330
            sleep 2
            adb shell screencap -p /sdcard/sp138_menu.png
            adb pull /sdcard/sp138_menu.png /tmp/sp138/visual/01_menu.png
            # The canvas menu is drawn with logical height 660. At 1920x1080,
            # its NEW GAME button center is approximately (744, 618).
            adb shell input tap 744 618
            sleep 8
            # Android may show the fullscreen coach mark only after gameplay
            # enters immersive mode; dismiss it a second time before capture.
            adb shell input tap 1130 330
            sleep 2
            adb shell screencap -p /sdcard/sp138_gameplay.png
            adb pull /sdcard/sp138_gameplay.png /tmp/sp138/visual/02_gameplay.png
            adb logcat -d -t 1000 > /tmp/sp138/visual/logcat_tail.txt
            test -s /tmp/sp138/visual/01_menu.png
            test -s /tmp/sp138/visual/02_gameplay.png
      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP_V138_Emulator_Visual_QA
          path: /tmp/sp138/visual/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish screenshots alongside test APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload survival-paradise-v138-headgear-visuals-off-test \
            /tmp/sp138/visual/01_menu.png /tmp/sp138/visual/02_gameplay.png \
            --clobber --repo "$GITHUB_REPOSITORY"
