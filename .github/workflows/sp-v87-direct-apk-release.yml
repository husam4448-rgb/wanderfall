name: Survival Paradise V87 — Direct APK Release
on:
  push:
    branches: [sp-native-v87-bandit-loot-hud-bag-20261101]
    paths: ['.github/workflows/sp-v87-direct-apk-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-v87:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve verified Android APK and complete source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/spv87
          gh run download 41273261877 -R "$GITHUB_REPOSITORY" \
            -n SP_V87_BanditLoot -D /tmp/spv87
          APK=/tmp/spv87/SurvivalParadise_V87_BanditLoot.apk
          SOURCE=/tmp/spv87/SurvivalParadise_V87_Source.zip
          test -s "$APK" && test -s "$SOURCE"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q classes.dex
          for a in body.png approved_v44_walk_palette.png npc_idle_v56.png approved_v29_axe.png gear.png world_props_v74.png; do
            unzip -l "$APK" | grep -q "assets/$a"
          done
          sha256sum "$APK" > /tmp/spv87/V87_APK_SHA256.txt
          cat /tmp/spv87/V87_APK_SHA256.txt
      - name: Publish public V87 APK and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=survival-paradise-v87-bandit-loot-bag
          APK=/tmp/spv87/SurvivalParadise_V87_BanditLoot.apk
          SOURCE=/tmp/spv87/SurvivalParadise_V87_Source.zip
          HASH=/tmp/spv87/V87_APK_SHA256.txt
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SOURCE" "$HASH" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SOURCE" "$HASH" \
              -R "$GITHUB_REPOSITORY" \
              --target a1f5968331fdbb198b0050f28835a9e69a813c9f \
              --title "Survival Paradise V87 — Bandit Loot Bags & Editable HUD BAG" \
              --notes "V87 tested Android APK; CI run 41273261877 passed all 46 automated steps. Bandits drop persistent backpack loot on death; approach and press USE to open side-by-side bandit/player inventories with recognizable item icons. Tap an icon then LOOT, drag icon into player inventory, or LOOT ALL. Partial looting, bag removal after emptying and save/continue are verified against duplication. BAG button has been moved 60 logical px higher above right aiming stick, and is now independently draggable and editable in the on-screen HUD editor and HUD Edit settings for size, position, opacity and enabled state. All original character templates, V86 ground pickups, V85 save export/import, world and classic aiming preserved. IMPORTANT: Android in-place update compatibility still depends on a stable signing certificate; previous debug signed APKs may differ. Export V86 save before uninstalling or replacing when needed. Device visual/FPS verification pending." \
              --prerelease
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" \
            --json url,assets --jq '{url:.url,assets:[.assets[]|{name:.name,url:.url}]}'
