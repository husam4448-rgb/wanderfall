      - name: Prepare Android SDK and Gradle
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build REAL Android APK
        working-directory: survival-paradise/native-game
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify source art and all roles are actually inside the APK
        run: |
          set -euo pipefail
          ROOT=survival-paradise/native-game
          APK=$ROOT/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          for a in body.png gear.png approved_v44_walk_palette.png approved_v29_axe.png stable_v51_body.png npc_roles_v51.png npc_idle_v52.png npc_walk_v56.png npc_idle_v56.png crosshair_v62.png.b64; do
            unzip -l "$APK" | grep -q "assets/$a"
            test "$(unzip -p "$APK" "assets/$a" | sha256sum | cut -d' ' -f1)" = \
                 "$(sha256sum "$ROOT/app/src/main/assets/$a" | cut -d' ' -f1)"
          done
          unzip -l "$APK" | grep -q 'classes.dex'
          echo "V51 BUILD PASS: immutable approved sprites plus 12 playable NPC identities bundled in native APK"
      - name: Package APK, source, and verified animation GIFs
        run: |
          mkdir -p artifacts
          R=survival-paradise/native-game
          cp "$R/app/build/outputs/apk/debug/app-debug.apk" artifacts/Survival_Paradise_V70_Separated_Aim_Circular_Pan.apk
          cp "$R/previews/"*.gif "$R/previews/"*.png artifacts/
          cd survival-paradise
          zip -qr ../artifacts/Survival_Paradise_V70_Source.zip native-game \
            -x 'native-game/.gradle/*' 'native-game/app/build/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP_V70_Separated_Aim_Circular_Pan
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      - name: Report V70 native Android build verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SP_RUN_ID: ${{ github.run_id }}
          SP_SHA: ${{ github.sha }}
          SP_STATUS: ${{ job.status }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/35/comments" \
            -f body="V70_NATIVE_ANDROID | $SP_STATUS | run $SP_RUN_ID | source $SP_SHA | https://github.com/$GITHUB_REPOSITORY/actions/runs/$SP_RUN_ID" || true
