name: PC71B Same Original Art Two Motion Models Native A-B
on:
  push:
    branches: [pc71-native-source-skinned-skeleton-qa]
    paths:
      - 'tools/qa_pc71b_two_rig_modes.py'
      - '.github/workflows/pc71b-source-ik-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-original-pixels-articulation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recover approved original source sprites and joint pivots
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy opencv-python-headless
          python3 tools/pc42_reference_cutout.py
          python3 tools/pc42h_articulated_arm_atlas.py
          mkdir -p pc71b/soft pc71b/ik pc42-static-prototype/evidence
      - name: Install authentic Godot binary
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path pc42-static-prototype --quit >pc71b-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error' pc71b-import.log; then cat pc71b-import.log; exit 1; fi
      - name: Original-source Skeleton2D small-angle gait baseline
        run: |
          set -euo pipefail
          PC42N_SOURCE_FIRST_PREVIEW=1 PC42S_WALK_TEST=1 PC42C_CAPTURE=1 timeout 160s xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path pc42-static-prototype --resolution 1580x660 >pc71b/soft.log 2>&1
          grep -q 'PC42C_REAL_IK_CONTACT_SWEEP_OK' pc71b/soft.log
          cp pc42-static-prototype/evidence/pc42c_motion_*.png pc71b/soft/
      - name: Identical original-source sprites with actual two-bone leg IK
        run: |
          set -euo pipefail
          PC42N_SOURCE_FIRST_PREVIEW=1 PC42S_WALK_TEST=1 PC53_IK_WALK_TEST=1 PC42C_CAPTURE=1 timeout 160s xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path pc42-static-prototype --resolution 1580x660 >pc71b/ik.log 2>&1
          grep -q 'PC53_ORIGINAL_SOURCE_TWO_BONE_IK_READY' pc71b/ik.log
          grep -q 'PC42C_REAL_IK_CONTACT_SWEEP_OK' pc71b/ik.log
          cp pc42-static-prototype/evidence/pc42c_motion_*.png pc71b/ik/
      - name: Preserve genuine 32-frame visual A/B for human art judgement
        run: |
          set -euo pipefail
          python3 tools/qa_pc71b_two_rig_modes.py | tee pc71b-metrics.log
          grep -q 'PC71B_TRUE_GODOT_MOTION_AB_CAPTURE_PASS' pc71b-metrics.log
      - name: Archive native visual inspection and motion metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP-PC71B-OriginalArt-Godot-LegIK-A-B
          path: |
            pc71b/
            pc71b-*.log
          retention-days: 14
