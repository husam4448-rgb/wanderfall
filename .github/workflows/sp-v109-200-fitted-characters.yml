name: Survival Paradise V109 — 200 Approved Characters In-Game Weapon Test
on:
  push:
    branches: [sp-native-v109-200-fitted-no-wearables-20261105]
    paths:
      - 'survival-paradise/native-game/**'
      - '.github/workflows/sp-v109-200-fitted-characters.yml'
  workflow_dispatch:

concurrency:
  group: survival-paradise-v108-fit-lab
  cancel-in-progress: true

jobs:
  verify-native-character-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
            assets/authored2d
            assets/world
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate the exact locked V31/V56 source art
        run: |
          set -euo pipefail
          python3 -m pip install --user -q Pillow numpy
          python3 survival-paradise/native-game/tools/extract_locked_atlases.py
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          r=Path("survival-paradise/native-game")
          for encoded,dest,sha in [
             ("approved_v29_axe.png.b64","approved_v29_axe.png","f0d146757318e620024cae0c2a34243bdd9339a939a7f51e5428ae8250620dee"),
             ("approved_v44_walk_palette.png.b64","approved_v44_walk_palette.png","fd01230e9c13ffd3087e933abe976a2179d80e9adc9b0710f899a7bef7fc3d71")
          ]:
              data=base64.b64decode((r/"tools"/encoded).read_text().strip(),validate=True)
              assert hashlib.sha256(data).hexdigest()==sha,encoded
              (r/"app/src/main/assets"/dest).write_bytes(data)
          PY
          python3 survival-paradise/native-game/tools/build_v51_assets.py
          python3 survival-paradise/native-game/tools/build_v52_idle.py
          python3 survival-paradise/native-game/tools/fix_v53_skin_palette.py
          python3 survival-paradise/native-game/tools/build_v56_approved_character_atlases.py
          python3 survival-paradise/native-game/tools/build_v74_biome_assets.py
          test "$(sha256sum survival-paradise/native-game/app/src/main/assets/body.png | cut -d' ' -f1)" = "141878713a6880d05879b7102c728581dddb55730434bcac8e050fe44b3d82ad"
      - name: Verify approved V109 head-only runtime and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("survival-paradise/native-game")
          source=(root/"app/src/main/java/com/survivalparadise/nativegame/CharacterSkinsV109.java").read_text()
          gradle=(root/"app/build.gradle").read_text()
          assert "versionCode 109" in gradle
          assert "sp_v109_characters.zip" in source
          assert "Math.sin(timeSec*4f)" in source
          assert "new Fit(base)" in source
          assert "boolean walking" in source
          print("V109 source fitting contract + version check: PASS")
          PY
      - name: Test four-frame original gait and planted idle (pure JVM)
        run: |
          set -e
          R=survival-paradise/native-game
          mkdir -p /tmp/sp-v108-jvm
          javac -d /tmp/sp-v108-jvm "$R/app/src/main/java/com/survivalparadise/nativegame/AnimationCycle.java" "$R/tools/AnimationCycleTest.java"
          java -cp /tmp/sp-v108-jvm com.survivalparadise.nativegame.AnimationCycleTest
      - name: Prepare Android 35 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use stable key when already configured
        env:
          SP_KEYSTORE_BASE64: ${{ secrets.SP_SIGNING_KEYSTORE_BASE64 }}
          SP_SIGNING_PASSWORD: ${{ secrets.SP_SIGNING_PASSWORD }}
          SP_SIGNING_KEY_PASSWORD: ${{ secrets.SP_SIGNING_KEY_PASSWORD }}
          SP_SIGNING_ALIAS: ${{ secrets.SP_SIGNING_ALIAS }}
        run: |
          if [ -n "$SP_KEYSTORE_BASE64" ] && [ -n "$SP_SIGNING_PASSWORD" ]; then
            echo "$SP_KEYSTORE_BASE64" | base64 --decode > /tmp/sp_native_stable_keystore.jks
            echo "SP_SIGNING_STORE=/tmp/sp_native_stable_keystore.jks" >> "$GITHUB_ENV"
            echo "SP_SIGNING_PASSWORD=$SP_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "SP_SIGNING_KEY_PASSWORD=$SP_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SP_SIGNING_ALIAS=$SP_SIGNING_ALIAS" >> "$GITHUB_ENV"
          else
            echo "::warning::No stable signing configured; resulting debug build might not upgrade existing installation."
          fi
      - name: Reconstruct and verify 200 approved character sources + V5 fittings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,io,json,hashlib
          root=Path("survival-paradise/native-game")
          parts=sorted((root/"source_v109").glob("part_*.bin"))
          assert len(parts)==8, f"expected 8 exact lossless source segments, found {len(parts)}"
          data=b"".join(p.read_bytes() for p in parts)
          actual=hashlib.sha256(data).hexdigest()
          expected="c8e364bc1485eb5251fa9494889977038268cbac10f455fa844d7b8a46f6dc3a"
          assert actual==expected,(actual,expected)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None,"corrupt source ZIP"
              for i in range(1,201):
                  assert f"heads/{i:03}.png" in z.namelist(),f"head {i} missing"
              pack=json.loads(z.read("v5_fittings.json"))
              assert pack["totalCharacters"]==200
              assert pack["animation"]["idleMode"]=="head-only-breathing"
              assert len(pack["characterOverrides"])==pack["overrideCount"]==51
              assert len(z.read("body_idle.png"))>100
              assert len(z.read("body_walk.png"))>100
          target=root/"app/src/main/assets/sp_v109_characters.zip"
          target.write_bytes(data)
          print("VERIFIED: 200 exact heads, 4 walk poses, static idle body, V5 51 overrides",len(data),actual)
          PY
      - name: V109 runtime integration regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path("survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame")
          game=(d/"GameView.java").read_text()
          skins=(d/"CharacterSkinsV109.java").read_text()
          menu=(d/"MainActivity.java").read_text()
          assert 'characterSkinsV109.draw(c,skinIdV109' in game
          assert 'else if(characterSkinsV109!=null||!bandit)' in game
          assert 'if(characterSkinsV109==null){ // legacy equipment is hidden' in game
          assert 'playerSkinV109' in menu
          assert 'float breathing=walking?0f:' in skins
          assert 'fps=2' in skins
          assert 'void draw(Canvas c,int id,boolean walking' in skins
          print("V109: weapon rig preserved; legacy wearables bypassed; dynamic head-only breathing")
          PY
      - name: Compile Android debug APK
        working-directory: survival-paradise/native-game
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK payload and version
        run: |
          set -e
          APK=survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/body.png'
          unzip -l "$APK" | grep -q 'assets/npc_idle_v56.png'
          unzip -l "$APK" | grep -q 'assets/sp_v109_characters.zip'
          mkdir -p artifacts
          cp "$APK" artifacts/SurvivalParadise_V109_200_Characters_Weapon_Test.apk
          sha256sum artifacts/SurvivalParadise_V109_200_Characters_Weapon_Test.apk > artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP_V109_200_Fitted_No_Wearables_APK
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish V108 APK as direct GitHub prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=survival-paradise-v109-200-characters-weapon-test
          APK=artifacts/SurvivalParadise_V109_200_Characters_Weapon_Test.apk
          SUM=artifacts/SHA256.txt
          test -s "$APK" && test -s "$SUM"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SUM" --target "$GITHUB_SHA" \
              -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Survival Paradise V109 — 200 Approved Characters / Weapons Only" \
              --notes "V109 character preview test: integrates all 200 approved heads with V5 general fitting and 51 individual overrides; static idle body and smooth head-only breathing; original four-frame walking source; hides previous backpack/headgear/armor artwork while retaining weapon and hand rig, gunfire, aiming, inventory and world gameplay. Player roster available in Settings. Stable signing used if configured; otherwise preserve installed save backups."
          fi
