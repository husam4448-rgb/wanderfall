name: Survival Paradise V34 Native Android Playable Game
on:
  push:
    branches: [sp-native-v34-game-20261030]
    paths:
      - 'survival-paradise/native-game/**'
      - '.github/workflows/sp-v34-native-game.yml'
  pull_request:
    branches: [main]
    paths:
      - 'survival-paradise/native-game/**'
      - '.github/workflows/sp-v34-native-game.yml'
  workflow_dispatch:
jobs:
  native-android-game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract unchanged approved PNGs from V31 source
        run: |
          python3 survival-paradise/native-game/tools/extract_locked_atlases.py
          test -s survival-paradise/native-game/app/src/main/assets/body.png
          test -s survival-paradise/native-game/app/src/main/assets/gear.png
      - name: Verify this is a REAL native game, not the previous WebView simulation
        run: |
          set -eu
          ! grep -R -i 'WebView' survival-paradise/native-game/app/src/main/java/ || false
          python3 - <<'PY'
          from pathlib import Path
          s=(Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/GameView.java')).read_text()
          assert 'extends View' in s and 'onDraw(Canvas' in s
          assert 'onTouchEvent(MotionEvent' in s and 'void shoot(' in s
          assert 'void spawnWave(' in s and 'void saveProgress(' in s
          assert 'WebView' not in s, 'Native game must not embed WebView'
          print('NATIVE 2D GAME SYSTEMS PRESENT')
          PY
      - name: Compile real Android game APK
        working-directory: survival-paradise/native-game
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify approved art bytes and Android APK
        run: |
          set -euo pipefail
          APK="survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep 'assets/body.png'
          unzip -l "$APK" | grep 'assets/gear.png'
          unzip -p "$APK" assets/body.png | sha256sum > /tmp/apk-body.sha
          sha256sum survival-paradise/native-game/app/src/main/assets/body.png > /tmp/orig-body.sha
          diff -u <(cut -d' ' -f1 /tmp/apk-body.sha) <(cut -d' ' -f1 /tmp/orig-body.sha)
          unzip -p "$APK" assets/gear.png | sha256sum > /tmp/apk-gear.sha
          sha256sum survival-paradise/native-game/app/src/main/assets/gear.png > /tmp/orig-gear.sha
          diff -u <(cut -d' ' -f1 /tmp/apk-gear.sha) <(cut -d' ' -f1 /tmp/orig-gear.sha)
          echo 'LOCKED ASSETS VALIDATED BYTE-FOR-BYTE IN APK'
      - name: Assemble downloadable native-game release
        run: |
          mkdir -p artifacts
          cp survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk artifacts/Survival_Paradise_V34_Native_Game.apk
          cp survival-paradise/native-game/app/src/main/assets/atlas_provenance.json artifacts/
          cd survival-paradise && zip -qr ../artifacts/Survival_Paradise_V34_Native_Source.zip native-game -x 'native-game/.gradle/*' 'native-game/app/build/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP_V34_Native_Game_APK_and_Source
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
