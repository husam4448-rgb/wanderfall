name: Build Pixel Forge v0.3.2 Android APK
on:
  push:
    branches:
      - pixelforge-apk-v032-full-canvas-20261025
  workflow_dispatch:
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout only Pixel Forge
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pixelforge-v03
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKM" ]; then
            echo "Missing sdkmanager. Installing command-line tools."
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q /tmp/android-tools.zip -d /tmp/android-setup
            mv /tmp/android-setup/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android APK
        working-directory: pixelforge-v03
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelForge-v0.3.2-FullCanvas-APK
          path: pixelforge-v03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
