      - name: Verify V122 original 200-character and front foot exact source pixel regression
        run: python3 survival-paradise/native-game/tools/test_v120_alignment.py
      - uses: actions/upload-artifact@v4
        with:
          name: SP_V123_Character_Regression
          path: survival-paradise/native-game/artifacts/V120_idle_walk_fitted_preview.png
          retention-days: 14
          if-no-files-found: error
      - name: Compile Android debug APK
        working-directory: survival-paradise/native-game
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK payload and version
        run: |
          set -e
          APK=survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/body.png'
          unzip -l "$APK" | grep -q 'assets/npc_idle_v56.png'
          unzip -l "$APK" | grep -q 'assets/sp_v109_characters.zip'
          mkdir -p artifacts
          cp "$APK" artifacts/SurvivalParadise_V123_Industrial_Environment_Test.apk
          sha256sum artifacts/SurvivalParadise_V123_Industrial_Environment_Test.apk > artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP_V123_NPC_360_Aim_Gunfire_APK
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish V123 industrial environment APK as a separate test prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=survival-paradise-v123-industrial-environment-test
          APK=artifacts/SurvivalParadise_V123_Industrial_Environment_Test.apk
          SUM=artifacts/SHA256.txt
          test -s "$APK" && test -s "$SUM"
          NOTE="Isolated V123 Android environment test built from V122 gameplay. Deterministic industrial districts and asphalt roads, manufacturing yards, large enterable interiors with collision geometry, searchable industrial containers, seed-scoped persistent indoor loot and actors. Uses the approved 200 V121-fitted characters and V122 aiming and combat logic. Android package ID deliberately differs from V122 so the existing V122 installation and saves are not overwritten. This is the native procedural geometry integration pass; generated illustrated scene background artwork and the user's 24 individual PNG sources are not embedded in this test APK yet."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTE"
          else
            gh release create "$TAG" "$APK" "$SUM" --target "$GITHUB_SHA"               -R "$GITHUB_REPOSITORY" --prerelease               --title "Survival Paradise V123 - Industrial Environment Test" --notes "$NOTE"
          fi
