name: SP World W07 — Experimental Android APK

on:
  push:
    branches: [sp-world-w07-props-vehicles-20261019]
    paths:
      - 'patches/apply_sp_world_visual_w01.py'
      - 'patches/apply_sp_world_foliage_w02.py'
      - 'patches/apply_sp_world_camp_w03.py'
      - 'patches/apply_sp_world_clearing_w04.py'
      - 'patches/apply_sp_world_cabins_w05.py'
      - 'patches/apply_sp_world_story_props_w07.py'
      - '.github/workflows/sp-world-w07-android-apk.yml'
      - '.ci/trigger-sp-world-art-w02'

permissions:
  contents: read

env:
  SOURCE_SHA256: ae4eff17e5f281f5867ac2d82207fcf96e6c8b649432acd48816aebab76fa308
  SOURCE_ARCHIVE: /tmp/Wanderfall_Phase16_Game_Source.tar.xz
  PROJECT_DIR: game
  GODOT_ZIP: /tmp/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BIN: /tmp/Godot_v4.7.2-stable_linux.x86_64
  GODOT_TEMPLATES_TPZ: /tmp/Godot_v4.7.2-stable_export_templates.tpz
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  APK_PATH: SurvivalParadise_World_W07_Experimental.apk

jobs:
  world-art-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruct verified game source
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part_*.b64 | base64 -d > "$SOURCE_ARCHIVE"
          echo "$SOURCE_SHA256  $SOURCE_ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT_DIR"
          tar -xJf "$SOURCE_ARCHIVE" -C "$PROJECT_DIR"
          test -f "$PROJECT_DIR/scripts/world/world_chunk.gd"

      - name: Integrate source-authored terrain and W02-W07 environment replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 -m py_compile patches/apply_sp_world_visual_w01.py
          python3 patches/apply_godot_47_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v017_ui_overhaul.py "$PROJECT_DIR"
          python3 patches/apply_v0190a_survival_paradise_art_foundation.py "$PROJECT_DIR"
          python3 patches/apply_v0190b_terrain_props.py "$PROJECT_DIR"
          python3 patches/apply_sp_world_visual_w01.py "$PROJECT_DIR"
          grep -q 'SP_WORLD_VISUAL_W01' "$PROJECT_DIR/scripts/world/world_chunk.gd"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/trees-and-bushes-CC0.zip 'https://opengameart.org/sites/default/files/trees_and_bushes_pack.zip'
          echo '909b645fead4b283ef5786611ffce3b41fbe32d55316fffcb665c348027b7d18  /tmp/trees-and-bushes-CC0.zip' | sha256sum -c -
          unzip -q /tmp/trees-and-bushes-CC0.zip -d /tmp/forest-cc0
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick >/dev/null
          convert '/tmp/forest-cc0/trees_and_bushes_pack/trees-and-bushes.psd[4]' /tmp/sp_w02_forests_transparent.png
          python3 -m py_compile patches/apply_sp_world_foliage_w02.py
          python3 patches/apply_sp_world_foliage_w02.py "$PROJECT_DIR" /tmp/sp_w02_forests_transparent.png
          grep -q 'SP_WORLD_FOLIAGE_W02' "$PROJECT_DIR/scripts/world/world_chunk.gd"
          grep -q 'FOREST_W02' "$PROJECT_DIR/scripts/ecology/natural_resource.gd"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/props-cc0.zip 'https://opengameart.org/sites/default/files/props_tilesets.zip'
          echo '7fb5e771df88ca7c6772e1845a34da1b2295cc840835233ecf268f837b59698a  /tmp/props-cc0.zip' | sha256sum -c -
          mkdir -p /tmp/camp-props-w03
          unzip -q /tmp/props-cc0.zip -d /tmp/camp-props-w03
          python3 -m py_compile patches/apply_sp_world_camp_w03.py
          python3 patches/apply_sp_world_camp_w03.py "$PROJECT_DIR" /tmp/camp-props-w03/props_2x2.png
          grep -q 'SP_WORLD_CAMP_W03' "$PROJECT_DIR/scripts/world/world_chunk.gd"
          python3 -m py_compile patches/apply_sp_world_clearing_w04.py
          python3 patches/apply_sp_world_clearing_w04.py "$PROJECT_DIR"
          grep -q 'SP_WORLD_CAMPS_CLEARING_W04' "$PROJECT_DIR/scripts/world/world_chunk.gd"
          curl -fL --retry 3 --retry-delay 2 -o /tmp/cc0-wooden-buildings.png 'https://opengameart.org/sites/default/files/wooden_buildings_01.png'
          echo '4b7d33318bb0078f589a74f4c499a75d373e6b393f80943348286d48bf05ad92  /tmp/cc0-wooden-buildings.png' | sha256sum -c -
          python3 -m py_compile patches/apply_sp_world_cabins_w05.py
          python3 patches/apply_sp_world_cabins_w05.py "$PROJECT_DIR" /tmp/cc0-wooden-buildings.png
          curl -fL --retry 3 --retry-delay 2 -o /tmp/sp-w06-rocks-source.png 'https://opengameart.org/sites/default/files/hjm-assorted_rocks_1.png'
          echo '5b115c064f45f2bf105ae4490b51e9351d8cb19bb4dd1316e508fa4377c10764  /tmp/sp-w06-rocks-source.png' | sha256sum -c -
          python3 patches/apply_sp_world_rocks_w06.py "$PROJECT_DIR" /tmp/sp-w06-rocks-source.png
          curl -fL --retry 3 --retry-delay 2 -o /tmp/sp-w07-props.zip 'https://opengameart.org/sites/default/files/medieval_props_sheets.zip'
          echo '0e744630f9e5540e4431553b928e61ab0da830e16615def9c45114a688ea6013  /tmp/sp-w07-props.zip' | sha256sum -c -
          python3 patches/apply_sp_world_story_props_w07.py "$PROJECT_DIR" /tmp/sp-w07-props.zip
          grep -q SP_WORLD_STORY_PROPS_W07 "$PROJECT_DIR/scripts/world/world_chunk.gd"
          if grep -Fq '    _sp_draw_ground_detail_w01()' "$PROJECT_DIR/scripts/world/world_chunk.gd"; then echo "Rejected ground regression"; exit 1; fi
          grep -q 'SP_WORLD_CABINS_W05' "$PROJECT_DIR/scripts/world/world_chunk.gd"
          test -s "$PROJECT_DIR/assets/production/structures/wooden_cabins_w05.png"
          test -s "$PROJECT_DIR/assets/production/terrain/camp_clearing_w04.png"
          test -s "$PROJECT_DIR/assets/production/props/camp_w03.png"
          # A test-only menu bypass is required to capture *playable world* pixels.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("game/scripts/ui/main_menu.gd")
          src=p.read_text(encoding="utf-8")
          anchor='    get_tree().paused = true\n'
          if src.count(anchor)!=1: raise SystemExit("Menu auto-start anchor absent")
          addition='    if OS.has_environment("SP_WORLD_AUTOSTART"):\n        call_deferred("_start_new_game")\n'
          src=src.replace(anchor,anchor+addition,1)
          anchor='    InputState.reset_mobile_state()\n'
          if src.count(anchor)!=1:raise SystemExit("Start-game test log anchor missing")
          src=src.replace(anchor,anchor+'    if OS.has_environment("SP_WORLD_AUTOSTART"):\n        print("SP_WORLD_SCREENSHOT_AUTOSTART_OK")\n',1)
          p.write_text(src,encoding="utf-8")
          PY
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path("game/assets/production/terrain/sp_world_detail_w01.png")
          im = Image.open(p).convert("RGBA")
          assert im.size == (384,96), im.size
          assert im.getchannel("A").getextrema()[1] > 150
          assert sum(1 for value in im.getchannel("A").getdata() if value != 0) > 500
          print("W01 native terrain atlas verified", im.size)
          PY
          # CI-only legacy Godot 4.7 compatibility. These baseline defects predate W01.
          python3 - <<'PY'
          from pathlib import Path
          updates = [
            ("game/scripts/ui/ui_manager.gd", "            button.icon_max_width = 22\n", ""),
            ("game/scripts/ecology/wildlife_actor.gd", "var drops: Array[Dictionary] = []", "var drops: Array = []"),
          ]
          # Preserve contents/order; relax old typed-array assignment in two
          # legacy social setup scripts that receive untyped JSON configuration.
          for rel in ("game/scripts/social/friendly_npc.gd", "game/scripts/social/faction_mobile_group.gd"):
              p = Path(rel)
              old_source = p.read_text(encoding="utf-8")
              if "Array[Dictionary]" not in old_source:
                  raise SystemExit("Missing expected social typed-array declaration: " + rel)
              replacement = old_source.replace("Array[Dictionary]", "Array")
              if "var stack :=" not in replacement:
                  raise SystemExit("Missing social item-stack inference anchor: " + rel)
              replacement = replacement.replace("var stack :=", "var stack: Dictionary =")
              p.write_text(replacement, encoding="utf-8")
              print("Applied CI legacy typed-array compatibility:", rel)
          for name, old, new in updates:
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              if s.count(old) != 1:
                  raise SystemExit("Legacy compatibility anchor missing: " + name)
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
              print("Applied QA baseline compatibility:", name)
          PY
          python3 "$PROJECT_DIR/tools/preflight.py" "$PROJECT_DIR"

      - name: Diagnose known Godot 4.7 legacy runtime incompatibilities
        shell: bash
        run: |
          echo "=== Wildlife typed assignment context ==="
          nl -ba "$PROJECT_DIR/scripts/world/world_chunk.gd" | sed -n '232,255p'
          echo "=== Unsupported icon property assignments ==="
          grep -Rn 'icon_max_width' "$PROJECT_DIR/scripts" | head -30 || true
          echo "=== Wildlife dynamic array assignment declarations ==="
          grep -Rn -C 3 'Array\[Dictionary\]' "$PROJECT_DIR/scripts/ecology/wildlife_actor.gd" || true

      - name: Download pinned Godot 4.7.2 runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$GODOT_ZIP" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $GODOT_ZIP" | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp
          test -x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Godot import, parser, runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --quit --verbose 2>&1 | tee w01-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Compile Error:|Parse Error:' w01-import.log; then exit 1; fi
          timeout 25s "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 90 --verbose 2>&1 | tee w01-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Compile Error:|Parse Error:|Invalid get index|Invalid call' w01-smoke.log; then exit 1; fi

      - name: Optional actual scene screenshot for visual QA
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick xdotool >/dev/null
          xvfb-run -a bash -c '
            SP_WORLD_AUTOSTART=1 "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1366x768 > w07-render.log 2>&1 &
            pid=$!
            sleep 5
            # Dedicated in-game QA flag starts a new game after menu init.
            sleep 9
            import -window root w07-gameplay.png || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          test -s w07-gameplay.png
          grep -q 'SP_WORLD_SCREENSHOT_AUTOSTART_OK' w07-render.log
          python3 - <<'PY'
          from PIL import Image, ImageStat
          im=Image.open("w07-gameplay.png").convert("RGB")
          assert im.width >= 1100 and im.height >= 700
          stat=ImageStat.Stat(im.crop((150,130,1100,700)))
          print("REAL GAME WORLD FRAME CAPTURED:",im.size,"contrast",stat.stddev)
          assert max(stat.stddev)>28, "Potential blank/menu screenshot"
          PY

      - name: Prepare Android identity and offline debug build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          preset=Path("game/export_presets.cfg")
          s=preset.read_text(encoding="utf-8")
          print("PRESET VERSION CODE",re.findall(r'version/code\s*=\s*\d+',s))
          print("PRESET VERSION NAME",re.findall(r'version/name\s*=\s*"[^"]+"',s))
          s,n=re.subn(r'version/code\s*=\s*\d+','version/code=271',s)
          if n<1:raise SystemExit("Missing Android version/code")
          s,n=re.subn(r'version/name\s*=\s*"[^"]+"','version/name="0.27.1-SP-WORLD-W07-EXPERIMENTAL"',s)
          if n<1:raise SystemExit("Missing Android version/name")
          preset.write_text(s,encoding="utf-8")
          menu=Path("game/scripts/ui/main_menu.gd")
          t=menu.read_text(encoding="utf-8")
          if 'title.text = "WANDERFALL"' in t:
              t=t.replace('title.text = "WANDERFALL"','title.text = "SURVIVAL PARADISE"',1)
              menu.write_text(t,encoding="utf-8")
          print("SP_ANDROID_WORLD_W07_IDENTITY_OK")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK export dependencies
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$ANDROID_SDK"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "ndk;28.1.13356709"
          test -x "$ANDROID_SDK/build-tools/35.0.1/apksigner"

      - name: Install pinned Android export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$GODOT_TEMPLATES_TPZ" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "$GODOT_TEMPLATES_SHA256  $GODOT_TEMPLATES_TPZ" | sha256sum -c -
          mkdir -p /tmp/sp-godot-tpl
          unzip -q "$GODOT_TEMPLATES_TPZ" -d /tmp/sp-godot-tpl
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/sp-godot-tpl/templates/. "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Export real playable Survival Paradise experimental APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/keystores"
          KEY="$HOME/.local/share/godot/keystores/debug.keystore"
          if [ ! -s "$KEY" ]; then
            keytool -genkeypair -v -keystore "$KEY" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Survival Paradise,C=US" -noprompt >/dev/null
          fi
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$KEY"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --quit > w07-apk-import.log 2>&1
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:' w07-apk-import.log; then exit 1; fi
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-debug Android "$GITHUB_WORKSPACE/$APK_PATH" 2>&1 | tee w07-apk-export.log
          test -s "$APK_PATH"

      - name: Verify APK signature, package and architecture
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/$APK_PATH"
          unzip -t "$APK" > w07-apk-zip-test.txt
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK" | tee w07-apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | tee w07-apk-badging.txt
          grep -q "package: name='org.wanderfall.game'" w07-apk-badging.txt
          grep -q "versionCode='271'" w07-apk-badging.txt
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgodot_android.so'
          sha256sum "$APK" | tee "$APK_PATH.sha256"
          test "$(stat -c%s "$APK")" -lt 419430400

      - name: Upload signed world overhaul experimental APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP-World-W07-Android-EXPERIMENTAL
          path: |
            SurvivalParadise_World_W07_Experimental.apk
            SurvivalParadise_World_W07_Experimental.apk.sha256
            w07-apk-export.log
            w07-apk-import.log
            w07-apk-signature.txt
            w07-apk-badging.txt
            w07-apk-zip-test.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Archive exact scene, native art and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP-World-W07-Android-Scene-QA
          path: |
            game/assets/production/terrain/sp_world_detail_w01.png
            game/assets/production/props/forest_w02.png
            game/assets/production/props/camp_w03.png
            game/assets/production/terrain/camp_clearing_w04.png
            game/assets/production/structures/wooden_cabins_w05.png
            game/assets/production/props/shaded_rocks_w06.png
            game/assets/production/props/settlement_props_w07.png
            game/scripts/ecology/natural_resource.gd
            game/scripts/world/world_chunk.gd
            w01-import.log
            w01-smoke.log
            w07-render.log
            w07-gameplay.png
          retention-days: 14
          if-no-files-found: warn
