name: Survival Paradise V166 - World Art Source and Emulator QA
on:
  push:
    branches: [sp-native-v166-world-art-overhaul-20261118]
    paths:
      - '.github/workflows/sp-v166-world-art-emulator-qa.yml'
      - 'survival-paradise/native-game/**'
  workflow_dispatch:
# Art revisions arrive frequently. Cancel stale APK/emulator verification
# to avoid parallel downloads saturating Maven Central (HTTP 429).
concurrency:
  group: sp-v166-art-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  v165-art-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
            assets/authored2d
            assets/world
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify original immutable runtime art and decode V165 painted material atlas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user -q Pillow numpy
          python3 survival-paradise/native-game/tools/restore_runtime_assets_v157.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,hashlib,io
          assets=Path('survival-paradise/native-game/app/src/main/assets')
          from PIL import Image
          extra=Image.open(assets/'world_props_v166.png').convert('RGBA')
          assert extra.size==(23*128,128),extra.size
          for cell in range(23):
              piece=extra.crop((cell*128,0,(cell+1)*128,128))
              assert piece.getchannel('A').getbbox(),cell
              assert piece.getchannel('A').getextrema()[0]==0,cell
          print('PASS V166: 23 actual original-art variants embedded')
          fire_bin=base64.b64decode((assets/'sp_v166_campfire.webp.b64').read_text())
          assert hashlib.sha256(fire_bin).hexdigest()=='43d927b444aca74199b8c0c65983593ef3216224c85c8a4a28d93c8341f36b9d'
          fire=Image.open(io.BytesIO(fire_bin)).convert('RGBA')
          import numpy as np
          f0=np.asarray(fire.crop((0,0,256,256)),dtype=np.int16)
          assert all(np.abs(f0-np.asarray(fire.crop((i*256,0,(i+1)*256,256)),dtype=np.int16)).sum()>5000 for i in range(1,4))
          # V166 8-category city exterior contract. No image-generation
          # success counts as game integration: require real Android captures.
          ext=base64.b64decode((assets/'sp_v166_neighborhood.webp.b64').read_text())
          assert hashlib.sha256(ext).hexdigest()=='b4afd1a9112519f907e4e285c552bf072206f53952e35797490abc2ebba6712f'
          building_atlas=Image.open(io.BytesIO(ext)).convert('RGBA')
          assert building_atlas.size==(1280,1280),building_atlas.size
          for kind in range(8):
              cells=[]
              for variant in range(2):
                  i=variant*8+kind
                  x=i%4*320;y=i//4*320
                  tile=building_atlas.crop((x,y,x+320,y+320))
                  assert tile.getchannel('A').getbbox(),(kind,variant)
                  assert tile.getchannel('A').getextrema()[0]==0,(kind,variant)
                  cells.append(tile)
              from PIL import ImageChops
              assert ImageChops.difference(cells[0],cells[1]).getbbox(),kind
          print('PASS V166: 8 authentic building families, 16 distinct art cells')
          props=base64.b64decode((assets/'sp_v166_furniture.webp.b64').read_text())
          assert hashlib.sha256(props).hexdigest()=='88fc6d4d0fba2307f92c05f9e24d5d0adda70952b7181332fe20bcee34be2a29'
          furniture=Image.open(io.BytesIO(props)).convert('RGBA')
          assert furniture.size==(1024,1024)
          for i in range(16):
              x=(i%4)*256;y=(i//4)*256
              tile=furniture.crop((x,y,x+256,y+256))
              assert tile.getchannel('A').getbbox(),i
              assert tile.getchannel('A').getextrema()[0]==0,i
          print('PASS V166: 16 authored alpha furniture objects, 8 room families')
          inside=base64.b64decode((assets/'sp_v166_indoor_floors.webp.b64').read_text())
          assert hashlib.sha256(inside).hexdigest()=='b4baff990d9910508b2d0e55f31b37872ba98fee2a612d2614b4c03d2b5c1b8c'
          ins=Image.open(io.BytesIO(inside)).convert('RGB')
          assert ins.size==(1024,512), ins.size
          import numpy as np
          for ix in range(8):
              tx=ix%4*256;ty=ix//4*256
              a=np.asarray(ins.crop((tx,ty,tx+256,ty+256)),dtype=np.int16)
              assert a.std()>14,('flat interior asset',ix)
              assert np.abs(a[:,0,:]-a[:,-1,:]).mean()<9,('horizontal seam',ix)
              assert np.abs(a[0,:,:]-a[-1,:,:]).mean()<9,('vertical seam',ix)
          print('PASS V166: eight authored indoor materials, dimensions, seam continuity')
          original=assets/'sp_v109_characters.zip'
          assert original.is_file() and hashlib.sha256(original.read_bytes()).hexdigest()==(
              'c8e364bc1485eb5251fa9494889977038268cbac10f455fa844d7b8a46f6dc3a')
          assert (assets/'body.png').is_file() and (assets/'gear.png').is_file()
          raw=base64.b64decode((assets/'sp_v165_surface.webp.b64').read_text())
          atlas=Image.open(io.BytesIO(raw)).convert('RGB')
          assert atlas.size==(256,256),atlas.size
          halves=[atlas.crop((x*128,y*128,(x+1)*128,(y+1)*128)) for y in range(2) for x in range(2)]
          import numpy as np
          means=[np.array(q).mean(axis=(0,1)) for q in halves]
          assert len({tuple(map(int,m)) for m in means})==4,means
          assert len(raw)<20000
          for filename,expected in (
              ('sp_v1651_camp_tents.webp.b64',(668,263)),
              ('sp_v1651_stations.webp.b64',(500,215)),
              ('sp_v1651_road_shoulder.webp.b64',(1024,128)),
              ('sp_v1652_props.webp.b64',(768,576)),
              ('sp_v1652_ground.webp.b64',(640,434)),
              ('sp_v1652_biome_blends.webp.b64',(768,256)),
              ('sp_v166_campfire.webp.b64',(1280,256)),
          ):
              pack=base64.b64decode((assets/filename).read_text())
              picture=Image.open(io.BytesIO(pack)).convert('RGBA')
              assert picture.size==expected,(filename,picture.size)
              alpha=np.asarray(picture.getchannel('A'))
              assert alpha.min()==0 and alpha.max()>100,filename
              assert np.count_nonzero(alpha<30)>alpha.size//25,filename
              assert len(pack)<270000,filename
              if filename.endswith('sp_v1652_ground.webp.b64'):
                  # Genuine naturalized alpha, never a flat opaque rectangle.
                  assert alpha[0,0]<4 and alpha[alpha.shape[0]//2,alpha.shape[1]//2]>50
              if filename.endswith('sp_v1652_props.webp.b64'):
                  assert np.count_nonzero(alpha<30)>alpha.size//4
              print('PASS original authored RGBA:',filename,len(pack),picture.size)
          tents=Image.open(io.BytesIO(base64.b64decode(
              (assets/'sp_v1651_camp_tents.webp.b64').read_text()))).convert('RGB')
          a=np.asarray(tents.crop((0,0,334,263)))
          b=np.asarray(tents.crop((334,0,668,263)))
          assert np.mean(np.abs(a.astype('int')-b.astype('int')))>15
          Path('/tmp/sp165').mkdir(exist_ok=True)
          atlas.save('/tmp/sp165/atlas-qa.png')
          print('PASS: original 200 heads preserved; V165 four distinct authored materials decode')
          PY
      - name: Preserve V164 seeded-world gameplay regression coverage
        shell: bash
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          mkdir -p /tmp/v165-java
          javac -sourcepath "$R/app/src/main/java" -d /tmp/v165-java \
            "$R/tools/V161NeighborhoodInteriorTest.java" \
            "$R/tools/GearStatsV162Test.java" \
            "$R/tools/V163InteriorLayoutTest.java" \
            "$R/tools/V164SettlementCampTest.java" \
            "$R/tools/V1652CampSpatialTest.java" \
            "$R/tools/V166WorldArtSelectionTest.java" \
            "$R/tools/V166NeighborhoodArtTest.java" \
            "$R/tools/V166SettlementGroundTest.java" \
            "$R/tools/V166InteriorArtTest.java" \
            "$R/tools/V166InteriorFloorSelectionTest.java" \
            "$R/tools/V160SeededGeographyTest.java" \
            "$R/tools/V159WorldPlanTest.java" \
            "$R/tools/NeighborhoodV154Test.java"
          for test in V166InteriorFloorSelectionTest V166InteriorArtTest V166SettlementGroundTest V166NeighborhoodArtTest V166WorldArtSelectionTest V1652CampSpatialTest V164SettlementCampTest V163InteriorLayoutTest GearStatsV162Test \
                      V161NeighborhoodInteriorTest V160SeededGeographyTest \
                      V159WorldPlanTest NeighborhoodV154Test; do
            java -Xmx512m -cp /tmp/v165-java com.survivalparadise.nativegame."$test"
          done
      - name: Verify no headgear renderer or world/saves reconfiguration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          s=(p/'SurfaceArtV165.java').read_text()
          assert all(t in s for t in ('BitmapShader','Shader.TileMode.REPEAT','sp_v165_surface.webp.b64','public static boolean ready()'))
          for name in ('GameView.java','NeighborhoodArtV154.java','IndustrialSceneV124.java',
                       'IndustrialBiomeSceneV128.java'):
            assert 'SurfaceArtV165' in (p/name).read_text(),name
          assert 'NaturalBrushArtV1652.patch(c,b,biome,distant)' in (p/'NaturalGroundArtV157.java').read_text()
          settlement=(p/'WorldCivilizationArtV159.java').read_text()
          assert 'SettlementGroundArtV166.draw(c,plan,camX,camY,viewW,viewH)' in settlement
          assert 'c.drawRoundRect(x,y,x+w,y+h' not in settlement
          assert 'stampSettlement(c,source,' in (p/'SettlementGroundArtV166.java').read_text()
          assert 'P.setColorFilter(null)' in (p/'NaturalBrushArtV1652.java').read_text()
          assert 'drawPath(' not in (p/'NaturalGroundArtV157.java').read_text()
          game=(p/'GameView.java').read_text()
          assert 'WorldArtV166.load(host.getAssets())' in game
          assert 'WorldArtV166.draw(c,kind,x,y,extent,extent' in game
          assert 'WorldArtV166.draw(c,WorldArtSelectionV166.BUSH' in game
          assert 'NaturalBrushArtV1652.stamp' in (p/'CityGreensV164.java').read_text()
          assert 'if(index==1)return;' in game
          assert 'terrainChunks.draw(c,camX,camY,viewW,viewH,renderZoomV90)' in game
          assert 'campCachesV164.encode()' in game
          assert 'CampSpriteArtV1651.drawTent' in (p/'CampArtV164.java').read_text()
          assert 'CampStationSpriteV1651.drawTrader' in (p/'CampArtV164.java').read_text()
          assert 'CampStationSpriteV1651.drawMedic' in (p/'CampArtV164.java').read_text()
          assert 'RoadShoulderArtV1651.vertical' in (p/'NeighborhoodArtV154.java').read_text()
          assert 'RoadShoulderArtV1651.horizontal' in game
          assert 'CampArtV164.foregroundY(site,what)' in game
          assert 'CampArtV164.foreground(c,p,site,what)' in game
          assert 'campStaff.add(new Survivor(CAMP_X-210,CAMP_Y+147' in game
          assert 'for(int part=0;part<6;part++)' in game
          camp=(p/'CampArtV164.java').read_text()
          assert 'CampSceneArtV1652.ground(c,s)' in camp
          assert 'CampSceneArtV1652.chest' in camp
          assert 'CampSceneArtV1652.guard(c' in camp
          assert 'CampSceneArtV1652.solar' in camp
          assert 'CampSceneArtV1652.debris' in camp
          assert 'oval(c,p,x-470,y-295' not in camp
          assert 'Math.abs(x-site.chestX())<47f+r' in game
          assert 'Math.abs(y-site.chestY())<35f+r' in game
          assert 'CampSceneArtV1652.load(host.getAssets())' in game
          assert 'NaturalBrushArtV1652.load(host.getAssets())' in game
          assert 'NaturalBrushArtV1652.patch(c,b,biome,distant)' in (p/'NaturalGroundArtV157.java').read_text()
          assert 'tradeStand(c,p,x-215,y+73)' in camp
          assert 'watchPost(c,p,x+270,y+5)' in camp
          assert 'CampSceneArtV1652.solar(c,x-397f,y+132f)' in camp
          assert 'CampSceneArtV1652.debris(c,x-399f,y-5f,false)' in camp
          assert 'CampSceneArtV1652.debris(c,x+405f,y-16f,false)' in camp
          assert 'STARTER_GROUND=GROUND.copy' in (p/'CampSceneArtV1652.java').read_text()
          assert 'SurfaceArtV165.load(host.getAssets())' in game
          assert 'CampSpriteArtV1651.load(host.getAssets())' in game
          assert 'CampStationSpriteV1651.load(host.getAssets())' in game
          assert 'RoadShoulderArtV1651.load(host.getAssets())' in game
          assert 'CampfireArtV166.load(host.getAssets())' in game
          assert 'BuildingArtV166.load(host.getAssets())' in game
          assert 'InteriorPropArtV166.load(host.getAssets())' in game
          assert 'InteriorFloorArtV166.load(host.getAssets())' in game
          assert 'InteriorFloorArtV166.neighborhood(c,room)' in (p/'InteriorMaterialV166.java').read_text()
          assert 'InteriorFloorArtV166.industrial(c,room)' in (p/'IndustrialInteriorArtV125.java').read_text()
          assert 'InteriorPropArtV166.drawAt(c,sprite,x-23,y-17,47,34)' in game
          assert 'if(InteriorPropArtV166.ready())continue;' in (p/'IndustrialSceneV123.java').read_text()
          assert 'float x=q[0],y=q[1],w=q[2],h=q[3]' in (p/'IndustrialInteriorArtV125.java').read_text()
          assert 'worldTileSize(tile)' in (p/'InteriorFloorArtV166.java').read_text()
          assert 'InteriorFloorArtV166.legacy(c,siteKindV91' in game
          assert 'InteriorMaterialV166.floor(c,p,room)' in (p/'NeighborhoodInteriorArtV161.java').read_text()
          assert 'InteriorPropArtV166.draw(c,q,theme,variant,index)' in (p/'NeighborhoodInteriorArtV161.java').read_text()
          assert 'InteriorPropArtV166.drawAt(c,' in (p/'IndustrialInteriorArtV125.java').read_text()
          assert 'BuildingArtV166.draw(c,b,worldSeed)' in (p/'NeighborhoodArtV154.java').read_text()
          assert 'b->building(c,p,b,night,plan==null?14901:plan.seed)' in (p/'NeighborhoodArtV154.java').read_text()
          assert 'CampfireArtV166.draw(c,x,y,campfiresLit,worldTimer)' in game
          assert 'WorldArtV166.draw(c,WorldArtSelectionV166.ROCK' in game
          assert 'WorldArtV166.draw(c,WorldArtSelectionV166.WOOD' in game
          assert 'CampSceneArtV1652.prop(c,CampSceneArtV1652.DEBRIS' in game
          assert 'if(CampfireArtV166.ready())return;' in camp
          # Regression: V164's old helper took LTRB inputs but interpreted
          # right/bottom as widths, yielding huge diagonal road-adjacent bands.
          assert 'c.drawOval(left,top,right,bottom,p);' in camp
          assert 'c.drawOval(x,y,x+w,y+h,p);' not in camp
          fireX,fireY=1170,805
          old_right=(fireX-72)+(fireX+72)
          new_right=fireX+72
          assert old_right==2340 and new_right==1242
          assert (fireY-49)+(fireY+62)==1623 and fireY+62==867
          print('PASS: V165.1 renderer wiring, depth sorting and original heads retained')
          PY
      - name: Add CI-only eight-kind city camera (never production code)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/GameView.java')
          s=p.read_text()
          assert '        renderZoomV90=effectiveZoom;' in s
          s=s.replace('        renderZoomV90=effectiveZoom;',
              '''        int v166CityKind=android.provider.Settings.Global.getInt(
              host.getContentResolver(),"sp_v166_qa_city_kind",0);
          if(v166CityKind>=1&&v166CityKind<=8)effectiveZoom=.46f;
          renderZoomV90=effectiveZoom;''',1)
          before='        canvas.drawColor(0xff101f24);'
          assert before in s
          s=s.replace(before,
              '''        // Test-only camera movement: never modify the player's
          // position, NPC data, collision, settlement or saved world.
          if(!insideClinicV89&&playing&&civilizationV159!=null&&
             v166CityKind>=1&&v166CityKind<=8){
              boolean found=false;
              for(WorldCivilizationV159.Parcel parcel:civilizationV159.parcels){
                  if(found)break;
                  for(int slot=0;slot<NeighborhoodV154.COLS*NeighborhoodV154.ROWS;slot++){
                      NeighborhoodV154.Building b=NeighborhoodV154.get(
                          parcel.tx,parcel.ty,slot,civilizationV159);
                      if(b==null||b.kind!=v166CityKind-1)continue;
                      camX=b.left+b.width*.5f-viewW/(2f*effectiveZoom);
                      camY=b.top+b.height*.5f-viewH/(2f*effectiveZoom);
                      found=true;break;
                  }
              }
          }
          canvas.drawColor(0xff101f24);''',1)
          p.write_text(s)
          print('PASS: QA-only city renderer inspection instrumentation')
          PY
      - name: CI-only camera and active-room rendering for all 8 seeded interiors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/GameView.java')
          s=file.read_text()
          needle='        updateNs=System.nanoTime()-updateStart;'
          assert needle in s,needle
          injection='''        // QA-only: instantiate actual V163 interior from the existing seed
          // and model; no gameplay positions or source files are changed in
          // the repository. Test package is isolated from normal installations.
          int qaInterior=android.provider.Settings.Global.getInt(
              host.getContentResolver(),"sp_v166_qa_interior_kind",0);
          if(playing&&!gameOver&&qaInterior>=1&&qaInterior<=8&&
             civilizationV159!=null&&
             (!(clinicInteriorV89 instanceof NeighborhoodInteriorV161)||
              !insideClinicV89||
              ((NeighborhoodInteriorV161)clinicInteriorV89).theme!=qaInterior-1)){
              NeighborhoodV154.Building target=null;
              for(WorldCivilizationV159.Parcel parcel:civilizationV159.parcels){
                  if(target!=null)break;
                  for(int slot=0;slot<6;slot++){
                      NeighborhoodV154.Building one=NeighborhoodV154.get(
                          parcel.tx,parcel.ty,slot,civilizationV159);
                      if(one!=null&&one.kind==qaInterior-1){target=one;break;}
                  }
              }
              if(target!=null){
                  neighborhoodSiteV161=target;
                  activeSiteV91=NeighborhoodInteriorV161.siteId(
                      target,industrialSeedV123);
                  clinicInteriorV89=new NeighborhoodInteriorV161(
                      target,industrialSeedV123);
                  clinicActorsV90=new ClinicActorsV90(clinicInteriorV89);
                  clinicNavV90=new ClinicNavV90(clinicInteriorV89);
                  insideClinicV89=true;
                  playerX=ClinicInteriorV89.ENTRANCE_X;
                  playerY=ClinicInteriorV89.ENTRANCE_Y;
              }
          }
          int qaLegacy=android.provider.Settings.Global.getInt(
              host.getContentResolver(),"sp_v166_qa_legacy_scene",0);
          if(playing&&!gameOver&&qaLegacy==9&&
             (!insideClinicV89||
              clinicInteriorV89.getClass()!=ClinicInteriorV89.class)){
              neighborhoodSiteV161=null;
              activeSiteV91=1;
              clinicInteriorV89=new ClinicInteriorV89();
              clinicActorsV90=new ClinicActorsV90(clinicInteriorV89);
              clinicNavV90=new ClinicNavV90(clinicInteriorV89);
              insideClinicV89=true;
              playerX=ClinicInteriorV89.ENTRANCE_X;
              playerY=ClinicInteriorV89.ENTRANCE_Y;
          }
          if(playing&&!gameOver&&qaLegacy==10&&
             (!insideClinicV89||
              !(clinicInteriorV89 instanceof ExpeditionInteriorV91)||
              clinicInteriorV89 instanceof NeighborhoodInteriorV161)){
              neighborhoodSiteV161=null;
              activeSiteV91=0;
              clinicInteriorV89=new ExpeditionInteriorV91(
                  ExpeditionSitesV88.SITES[0]);
              clinicActorsV90=new ClinicActorsV90(clinicInteriorV89);
              clinicNavV90=new ClinicNavV90(clinicInteriorV89);
              insideClinicV89=true;
              playerX=ClinicInteriorV89.ENTRANCE_X;
              playerY=ClinicInteriorV89.ENTRANCE_Y;
          }
          if(playing&&!gameOver&&qaLegacy==11&&
             (!insideClinicV89||
              !(clinicInteriorV89 instanceof IndustrialInteriorV123))){
              neighborhoodSiteV161=null;
              activeSiteV91=INDUSTRIAL_SITE_V123;
              clinicInteriorV89=new IndustrialInteriorV123(
                  IndustrialWorldV123.district(0,0,industrialSeedV123));
              clinicActorsV90=new ClinicActorsV90(clinicInteriorV89);
              clinicNavV90=new ClinicNavV90(clinicInteriorV89);
              insideClinicV89=true;
              playerX=ClinicInteriorV89.ENTRANCE_X;
              playerY=ClinicInteriorV89.ENTRANCE_Y;
          }
          // QA-only scene selection. Camera movement is injected into
          // render paths below, never by moving the live player into enemies.
          '''
          s=s.replace(needle,needle+'\n'+injection,1)
          # Pan only the rendering camera for QA vantages. Never teleport
          # the actual player: hostile NPCs killed the previous photo subject,
          # making all subsequent captures show the YOU DIED overlay.
          for render_method in ('drawClinicInteriorV89','drawIndustrialInteriorV123'):
              entry=s.index('    void '+render_method+'(Canvas c){')
              where=s.index('        c.save();c.translate(-camX,-camY);',entry)
              old='        c.save();c.translate(-camX,-camY);'
              replacement='''        c.save();
          int qaVantageV166=android.provider.Settings.Global.getInt(
            host.getContentResolver(),"sp_v166_qa_vantage",0);
          float qaPanV166=qaVantageV166==1?-394f*ClinicInteriorV89.EXPANSION_V90:
            qaVantageV166==2?-784f*ClinicInteriorV89.EXPANSION_V90:0f;
          c.translate(-camX,-camY-qaPanV166);'''
              s=s[:where]+replacement+s[where+len(old):]
          vision='        drawClinicVisionV90(c);'
          assert s.count(vision)>=2,s.count(vision)
          s=s.replace(vision,
              '''        if(android.provider.Settings.Global.getInt(
                  host.getContentResolver(),"sp_v166_qa_interior_kind",0)==0&&
                  android.provider.Settings.Global.getInt(
                  host.getContentResolver(),"sp_v166_qa_legacy_scene",0)==0)
                  drawClinicVisionV90(c);''')
          hud='            hud(canvas);'
          assert hud in s,hud
          s=s.replace(hud,
              '''            if(android.provider.Settings.Global.getInt(
                host.getContentResolver(),"sp_v166_qa_interior_kind",0)==0&&
                android.provider.Settings.Global.getInt(
                host.getContentResolver(),"sp_v166_qa_legacy_scene",0)==0)
                hud(canvas);''',1)
          file.write_text(s)
          print('PASS: temporary QA mode for eight real V163 seeded interiors')
          PY
      - name: Android 35 SDK / Java compile
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile native Android app
        working-directory: survival-paradise/native-game
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Prepare temporary emulator-only debug test package (NO APK PUBLICATION)
        shell: bash
        run: |
          set -euo pipefail
          cd survival-paradise/native-game
          gradle --no-daemon :app:assembleDebug
          mkdir -p /tmp/sp165/visual
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/sp165/qa-only.apk
          test -s /tmp/sp165/qa-only.apk
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/world_props_v166.png'
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/sp_v166_campfire.webp.b64'
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/sp_v166_neighborhood.webp.b64'
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/sp_v166_furniture.webp.b64'
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/sp_v166_indoor_floors.webp.b64'
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/sp_v165_surface.webp.b64'
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/sp_v1652_props.webp.b64'
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/sp_v1652_ground.webp.b64'
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/sp_v1652_biome_blends.webp.b64'
          unzip -l /tmp/sp165/qa-only.apk | grep -F 'assets/sp_v109_characters.zip'
      - name: Allow emulator KVM
        run: |
          if [ -c /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Prepare actual game camera capture script
        shell: bash
        run: |
          cat > /tmp/sp165/emulator.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=com.survivalparadise.nativegame.v164camptest
          adb wait-for-device
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell wm size 1920x1080 || true
          adb shell wm density 260 || true
          adb install /tmp/sp165/qa-only.apk
          adb logcat -c
          timeout 28s adb shell am start -n "$PKG/com.survivalparadise.nativegame.MainActivity"
          sleep 9
          adb shell screencap -p /sdcard/v165_menu.png
          adb pull /sdcard/v165_menu.png /tmp/sp165/visual/01_menu.png
          if ! adb shell pidof "$PKG"; then adb logcat -d > /tmp/sp165/visual/launch_failure.txt;exit 1;fi
          adb shell input tap 1130 330
          adb shell input tap 740 620
          sleep 26
          # A second Android immersive-mode permission overlay can appear
          # after NEW GAME, even if the menu was already unobstructed.
          adb shell input tap 1130 330
          sleep 2
          # Force bright noon lighting so authored materials can be reviewed.
          adb shell input tap 1493 45 || true
          sleep 3
          adb shell screencap -p /sdcard/v165_world.png
          adb pull /sdcard/v165_world.png /tmp/sp165/visual/02_world_normal.png
          # Walk south toward the fixed starting highway to test actual
          # in-game road dressing; navigation/gameplay are unchanged.
          adb shell input swipe 268 820 268 995 3600 || true
          sleep 2
          adb shell screencap -p /sdcard/v165_road.png
          adb pull /sdcard/v165_road.png /tmp/sp165/visual/03_road_approach.png
          # At 1920x1080 the real ZOOM - control is centered near x1680;
          # the old x1840 tap was ZOOM + and therefore NOT zoomed out.
          adb shell input tap 1685 170
          adb shell input tap 1685 170
          sleep 3
          adb shell screencap -p /sdcard/v165_far.png
          adb pull /sdcard/v165_far.png /tmp/sp165/visual/04_world_zoomed_out.png
          # Real emulator views of eight actual generated architectural types.
          # Source integration alone is not visual proof.
          for kind in 1 2 3 4 5 6 7 8; do
            adb shell settings put global sp_v166_qa_city_kind "$kind"
            sleep 2
            adb shell screencap -p "/sdcard/06_city_kind_$kind.png"
            adb pull "/sdcard/06_city_kind_$kind.png" "/tmp/sp165/visual/06_city_kind_$kind.png"
          done
          adb shell settings put global sp_v166_qa_city_kind 0
          # Actual Android screenshots: eight different indoor categories.
          # The test-only hook renders real V163 layouts at their native scale.
          for kind in 1 2 3 4 5 6 7 8; do
            adb shell settings put global sp_v166_qa_interior_kind "$kind"
            sleep 2
            adb shell screencap -p "/sdcard/07_interior_kind_$kind.png"
            adb pull "/sdcard/07_interior_kind_$kind.png" "/tmp/sp165/visual/07_interior_kind_$kind.png"
          done
          # Second and third real-camera viewpoints reveal room furniture
          # hidden above the entrance-level framing in iteration 1 and 2.
          adb shell settings put global sp_v166_qa_vantage 1
          for kind in 1 2 3 4 5 6 7 8; do
            adb shell settings put global sp_v166_qa_interior_kind "$kind"
            sleep 2
            adb shell screencap -p "/sdcard/08_centre_kind_$kind.png"
            adb pull "/sdcard/08_centre_kind_$kind.png" "/tmp/sp165/visual/08_centre_kind_$kind.png"
          done
          adb shell settings put global sp_v166_qa_vantage 2
          for kind in 1 2 3 4 5 6 7 8; do
            adb shell settings put global sp_v166_qa_interior_kind "$kind"
            sleep 2
            adb shell screencap -p "/sdcard/09_north_kind_$kind.png"
            adb pull "/sdcard/09_north_kind_$kind.png" "/tmp/sp165/visual/09_north_kind_$kind.png"
          done
          adb shell settings put global sp_v166_qa_interior_kind 0
          adb shell settings put global sp_v166_qa_vantage 1
          for scene in 9 10 11; do
            adb shell settings put global sp_v166_qa_legacy_scene "$scene"
            sleep 3
            adb shell screencap -p "/sdcard/10_legacy_scene_$scene.png"
            adb pull "/sdcard/10_legacy_scene_$scene.png" "/tmp/sp165/visual/10_legacy_scene_$scene.png"
          done
          adb shell settings put global sp_v166_qa_vantage 0
          adb shell settings put global sp_v166_qa_legacy_scene 0
          adb logcat -d > /tmp/sp165/visual/logcat.txt
          grep -F 'Camp tents ready: 2 authored RGBA sprites' /tmp/sp165/visual/logcat.txt
          grep -F 'Trade and medic stations ready: 2 authored RGBA sprites' /tmp/sp165/visual/logcat.txt
          grep -F 'Road shoulder ready: 1024x128 RGBA strip' /tmp/sp165/visual/logcat.txt
          grep -F 'Organic camp ground and four authored props ready' /tmp/sp165/visual/logcat.txt
          grep -F 'Natural biome brushes ready: 3 transparent authored pigments' /tmp/sp165/visual/logcat.txt
          grep -F 'World sprite library ready: 23 original-art variations' /tmp/sp165/visual/logcat.txt
          grep -F 'Campfire production sprites ready: 4 lit + 1 unlit' /tmp/sp165/visual/logcat.txt
          grep -F 'Building exteriors ready: 8 families, 16 original sprites' /tmp/sp165/visual/logcat.txt
          grep -F 'Indoor furniture ready: 16 authored objects, 8 room families' /tmp/sp165/visual/logcat.txt
          grep -F 'Indoor floor materials ready: 8 authored surfaces' /tmp/sp165/visual/logcat.txt
          adb shell pidof "$PKG"
          if grep -E 'FATAL EXCEPTION|Process: com.survivalparadise.nativegame.v164camptest' /tmp/sp165/visual/logcat.txt; then exit 1;fi
          test -s /tmp/sp165/visual/02_world_normal.png
          test -s /tmp/sp165/visual/04_world_zoomed_out.png
          for kind in 1 2 3 4 5 6 7 8;do test -s "/tmp/sp165/visual/06_city_kind_$kind.png";done
          for kind in 1 2 3 4 5 6 7 8;do test -s "/tmp/sp165/visual/07_interior_kind_$kind.png";done
          for kind in 1 2 3 4 5 6 7 8;do test -s "/tmp/sp165/visual/08_centre_kind_$kind.png";done
          for kind in 1 2 3 4 5 6 7 8;do test -s "/tmp/sp165/visual/09_north_kind_$kind.png";done
          for scene in 9 10 11;do test -s "/tmp/sp165/visual/10_legacy_scene_$scene.png";done
          python3 - <<'PY'
          from PIL import Image,ImageChops,ImageStat
          import numpy as np
          folder='/tmp/sp165/visual/'
          for name in ('09_north_kind_5.png','10_legacy_scene_9.png',
                       '10_legacy_scene_10.png','10_legacy_scene_11.png'):
              picture=np.asarray(Image.open(folder+name).convert('RGB'))
              h,w=picture.shape[:2]
              middle=picture[int(h*.32):int(h*.43),int(w*.41):int(w*.59)]
              mean=middle.mean((0,1));std=middle.std((0,1))
              assert not (mean[0]<70 and mean[1]<95 and mean[2]<115
                  and max(std)<24),('Possible YOU DIED modal',name,mean,std)
          for a,b in (('09_north_kind_5.png','10_legacy_scene_9.png'),
                      ('10_legacy_scene_9.png','10_legacy_scene_10.png'),
                      ('10_legacy_scene_10.png','10_legacy_scene_11.png')):
              im1=Image.open(folder+a).convert('RGB')
              im2=Image.open(folder+b).convert('RGB')
              delta=sum(ImageStat.Stat(ImageChops.difference(im1,im2)).mean)/3
              assert delta>12,(a,b,'unchanged stale view',delta)
          print('PASS V166: real scene transitions and no death-screen QA capture')
          PY
          python3 - <<'PY'
          from PIL import Image
          for name in ('02_world_normal.png','04_world_zoomed_out.png'):
              im=Image.open('/tmp/sp165/visual/'+name).convert('RGB')
              r,g,b=im.getpixel((im.width//2,130))
              assert not (b>175 and r<100 and g>65 and g<190), (name,'fullscreen help overlay still visible',(r,g,b))
          print('PASS: captured real unobstructed game visuals')
          PY
          SCRIPT
          chmod +x /tmp/sp165/emulator.sh
      - name: Actual Android emulator capture (not a simulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 3072
          disable-animations: true
          script: bash /tmp/sp165/emulator.sh
      - name: Print reduced real-emulator visual evidence for review
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,io
          folder=Path('/tmp/sp165/visual')
          image_names=(list(folder.glob('07_interior_kind_*.png'))+
                       list(folder.glob('08_centre_kind_*.png'))+
                       list(folder.glob('09_north_kind_*.png'))+
                       list(folder.glob('10_legacy_scene_*.png')))
          for path in sorted(image_names):
              filename=path.name
              if not path.is_file():continue
              img=Image.open(path).convert('RGB')
              img.thumbnail((960,540))
              stream=io.BytesIO()
              img.save(stream,format='JPEG',quality=60,optimize=True)
              print('V166_VISUAL_'+filename.split('.')[0]+'='+base64.b64encode(stream.getvalue()).decode('ascii'))
              print('V166_VISUAL_DIM_'+filename.split('.')[0]+'='+str(img.size))
          PY
      - name: Save visual QA screenshots only; never publish test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP_V166_Real_Emulator_Art_QA
          path: |
            /tmp/sp165/atlas-qa.png
            /tmp/sp165/visual/
          retention-days: 14
          if-no-files-found: warn
