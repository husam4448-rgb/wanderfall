name: SP Headgear 125 Individual Artwork QA
on:
  push:
    branches: [assets/headgear-individual-20261109]
    paths:
      - 'tools/headgear-original/draw_head125.py'
      - '.github/workflows/sp-headgear-draw-125.yml'
permissions:
  contents: write
jobs:
  produce-head125:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/headgear-original
          sparse-checkout-cone-mode: false
      - name: Install image tooling
        run: python3 -m pip install --user Pillow
      - name: Paint individual Head 125 equipment and verify original pixels
        run: python3 tools/headgear-original/draw_head125.py
      - name: Commit preview and layered production assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/headgear-original/head125-production/
          git diff --cached --quiet && exit 0
          git commit -m "assets: add source-locked Head 125 individual helmet/mask review"
          git push