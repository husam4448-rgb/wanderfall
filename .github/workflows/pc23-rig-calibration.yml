name: PC33 Rifle Down-Aim Head Clearance and IK Contact QA

on:
  push:
    branches: [ pc23-humanoid-rig-calibration, pc23-clean-visual-review, pc24-art-fidelity-reference-loadout, pc24-pistol-aim-posture, pc25-articulated-sleeve-fidelity, pc26-gait-cycle-evidence, pc27-balanced-alternating-gait, pc28-articulated-knees, pc28-knee-cuff-repair, pc29-knee-stance-proportions, pc30-weapon-hand-wrist-consistency, pc30-weapon-art-contact-fitting, pc31-reference-shoulder-aim-body, pc32-authored-arm-bone-renderer, pc33-aim-pose-head-clearance ]
    paths:
      - '.ci/trigger-pc23-rig-calibration'
      - '.github/workflows/pc23-rig-calibration.yml'
      - 'patches/apply_pc22_canonical_arm_candidate.py'
      - 'patches/apply_pc23_humanoid_rig_calibration.py'
      - 'patches/apply_pc24_reference_loadout.py'
      - 'patches/apply_pc25_sleeve_art.py'
      - 'tools/qa_pc25_sleeve_visual.py'
      - 'patches/apply_pc26_gait_capture.py'
      - 'tools/qa_pc26_gait_cycle.py'
      - 'patches/apply_pc27_balanced_gait.py'
      - 'tools/qa_pc27_foot_cycle.py'
      - 'patches/apply_pc28_articulated_knees.py'
      - 'tools/qa_pc28_knees.py'
      - 'tools/pc28_ci_status.py'
      - 'patches/apply_pc28_cuff_repair.py'
      - 'tools/qa_pc28_cuff.py'
      - 'patches/apply_pc29_knee_stance.py'
      - 'tools/qa_pc29_knee_stance.py'
      - 'patches/apply_pc30_wrist_grip_consistency.py'
      - 'tools/qa_pc30_weapon_contacts.py'
      - 'patches/apply_pc30_rifle_contact_fit.py'
      - 'tools/qa_pc30_rifle_art_fit.py'
      - 'patches/apply_pc31_reference_shoulder_aim.py'
      - 'tools/qa_pc31_reference_shoulders.py'
      - 'patches/apply_pc32_authored_arm_bones.py'
      - 'tools/qa_pc32_arm_art.py'
      - 'patches/apply_pc33_rifle_low_ready.py'
      - 'tools/qa_pc33_rifle_low_ready.py'
      - 'tools/build_pc22_canonical_arm_assets.py'
      - 'tools/build_pc22_role_overlays.py'
      - 'tools/qa_pc22_arm_visual_contract.py'
      - 'tools/qa_pc22_hybrid_v3.py'
      - 'tools/qa_pc23_anatomy.py'
      - 'assets/authored2d/unified_character/rig/**'
  workflow_dispatch:

concurrency:
  group: pc23-rig-calibration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  SOURCE_SHA256: ae4eff17e5f281f5867ac2d82207fcf96e6c8b649432acd48816aebab76fa308
  SOURCE_ARCHIVE: /tmp/Wanderfall_Phase16_Game_Source.tar.xz
  PROJECT_DIR: game
  GODOT_ZIP: /tmp/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BIN: /tmp/Godot_v4.7.2-stable_linux.x86_64
  GODOT_TEMPLATES_TPZ: /tmp/Godot_v4.7.2-stable_export_templates.tpz
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  APK_PATH: SurvivalParadise_PC33_RifleLowReady.apk
  MAX_APK_BYTES: '419430400'

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: PC28 independently report workflow start
        shell: bash
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/pc28_ci_status.py STARTED "GitHub workflow initiated"

      - name: Static PC23 anatomy and patch validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy
          python3 -m py_compile patches/apply_pc22_canonical_arm_candidate.py
          python3 -m py_compile patches/apply_pc23_humanoid_rig_calibration.py
          python3 -m py_compile patches/apply_pc24_reference_loadout.py
          python3 -m py_compile patches/apply_pc25_sleeve_art.py
          python3 -m py_compile tools/qa_pc25_sleeve_visual.py
          python3 -m py_compile patches/apply_pc26_gait_capture.py
          python3 -m py_compile tools/qa_pc26_gait_cycle.py
          python3 -m py_compile patches/apply_pc27_balanced_gait.py
          python3 -m py_compile tools/qa_pc27_foot_cycle.py
          python3 -m py_compile patches/apply_pc28_articulated_knees.py
          python3 -m py_compile tools/qa_pc28_knees.py
          python3 -m py_compile tools/pc28_ci_status.py
          python3 -m py_compile patches/apply_pc28_cuff_repair.py
          python3 -m py_compile tools/qa_pc28_cuff.py
          python3 -m py_compile patches/apply_pc29_knee_stance.py
          python3 -m py_compile tools/qa_pc29_knee_stance.py
          python3 -m py_compile patches/apply_pc30_wrist_grip_consistency.py
          python3 -m py_compile tools/qa_pc30_weapon_contacts.py
          python3 -m py_compile patches/apply_pc30_rifle_contact_fit.py
          python3 -m py_compile tools/qa_pc30_rifle_art_fit.py
          python3 -m py_compile patches/apply_pc31_reference_shoulder_aim.py
          python3 -m py_compile tools/qa_pc31_reference_shoulders.py
          python3 -m py_compile patches/apply_pc32_authored_arm_bones.py
          python3 -m py_compile tools/qa_pc32_arm_art.py
          python3 -m py_compile patches/apply_pc33_rifle_low_ready.py
          python3 -m py_compile tools/qa_pc33_rifle_low_ready.py
          python3 -m py_compile tools/qa_pc23_anatomy.py
          python3 tools/qa_pc23_anatomy.py "$GITHUB_WORKSPACE" | tee pc23-anatomy-qa.json

      - name: Reconstruct exact game and apply PC22 recovery then PC23 calibration
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part_*.b64 > /tmp/wanderfall_source.b64
          base64 --decode /tmp/wanderfall_source.b64 > "$SOURCE_ARCHIVE"
          echo "$SOURCE_SHA256  $SOURCE_ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT_DIR"
          tar -xJf "$SOURCE_ARCHIVE" -C "$PROJECT_DIR"

          python3 patches/apply_godot_47_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v017_ui_overhaul.py "$PROJECT_DIR"
          python3 patches/apply_v0171_inventory_polish.py "$PROJECT_DIR"
          python3 patches/apply_v0172_hud_customization.py "$PROJECT_DIR"
          python3 patches/fix_v0173_applicator_path.py
          python3 patches/apply_v0173_touch_layout_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v0174_ui_pause_completion.py "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('patches/apply_v0175_hotbar_sensitivity.py')
          s=p.read_text(encoding='utf-8')
          old='''replace_once(
              "scripts/settings/settings_hud.gd",
              '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n\\n    var pause_names :=',
              '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n'
              '    if movement_sensitivity_slider != null:\\n'
              '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'
              '    if movement_sensitivity_label != null:\\n'
              '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'
              '    var pause_names :=',
          )'''
          new='''replace_once(
              "scripts/settings/settings_hud.gd",
              '    var pause_names :=',
              '    if movement_sensitivity_slider != null:\\n'
              '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'
              '    if movement_sensitivity_label != null:\\n'
              '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'
              '    var pause_names :=',
          )'''
          if old not in s:
              raise SystemExit('Expected v0.17.5 applicator block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

          python3 patches/apply_v0175_hotbar_sensitivity.py "$PROJECT_DIR"
          python3 patches/apply_v0176_hotbar_deadzone.py "$PROJECT_DIR"
          python3 patches/apply_v0177_mobile_hotbar_layers.py "$PROJECT_DIR"
          python3 patches/apply_v0178_dedicated_hotbar_layer.py "$PROJECT_DIR"
          python3 patches/apply_v0179_quick_item_buttons.py "$PROJECT_DIR"

          python3 tools/build_pc22_canonical_arm_assets.py "$GITHUB_WORKSPACE" "$PROJECT_DIR"
          python3 tools/build_pc22_role_overlays.py "$GITHUB_WORKSPACE"
          python3 tools/qa_pc22_arm_visual_contract.py "$GITHUB_WORKSPACE"
          python3 tools/qa_pc22_hybrid_v3.py "$GITHUB_WORKSPACE"
          python3 patches/apply_pc22_canonical_arm_candidate.py "$PROJECT_DIR"
          python3 patches/apply_pc23_humanoid_rig_calibration.py "$PROJECT_DIR"
          python3 patches/apply_pc24_reference_loadout.py "$PROJECT_DIR"
          python3 patches/apply_pc25_sleeve_art.py "$PROJECT_DIR"
          python3 patches/apply_pc26_gait_capture.py "$PROJECT_DIR"
          python3 patches/apply_pc27_balanced_gait.py "$PROJECT_DIR"
          python3 patches/apply_pc28_articulated_knees.py "$PROJECT_DIR"
          python3 patches/apply_pc28_cuff_repair.py "$PROJECT_DIR"
          python3 patches/apply_pc29_knee_stance.py "$PROJECT_DIR"
          python3 patches/apply_pc30_wrist_grip_consistency.py "$PROJECT_DIR"
          python3 patches/apply_pc30_rifle_contact_fit.py "$PROJECT_DIR"
          python3 patches/apply_pc31_reference_shoulder_aim.py "$PROJECT_DIR"
          python3 patches/apply_pc32_authored_arm_bones.py "$PROJECT_DIR"
          python3 patches/apply_pc33_rifle_low_ready.py "$PROJECT_DIR"

          grep -q 'PC23 HUMANOID RIG CALIBRATION' "$PROJECT_DIR/scripts/art/d2d29_minimal_token_runtime.gd"
          grep -q 'pc23_humanoid_rig_system.gd' "$PROJECT_DIR/scripts/art/d2d29_minimal_token_runtime.gd"
          grep -q 'version/code=205' "$PROJECT_DIR/export_presets.cfg"
          grep -q 'version/name="0.22.0-PC33-RIFLE-LOW-READY"' "$PROJECT_DIR/export_presets.cfg"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$GODOT_ZIP" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $GODOT_ZIP" | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp
          curl -fL --retry 3 --retry-delay 2 -o "$GODOT_TEMPLATES_TPZ" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "$GODOT_TEMPLATES_SHA256  $GODOT_TEMPLATES_TPZ" | sha256sum -c -
          rm -rf /tmp/godot_export_templates
          mkdir -p /tmp/godot_export_templates
          unzip -q "$GODOT_TEMPLATES_TPZ" -d /tmp/godot_export_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot_export_templates/templates/. "$TEMPLATE_DIR/"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null

      - name: Godot import and parser validation
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --quit --verbose 2>&1 | tee pc23-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Failed to create an autoload|Compile Error:|Parse Error:' pc23-import.log; then exit 1; fi

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 120 --verbose 2>&1 | tee pc23-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Compile Error:|Parse Error:|Invalid call|Invalid get index' pc23-smoke.log; then exit 1; fi

      - name: PC28 independently report Godot smoke test result
        shell: bash
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/pc28_ci_status.py GODOT_PASS "Godot source import and runtime smoke passed"

      - name: Capture actual Godot calibration states
        shell: bash
        run: |
          set -euo pipefail
          CAP="$GITHUB_WORKSPACE/pc23-runtime-captures"
          mkdir -p "$CAP"
          ARM_CAPTURE_DIR="$CAP" PC23_CALIBRATION_CAPTURE=1 timeout 60s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc23-capture.log
          CAP_COUNT="$(find "$CAP" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
          LOG_COUNT="$(grep -o 'PC22_ARM_CAPTURE_COMPLETE:[0-9]*' pc23-capture.log | tail -1 | cut -d: -f2)"
          test -n "$LOG_COUNT"
          test "$CAP_COUNT" -eq "$LOG_COUNT"
          test "$CAP_COUNT" -ge 72
          grep -q 'PC22_ARM_GEOMETRY_OK:' pc23-capture.log
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc23-capture.log
          if grep -q 'PC22_ARM_GEOMETRY_FAIL' pc23-capture.log; then exit 1; fi
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Compile Error:|Parse Error:|Invalid call|Invalid get index' pc23-capture.log; then exit 1; fi

      - name: Capture optional instrumented PC23 anatomy diagnostics
        shell: bash
        run: |
          set -euo pipefail
          DIAG="$GITHUB_WORKSPACE/pc23-diagnostic-captures"
          mkdir -p "$DIAG"
          PC23_SHOW_RIG_DIAGNOSTICS=1 ARM_CAPTURE_DIR="$DIAG" PC23_CALIBRATION_CAPTURE=1 timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc23-diagnostic-capture.log
          DIAG_COUNT="$(find "$DIAG" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
          test "$DIAG_COUNT" -ge 72
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc23-diagnostic-capture.log
          if grep -E 'SCRIPT ERROR:|Compile Error:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc23-diagnostic-capture.log; then exit 1; fi

      - name: Capture PC24 dressed-reference outfit states
        shell: bash
        run: |
          set -euo pipefail
          REF_CAP="$GITHUB_WORKSPACE/pc24-reference-outfit-captures"
          mkdir -p "$REF_CAP"
          PC24_REFERENCE_OUTFIT_CAPTURE=1 ARM_CAPTURE_DIR="$REF_CAP" PC23_CALIBRATION_CAPTURE=1 timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc24-reference-capture.log
          REF_COUNT="$(find "$REF_CAP" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
          test "$REF_COUNT" -ge 72
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc24-reference-capture.log
          if grep -E 'SCRIPT ERROR:|Compile Error:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc24-reference-capture.log; then exit 1; fi

      - name: Capture PC25 unmodified sleeve comparator
        shell: bash
        run: |
          set -euo pipefail
          LEGACY="$GITHUB_WORKSPACE/pc25-legacy-art-captures"
          mkdir -p "$LEGACY"
          PC25_LEGACY_ARM_ART=1 PC24_REFERENCE_OUTFIT_CAPTURE=1 ARM_CAPTURE_DIR="$LEGACY" timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc25-legacy-capture.log
          test "$(find "$LEGACY" -maxdepth 1 -name '*.png' | wc -l)" -ge 72
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc25-legacy-capture.log
          if grep -E 'SCRIPT ERROR:|Compile Error:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc25-legacy-capture.log; then exit 1; fi

      - name: Verify actual PC25 sleeve-art rendering changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa_pc25_sleeve_visual.py

      - name: Capture PC26 full 8-phase walking and running cycles
        shell: bash
        run: |
          set -euo pipefail
          GAIT="$GITHUB_WORKSPACE/pc26-gait-captures"
          mkdir -p "$GAIT"
          PC26_GAIT_CAPTURE=1 ARM_CAPTURE_DIR="$GAIT" timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc26-gait-capture.log
          COUNT="$(find "$GAIT" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
          test "$COUNT" -eq 32
          grep -q 'PC26_GAIT_CAPTURE_PREPARED:32' pc26-gait-capture.log
          grep -q 'PC22_ARM_CAPTURE_COMPLETE:32' pc26-gait-capture.log
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc26-gait-capture.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc26-gait-capture.log; then exit 1; fi

      - name: Build PC26 walk-run full-cycle GIF QA evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa_pc26_gait_cycle.py | tee pc26-gait-qa.log

      - name: Capture PC27 legacy gait as independent comparator
        shell: bash
        run: |
          set -euo pipefail
          LEGACY="$GITHUB_WORKSPACE/pc27-legacy-gait-captures"
          mkdir -p "$LEGACY"
          PC27_LEGACY_GAIT=1 PC26_GAIT_CAPTURE=1 ARM_CAPTURE_DIR="$LEGACY" timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc27-legacy-gait-capture.log
          COUNT="$(find "$LEGACY" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
          test "$COUNT" -eq 32
          grep -q 'PC22_ARM_CAPTURE_COMPLETE:32' pc27-legacy-gait-capture.log
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc27-legacy-gait-capture.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc27-legacy-gait-capture.log; then exit 1; fi

      - name: Compare actual PC26 and PC27 foot-cycle poses
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa_pc27_foot_cycle.py | tee pc27-foot-qa.log

      - name: Capture PC27 original one-piece leg comparator
        shell: bash
        run: |
          set -euo pipefail
          LEGACY="$GITHUB_WORKSPACE/pc28-legacy-gait-captures"
          mkdir -p "$LEGACY"
          PC28_LEGACY_KNEE=1 PC26_GAIT_CAPTURE=1 ARM_CAPTURE_DIR="$LEGACY" timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc28-legacy-capture.log
          test "$(find "$LEGACY" -maxdepth 1 -name '*.png' | wc -l)" -eq 32
          grep -q 'PC22_ARM_CAPTURE_COMPLETE:32' pc28-legacy-capture.log
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc28-legacy-capture.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc28-legacy-capture.log; then exit 1; fi

      - name: Capture PC28 hip-knee-ankle diagnostics
        shell: bash
        run: |
          set -euo pipefail
          DIAG="$GITHUB_WORKSPACE/pc28-knee-diagnostics"
          mkdir -p "$DIAG"
          PC28_SHOW_KNEES=1 PC26_GAIT_CAPTURE=1 ARM_CAPTURE_DIR="$DIAG" timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc28-knee-diagnostic.log
          test "$(find "$DIAG" -maxdepth 1 -name '*.png' | wc -l)" -eq 32
          grep -q 'PC22_ARM_CAPTURE_COMPLETE:32' pc28-knee-diagnostic.log
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc28-knee-diagnostic.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PC22_ARM_GEOMETRY_FAIL|PC28_KNEE_BONE_MISMATCH' pc28-knee-diagnostic.log; then exit 1; fi

      - name: Verify PC28 knee movement and compare PC27
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa_pc28_knees.py | tee pc28-knee-qa.log

      - name: PC28 publish visual evidence milestone
        shell: bash
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/pc28_ci_status.py EVIDENCE_READY "Godot knee visual comparison captured; APK not yet verified"

      - name: Capture original PC28 disconnected cuff comparator
        shell: bash
        run: |
          set -euo pipefail
          OLD="$GITHUB_WORKSPACE/pc28-cuff-legacy"
          mkdir -p "$OLD"
          PC28_CUFF_LEGACY=1 PC26_GAIT_CAPTURE=1 ARM_CAPTURE_DIR="$OLD" timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc28-cuff-legacy.log
          test "$(find "$OLD" -maxdepth 1 -name '*.png' | wc -l)" -eq 32
          grep -q 'PC22_ARM_CAPTURE_COMPLETE:32' pc28-cuff-legacy.log
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc28-cuff-legacy.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc28-cuff-legacy.log; then exit 1; fi

      - name: Verify PC28 repaired cuff differs from initial candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa_pc28_cuff.py | tee pc28-cuff-qa.log

      - name: Capture unshifted PC28 knee posture as independent baseline
        shell: bash
        run: |
          set -euo pipefail
          OLD="$GITHUB_WORKSPACE/pc29-legacy-knee-captures"
          mkdir -p "$OLD"
          PC29_LEGACY_STANCE=1 PC26_GAIT_CAPTURE=1 ARM_CAPTURE_DIR="$OLD" timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc29-legacy-posture.log
          test "$(find "$OLD" -maxdepth 1 -name '*.png' | wc -l)" -eq 32
          grep -q 'PC22_ARM_CAPTURE_COMPLETE:32' pc29-legacy-posture.log
          grep -q 'PC22_RUNTIME_SWEEP_OK' pc29-legacy-posture.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc29-legacy-posture.log; then exit 1; fi

      - name: Verify PC29 knee extension versus original boot position
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa_pc29_knee_stance.py | tee pc29-knee-stance-qa.log

      - name: Capture PC30 old weapon-to-wrist contract for exact comparison
        shell: bash
        run: |
          set -euo pipefail
          OLD="$GITHUB_WORKSPACE/pc30-legacy-armed-captures"
          mkdir -p "$OLD"
          PC30_LEGACY_PALM_IK=1 PC24_REFERENCE_OUTFIT_CAPTURE=1 ARM_CAPTURE_DIR="$OLD" timeout 90s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc30-legacy-weapon.log
