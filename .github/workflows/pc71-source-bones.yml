name: PC71 Actual Original Art Attached To Native Skeleton2D
on:
  push:
    branches: [pc71-native-source-skinned-skeleton-qa]
    paths:
      - 'tools/qa_pc71_source_skeleton.py'
      - 'pc42-static-prototype/Main.gd'
      - '.github/workflows/pc71-source-bones.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-skinned-bone2d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recover authentic approved Survival Paradise artwork with original RGB
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy opencv-python-headless
          python3 tools/pc42_reference_cutout.py
          python3 tools/pc42h_articulated_arm_atlas.py
          python3 tools/qa_pc42_static_reference.py
      - name: Install pinned Godot
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
      - name: Native GDScript import and source Bone2D tree
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path pc42-static-prototype --quit >pc71-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' pc71-import.log; then cat pc71-import.log; exit 1; fi
      - name: Render original-source rest pose with native Skeleton2D
        run: |
          set -euo pipefail
          mkdir -p pc42-static-prototype/evidence
          PC42N_SOURCE_FIRST_PREVIEW=1 timeout 90s xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path pc42-static-prototype --resolution 1580x660 >pc71-rest.log 2>&1
          grep -q PC42B_SKELETON2D_BUILT pc71-rest.log
          cp pc42-static-prototype/evidence/godot_pc42_static_first_pose.png pc42-static-prototype/evidence/PC71_Original_Source_Rest_Bones.png
      - name: Move authentic source sprites via existing articulated Bone2D IK
        run: |
          set -euo pipefail
          PC42N_SOURCE_FIRST_PREVIEW=1 PC42S_WALK_TEST=1 PC42P_IDLE_BREATH_TEST=1 PC42C_CAPTURE=1 timeout 160s xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path pc42-static-prototype --resolution 1580x660 >pc71-native-motion.log 2>&1
          grep -q 'PC42C_REAL_IK_CONTACT_SWEEP_OK' pc71-native-motion.log
          grep -q 'PC42S_ORIGINAL_SOURCE_GAIT_READY' pc71-native-motion.log
          python3 tools/qa_pc71_source_skeleton.py pc42-static-prototype
      - name: Upload true source-sprite native GIF, images, manifest and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP-PC71-Real-Original-Sprites-On-Bone2D
          path: |
            pc42-static-prototype/evidence/
            pc42-static-prototype/assets/manifest.json
            pc42-static-prototype/assets/matte_review.png
            pc42-static-prototype/assets/reconstructed_static_pose.png
            pc71-*.log
          retention-days: 14
