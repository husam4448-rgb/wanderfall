name: SP269 investigate original S8 renderer and PERF controls
on:
  push:
    branches: [sp-v269-s8-render-diagnostics-20261021]
    paths: ['.github/workflows/sp-v269-inspect-mobile-perf.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a0ee30331ddf559ba6c5794441b43d867027d0b
      - name: Inspect Godot rendering and mobile quality flow
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part_*.b64 | base64 -d > /tmp/game.tar.xz
          mkdir -p /tmp/sp269
          tar -xJf /tmp/game.tar.xz -C /tmp/sp269
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/sp269')
          for p in root.rglob('project.godot'):
              print('PROJECT FILE',p)
              t=p.read_text()
              for line in t.splitlines():
                  if any(k in line for k in ('rendering/','renderer','viewport_','stretch/','physics_ticks','max_fps','size/viewport','size/window','mobile','quality','scale')):
                      print('SETTING',line)
          for p in root.rglob('*.gd'):
              t=p.read_text(errors='replace')
              if any(k in t.lower() for k in ('phase 14 - performance','performance mode','render_scale','performance preset','_loaded_chunks','quality_preset')):
                  print('SCRIPT',p)
                  lines=t.splitlines()
                  indexes=[i for i,line in enumerate(lines) if any(k in line.lower() for k in ('performance mode','render_scale','quality_preset','_loaded_chunks','perf_toggle','performance preset','perf_'))]
                  for i in indexes[:12]:
                      print('---',i+1)
                      print('\\n'.join(lines[max(0,i-3):min(len(lines),i+5)]))
          PY
