name: PC37 Shared Safe Aim and 100-Frame Visual Gate
on:
  push:
    branches: [pc37-pose-feasibility-gate]
    paths:
      - '.github/workflows/pc37-aim-visual.yml'
      - 'patches/apply_pc37_shared_aim_gate.py'
      - 'patches/apply_pc37_aim_capture.py'
      - 'tools/qa_pc37_aim_gate.py'
      - 'tools/sp_ci_status.py'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: pc37-visual-${{ github.ref }}
  cancel-in-progress: true
env:
  SOURCE_SHA256: ae4eff17e5f281f5867ac2d82207fcf96e6c8b649432acd48816aebab76fa308
  SOURCE_ARCHIVE: /tmp/Wanderfall_Phase16_Game_Source.tar.xz
  PROJECT_DIR: game
  GODOT_ZIP: /tmp/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BIN: /tmp/Godot_v4.7.2-stable_linux.x86_64
  GODOT_TEMPLATES_TPZ: /tmp/Godot_v4.7.2-stable_export_templates.tpz
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v5
      - name: Independent live status STARTED
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_ci_status.py STARTED "Starting PC37 guarded rifle aim and temporal screenshot verification"
      - name: Static safety-gate source checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy
          python3 -m py_compile tools/sp_ci_status.py patches/apply_pc37_shared_aim_gate.py patches/apply_pc37_aim_capture.py tools/qa_pc37_aim_gate.py
      - name: Reconstruct exact game and apply PC22 recovery then PC23 calibration
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part_*.b64 > /tmp/wanderfall_source.b64
          base64 --decode /tmp/wanderfall_source.b64 > "$SOURCE_ARCHIVE"
          echo "$SOURCE_SHA256  $SOURCE_ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT_DIR"
          tar -xJf "$SOURCE_ARCHIVE" -C "$PROJECT_DIR"

          python3 patches/apply_godot_47_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v017_ui_overhaul.py "$PROJECT_DIR"
          python3 patches/apply_v0171_inventory_polish.py "$PROJECT_DIR"
          python3 patches/apply_v0172_hud_customization.py "$PROJECT_DIR"
          python3 patches/fix_v0173_applicator_path.py
          python3 patches/apply_v0173_touch_layout_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v0174_ui_pause_completion.py "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('patches/apply_v0175_hotbar_sensitivity.py')
          s=p.read_text(encoding='utf-8')
          old='''replace_once(
              "scripts/settings/settings_hud.gd",
              '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n\\n    var pause_names :=',
              '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n'
              '    if movement_sensitivity_slider != null:\\n'
              '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'
              '    if movement_sensitivity_label != null:\\n'
              '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'
              '    var pause_names :=',
          )'''
          new='''replace_once(
              "scripts/settings/settings_hud.gd",
              '    var pause_names :=',
              '    if movement_sensitivity_slider != null:\\n'
              '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'
              '    if movement_sensitivity_label != null:\\n'
              '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'
              '    var pause_names :=',
          )'''
          if old not in s:
              raise SystemExit('Expected v0.17.5 applicator block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

          python3 patches/apply_v0175_hotbar_sensitivity.py "$PROJECT_DIR"
          python3 patches/apply_v0176_hotbar_deadzone.py "$PROJECT_DIR"
          python3 patches/apply_v0177_mobile_hotbar_layers.py "$PROJECT_DIR"
          python3 patches/apply_v0178_dedicated_hotbar_layer.py "$PROJECT_DIR"
          python3 patches/apply_v0179_quick_item_buttons.py "$PROJECT_DIR"

          python3 tools/build_pc22_canonical_arm_assets.py "$GITHUB_WORKSPACE" "$PROJECT_DIR"
          python3 tools/build_pc22_role_overlays.py "$GITHUB_WORKSPACE"
          python3 tools/qa_pc22_arm_visual_contract.py "$GITHUB_WORKSPACE"
          python3 tools/qa_pc22_hybrid_v3.py "$GITHUB_WORKSPACE"
          python3 patches/apply_pc22_canonical_arm_candidate.py "$PROJECT_DIR"
          python3 patches/apply_pc23_humanoid_rig_calibration.py "$PROJECT_DIR"
          python3 patches/apply_pc24_reference_loadout.py "$PROJECT_DIR"
          python3 patches/apply_pc25_sleeve_art.py "$PROJECT_DIR"
          python3 patches/apply_pc26_gait_capture.py "$PROJECT_DIR"
          python3 patches/apply_pc27_balanced_gait.py "$PROJECT_DIR"
          python3 patches/apply_pc28_articulated_knees.py "$PROJECT_DIR"
          python3 patches/apply_pc28_cuff_repair.py "$PROJECT_DIR"
          python3 patches/apply_pc29_knee_stance.py "$PROJECT_DIR"
          python3 patches/apply_pc30_wrist_grip_consistency.py "$PROJECT_DIR"
          python3 patches/apply_pc30_rifle_contact_fit.py "$PROJECT_DIR"
          python3 patches/apply_pc31_reference_shoulder_aim.py "$PROJECT_DIR"
          python3 patches/apply_pc32_authored_arm_bones.py "$PROJECT_DIR"
          python3 patches/apply_pc33_rifle_low_ready.py "$PROJECT_DIR"
          python3 patches/apply_pc36_coordinated_upper_pose.py "$PROJECT_DIR"
          python3 patches/apply_pc37_shared_aim_gate.py "$PROJECT_DIR"
          python3 patches/apply_pc37_aim_capture.py "$PROJECT_DIR"

          grep -q 'PC23 HUMANOID RIG CALIBRATION' "$PROJECT_DIR/scripts/art/d2d29_minimal_token_runtime.gd"
          grep -q 'pc23_humanoid_rig_system.gd' "$PROJECT_DIR/scripts/art/d2d29_minimal_token_runtime.gd"
          grep -q 'version/code=206' "$PROJECT_DIR/export_presets.cfg"
          grep -q 'version/name="0.22.0-PC36-COORDINATED-UPPER"' "$PROJECT_DIR/export_presets.cfg"


      - name: Preserve inspected source evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pc37-src
          cp "$PROJECT_DIR/scripts/art/d2d29_minimal_token_runtime.gd" pc37-src/d2d29_minimal_token_runtime.gd
          cp "$PROJECT_DIR/scripts/art/pc23_humanoid_rig_system.gd" pc37-src/pc23_humanoid_rig_system.gd
          cp "$PROJECT_DIR/scripts/art/pc37_aim_pose_2d.gd" pc37-src/pc37_aim_pose_2d.gd
          test -s pc37-src/pc37_aim_pose_2d.gd
      - name: Independent live status SOURCE_READY
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_ci_status.py SOURCE_READY "PC36 reconstructed; shared PC37 pose/fire safety state applied and archived"
      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$GODOT_ZIP" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $GODOT_ZIP" | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp
          curl -fL --retry 3 --retry-delay 2 -o "$GODOT_TEMPLATES_TPZ" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "$GODOT_TEMPLATES_SHA256  $GODOT_TEMPLATES_TPZ" | sha256sum -c -
          rm -rf /tmp/godot_export_templates
          mkdir -p /tmp/godot_export_templates
          unzip -q "$GODOT_TEMPLATES_TPZ" -d /tmp/godot_export_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot_export_templates/templates/. "$TEMPLATE_DIR/"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null

      - name: Godot import and parser validation
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --quit --verbose 2>&1 | tee pc23-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Failed to create an autoload|Compile Error:|Parse Error:' pc23-import.log; then exit 1; fi

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 120 --verbose 2>&1 | tee pc23-smoke.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Compile Error:|Parse Error:|Invalid call|Invalid get index' pc23-smoke.log; then exit 1; fi


      - name: Independent live status GODOT_PASS
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_ci_status.py GODOT_PASS "Godot parser and runtime smoke passed on reconstructed PC37"
      - name: Capture 100 original PC36 aim-transition frames
        shell: bash
        run: |
          set -euo pipefail
          OLD="$GITHUB_WORKSPACE/pc37-original-aim-captures"
          mkdir -p "$OLD"
          PC37_LEGACY_AIM=1 PC37_AIM_CAPTURE=1 ARM_CAPTURE_DIR="$OLD" timeout 180s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc37-original.log
          test "$(find "$OLD" -maxdepth 1 -name '*.png' | wc -l)" -eq 100
          grep -q 'PC22_ARM_CAPTURE_COMPLETE:100' pc37-original.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc37-original.log; then exit 1; fi
      - name: Capture 100 PC37 bounded-aim transition frames
        shell: bash
        run: |
          set -euo pipefail
          NEW="$GITHUB_WORKSPACE/pc37-gated-aim-captures"
          mkdir -p "$NEW"
          PC37_AIM_CAPTURE=1 ARM_CAPTURE_DIR="$NEW" timeout 180s xvfb-run -a "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1280x720 --verbose 2>&1 | tee pc37-bounded.log
          test "$(find "$NEW" -maxdepth 1 -name '*.png' | wc -l)" -eq 100
          grep -q 'PC22_ARM_CAPTURE_COMPLETE:100' pc37-bounded.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|PC22_ARM_GEOMETRY_FAIL' pc37-bounded.log; then exit 1; fi
      - name: Verify synchronized pose, blocked shots, and generate 4 actual GIFs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qa_pc37_aim_gate.py | tee pc37-visual-qa.log
      - name: Independent live status VISUAL_EVIDENCE_READY
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_ci_status.py VISUAL_EVIDENCE_READY "100 male/female left-right real Godot frames; original vs guarded and 4 GIFs. Manual visual verdict pending, no APK"
      - name: Publish immutable pre-APK evidence
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalParadise-PC37-VisualGate-${{ github.sha }}
          path: |
            pc37-aim-evidence/
            pc37-original-aim-captures/
            pc37-gated-aim-captures/
            pc37-src/pc37_aim_pose_2d.gd
            pc37-visual-qa.log
            pc37-original.log
            pc37-bounded.log
            pc23-import.log
            pc23-smoke.log
          retention-days: 30
      - name: Independent terminal reporting
        if: always()
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_ci_status.py "${{ job.status == 'success' && 'COMPLETED' || 'FAILED' }}" "PC37 technical checks are ${{ job.status }}; visual approval separate; NO APK"
