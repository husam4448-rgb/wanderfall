name: Survival Paradise V119 — TALK Drag Crash Fix and Subtle Gunfire FX
on:
  push:
    branches: [sp-native-v119-hud-talk-crash-natural-firefx-20261105]
    paths:
      - 'survival-paradise/native-game/**'
      - '.github/workflows/sp-v119-talk-drag-natural-gunfire.yml'
  workflow_dispatch:

concurrency:
  group: survival-paradise-v119-talk-drag-natural-gunfire
  cancel-in-progress: true

jobs:
  verify-native-character-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
            assets/authored2d
            assets/world
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate the exact locked V31/V56 source art
        run: |
          set -euo pipefail
          python3 -m pip install --user -q Pillow numpy
          python3 survival-paradise/native-game/tools/extract_locked_atlases.py
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          r=Path("survival-paradise/native-game")
          for encoded,dest,sha in [
             ("approved_v29_axe.png.b64","approved_v29_axe.png","f0d146757318e620024cae0c2a34243bdd9339a939a7f51e5428ae8250620dee"),
             ("approved_v44_walk_palette.png.b64","approved_v44_walk_palette.png","fd01230e9c13ffd3087e933abe976a2179d80e9adc9b0710f899a7bef7fc3d71")
          ]:
              data=base64.b64decode((r/"tools"/encoded).read_text().strip(),validate=True)
              assert hashlib.sha256(data).hexdigest()==sha,encoded
              (r/"app/src/main/assets"/dest).write_bytes(data)
          PY
          python3 survival-paradise/native-game/tools/build_v51_assets.py
          python3 survival-paradise/native-game/tools/build_v52_idle.py
          python3 survival-paradise/native-game/tools/fix_v53_skin_palette.py
          python3 survival-paradise/native-game/tools/build_v56_approved_character_atlases.py
          python3 survival-paradise/native-game/tools/build_v74_biome_assets.py
          test "$(sha256sum survival-paradise/native-game/app/src/main/assets/body.png | cut -d' ' -f1)" = "141878713a6880d05879b7102c728581dddb55730434bcac8e050fe44b3d82ad"
      - name: Verify V119 source art, TALK control and new APK identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("survival-paradise/native-game")
          source=(root/"app/src/main/java/com/survivalparadise/nativegame/CharacterSkinsV109.java").read_text()
          gradle=(root/"app/build.gradle").read_text()
          assert "versionCode 119" in gradle
          assert "applicationId 'com.survivalparadise.nativegame.v119test'" in gradle
          assert "sp_v109_characters.zip" in source
          assert "CharacterAnimationV110.breathOffset" in source
          assert "CharacterAnimationV110.bodyFrame" in source
          assert "new Fit(base)" in source
          assert "boolean walking" in source
          print("V119 original V5 approved sources and isolated test package: PASS")
          PY
      - name: Test V119 original V109–V118 sprites, TALK drag geometry and firearm-only effects (pure JVM)
        run: |
          set -e
          R=survival-paradise/native-game
          mkdir -p /tmp/sp-v112-jvm
          javac -d /tmp/sp-v112-jvm "$R/app/src/main/java/com/survivalparadise/nativegame/AnimationCycle.java" "$R/tools/AnimationCycleTest.java" "$R/app/src/main/java/com/survivalparadise/nativegame/CharacterAnimationV110.java" "$R/tools/CharacterAnimationV110Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/Ballistics.java" "$R/app/src/main/java/com/survivalparadise/nativegame/HeadAimV111.java" "$R/tools/HeadAimV111Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/HeadFitOffsetsV112.java" "$R/tools/HeadFitOffsetsV112Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/CharacterScopeV113.java" "$R/tools/CharacterScopeV113Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/TorsoWidthV114.java" "$R/tools/TorsoWidthV114Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/PelvisWidthV115.java" "$R/tools/PelvisWidthV115Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/PelvisLegRigV116.java" "$R/tools/PelvisLegRigV116Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/WeaponPivotV117.java" "$R/tools/WeaponPivotV117Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/FollowFormationV61.java" "$R/app/src/main/java/com/survivalparadise/nativegame/CompanionOrdersV118.java" "$R/app/src/main/java/com/survivalparadise/nativegame/GunEffectsV118.java" "$R/tools/V118RegressionTest.java" "$R/app/src/main/java/com/survivalparadise/nativegame/HudDragV119.java" "$R/app/src/main/java/com/survivalparadise/nativegame/GunEffectsV119.java" "$R/tools/V119RegressionTest.java"
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.AnimationCycleTest
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.CharacterAnimationV110Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.HeadAimV111Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.HeadFitOffsetsV112Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.CharacterScopeV113Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.TorsoWidthV114Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.PelvisWidthV115Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.PelvisLegRigV116Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.WeaponPivotV117Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.V118RegressionTest
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.V119RegressionTest
      - name: Prepare Android 35 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use stable key when already configured
        env:
          SP_KEYSTORE_BASE64: ${{ secrets.SP_SIGNING_KEYSTORE_BASE64 }}
          SP_SIGNING_PASSWORD: ${{ secrets.SP_SIGNING_PASSWORD }}
          SP_SIGNING_KEY_PASSWORD: ${{ secrets.SP_SIGNING_KEY_PASSWORD }}
          SP_SIGNING_ALIAS: ${{ secrets.SP_SIGNING_ALIAS }}
        run: |
          if [ -n "$SP_KEYSTORE_BASE64" ] && [ -n "$SP_SIGNING_PASSWORD" ]; then
            echo "$SP_KEYSTORE_BASE64" | base64 --decode > /tmp/sp_native_stable_keystore.jks
            echo "SP_SIGNING_STORE=/tmp/sp_native_stable_keystore.jks" >> "$GITHUB_ENV"
            echo "SP_SIGNING_PASSWORD=$SP_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "SP_SIGNING_KEY_PASSWORD=$SP_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SP_SIGNING_ALIAS=$SP_SIGNING_ALIAS" >> "$GITHUB_ENV"
          else
            echo "::warning::No stable signing configured; resulting debug build might not upgrade existing installation."
          fi
      - name: Reconstruct and verify 200 approved character sources + V5 fittings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,io,json,hashlib
          root=Path("survival-paradise/native-game")
          parts=sorted((root/"source_v109").glob("part_*.bin"))
          assert len(parts)==8, f"expected 8 exact lossless source segments, found {len(parts)}"
          data=b"".join(p.read_bytes() for p in parts)
          actual=hashlib.sha256(data).hexdigest()
          expected="c8e364bc1485eb5251fa9494889977038268cbac10f455fa844d7b8a46f6dc3a"
          assert actual==expected,(actual,expected)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None,"corrupt source ZIP"
              for i in range(1,201):
                  assert f"heads/{i:03}.png" in z.namelist(),f"head {i} missing"
              pack=json.loads(z.read("v5_fittings.json"))
              assert pack["totalCharacters"]==200
              assert pack["animation"]["idleMode"]=="head-only-breathing"
              assert len(pack["characterOverrides"])==pack["overrideCount"]==51
              assert len(z.read("body_idle.png"))>100
              assert len(z.read("body_walk.png"))>100
          target=root/"app/src/main/assets/sp_v109_characters.zip"
          target.write_bytes(data)
          print("VERIFIED: 200 exact heads, 4 walk poses, static idle body, V5 51 overrides",len(data),actual)
          PY
      - name: Verify V114 approved source pixels, original pants and feet in all poses
        run: python3 survival-paradise/native-game/tools/test_v114_torso_source.py
      - name: V119 verify exact approved idle and four walking poses (immutable source)
        run: python3 survival-paradise/native-game/tools/test_v116_legs_exact.py
      - name: V119 regression: TALK editor independent coordinates + natural bullet FX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path("survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame")
          game=(d/"GameView.java").read_text()
          skins=(d/"CharacterSkinsV109.java").read_text()
          menu=(d/"MainActivity.java").read_text()
          assert 'characterSkinsV109.draw(c,skinIdV109' in game
          assert 'else if(characterSkinsV109!=null||!bandit)' in game
          assert 'if(characterSkinsV109==null){ // legacy equipment is hidden' in game
          assert 'playerSkinV109' in menu
          assert 'float breathing=CharacterAnimationV110.breathOffset' in skins
          assert 'CharacterAnimationV110.bodyFrame' in skins
          assert 'idleBreathingSpeedV110' in game and 'idleBreathingSpeedV110' in menu
          assert 'walkingAnimationMultiplierV79,' in game
          assert 'player?fitWalkFpsV108:npcWalkFpsV113' in game
          assert 'player?fitIdleBreathV108:npcBreathPixelsV113' in game
          assert 'HeadAimV111.neckX' in skins and 'HeadAimV111.neckY' in skins
          assert 'c.rotate(Math.max(-HeadAimV111.MAX_DEGREES' in skins
          assert 'playerHeadTiltV111=HeadAimV111.follow' in game
          assert 'headAimTiltV111' in game and 'headAimTiltV111' in menu
          assert 'player?playerHeadTiltV111:' in game
          assert 'HeadFitOffsetsV112.x(hw,fit.horizontal,headOffsetX)' in skins
          assert 'HeadFitOffsetsV112.y(hh,fit.vertical,breathing,headOffsetY)' in skins
          assert 'player?fitHeadXV108:npcHeadFitXV113' in game
          assert 'player?fitHeadYV108:npcHeadFitYV113' in game
          assert 'player?playerHeadSizeV113:npcHeadSizeV113,' in game
          assert 'player?playerTorsoWidthV114:npcTorsoWidthV114,' in game
          assert 'player?playerPelvisWidthV115:npcPelvisWidthV115);' in game
          assert 'PelvisWidthV115.percent(host.setting("pelvisWidthV115",100))' in game
          assert 'PelvisWidthV115.percent(host.setting("pelvisWidthV115NpcV113",100))' in game
          assert 'TorsoWidthV114.percent(host.setting("bodyWidthV114",100))' in game
          assert 'TorsoWidthV114.percent(host.setting("bodyWidthV114NpcV113",100))' in game
          assert 'drawBody(c,body,bodyFrame,fit.blend,left,top,unit,' in skins
          assert 'PelvisLegRigV116.part(frame,x,row+PelvisLegRigV116.PELVIS_TOP)' in skins
          assert 'PelvisLegRigV116.inwardPixels(pelvisWidth)' in skins
          assert 'Bitmap.createBitmap(separated[PelvisLegRigV116.LEFT_FOOT]' in skins
          assert 'Bitmap.createBitmap(separated[PelvisLegRigV116.RIGHT_FOOT]' in skins
          assert 'canvas.drawBitmap(layers.left,pelvisRigSource,destination,pixels);' in skins
          assert 'canvas.drawBitmap(layers.right,pelvisRigSource,destination,pixels);' in skins
          assert 'canvas.drawBitmap(layers.overlap,pelvisRigSource,destination,pixels);' in skins
          assert 'PELVIS_BAND_BOTTOM=240' in (d/'PelvisLegRigV116.java').read_text()
          assert 'PelvisWidthV115.LEGS_TOP' not in skins
          assert 'TorsoWidthV114.LOWER_BODY_TOP' in skins
          assert 'CharacterScopeV113.key("bodyWidthV114",scope)' in menu
          assert '"bodyWidthV114"' in menu
          assert 'CharacterScopeV113.key("pelvisWidthV115",scope)' in menu
          assert '"pelvisWidthV115"' in menu
          assert '"bodyWidthV114","pelvisWidthV115"' in menu
          assert 'CharacterScopeV113.headSizeMultiplier(headSizePercent)' in skins
          assert 'CharacterScopeV113.key("headSizeV82",scope)' in menu
          assert 'CharacterScopeV113.key("headAimTiltV111",scope)' in menu
          assert 'CharacterScopeV113.key("walkingAnimationSpeedV79",scope)' in menu
          assert 'CharacterScopeV113.SCOPE_KEY' in menu
          assert 'fitHeadXV108=CharacterFitV108.headX(host.prefs);' in game
          assert 'fitHeadYV108=CharacterFitV108.headY(host.prefs);' in game
          assert 'CharacterScopeV113.key("fitHeadXV108",scope)' in menu
          assert 'CharacterScopeV113.key("fitHeadYV108",scope)' in menu
          assert 'new Fit(base)' in skins and 'characterOverrides' in skins
          assert 'fps=2' in skins
          assert 'void draw(Canvas c,int id,boolean walking' in skins
          assert 'playerGunPivotXV117=WeaponPivotV117.clamp(host.setting("weaponPivotXV117",0))' in game
          assert 'playerGunPivotYV117=WeaponPivotV117.clamp(host.setting("weaponPivotYV117",0))' in game
          assert 'npcGunPivotXV117=WeaponPivotV117.clamp(host.setting("weaponPivotXV117NpcV113",0))' in game
          assert 'npcGunPivotYV117=WeaponPivotV117.clamp(host.setting("weaponPivotYV117NpcV113",0))' in game
          assert 'CharacterScopeV113.key("weaponPivotXV117",scope)' in menu
          assert 'CharacterScopeV113.key("weaponPivotYV117",scope)' in menu
          assert 'player?playerGunPivotXV117:npcGunPivotXV117' in game
          assert 'player?playerGunPivotYV117:npcGunPivotYV117' in game
          assert 'c.translate(pivotX-kick+WeaponPivotV117.localX(actorFitX,s)' in game
          assert 'WeaponPivotV117.relocateMuzzle(muzzle,facing,gunScale' in game
          assert 'WeaponPivotV117.relocateMuzzle(muzzle,face,rigScale' in game
          assert 'WeaponPivotV117.relocateMuzzle(tip,face,CharacterCollision.BASE_SCALE*scale' in game
          assert 'WeaponPivotV117.relocateMuzzle(tip,f.face,CharacterCollision.BASE_SCALE*scale' in game
          assert 'shoot(playerX,playerY,aimX,aimY,gun,false,face,true);' in game
          assert 'shoot(friend.x,friend.y,dx,dy,friend.gun,false,friend.face,false);' in game
          assert 'shoot(e.x,e.y,dx,dy,0,true,e.face,false);' in game
          assert 'weaponPivotXV117","weaponPivotYV117"' in menu
          assert 'new Fit(base)' in skins and 'characterOverrides' in skins
          assert 'class VerticalSliderV118' in (d/'VerticalSliderV118.java').read_text()
          assert 'class CharacterPreviewV118' in (d/'CharacterPreviewV118.java').read_text()
          assert 'sectionBoundariesV118' in menu and 'categoryPagesV118' in menu
          assert 'characterPreviewV118' in menu and 'activeCharacterPreviewV118' in menu
          assert 'void companionCommandsV118()' in menu
          assert 'CompanionOrdersV118.targetX' in game
          assert 'companionStayV118' in game and 'companionHoldFireV118' in game
          assert 'followSpacing=CompanionOrdersV118.spacing' in game
          assert 'TOP_FORM_EDITOR' in game and 'TOP_SET_EDITOR' in game
          assert 'COMMAND_EDITOR' in game and 'STATUS_EDITOR' in game
          assert 'HEADER_EDITOR' in game and 'PERF_EDITOR' in game
          assert 'hudExtraAtV118' in game and 'drawStatusWindowV118' in game
          assert 'drawSquadButtonV118' in game and 'topHudHitV118' in game
          assert 'drawGunEffectsV119(c)' in game and 'emitGunEffectsV119' in game
          assert 'GunEffectsV118.firearm(gun)' in game
          assert 'GunTracerV118' not in game and 'axeSwingTimeV118' in game
          assert 'HudDragV119.horizontalOffset(px,editGrabX,' in game
          assert 'HudDragV119.verticalOffset(py,editGrabY,' in game
          assert 'if(id==TALK_EDITOR)return talkLeftV94();' in game
          assert 'if(id==TALK_EDITOR)return talkTopV94();' in game
          assert 'target==TALK_EDITOR?talkLeftV94():uiX(target)' in game
          assert 'target==TALK_EDITOR?talkTopV94():uiY(target)' in game
          assert 'drawGunEffectsV119' in game and 'GunEffectsV119.BULLET_TRAIL_LENGTH' in game
          assert 'gunMuzzleV119' in game and 'gunTrailV119' in game
          assert '"gunMuzzleV119"' in menu and '"gunTrailV119"' in menu
          assert 'GunEffectsV119.firearm(weapon)' in game
          assert 'gunTracersV118' not in game
          assert 'float tip=32f+progress*175f' not in game
          assert 'weapon==11' in game and 'axeSwingTimeV118' in game
          assert 'WeaponPivotV117.relocateMuzzle(muzzle,facing,gunScale' in game
          assert 'c.translate(pivotX-kick+WeaponPivotV117.localX(actorFitX,s)' in game
          print("V119: TALK control uses contextual coordinates (no legacy ID lookup); original 200 characters and V118 HUD/squad retained; real short bullet streaks and tiny muzzle bursts, no synthetic glowing tracers")
          PY
      - name: Compile Android debug APK
        working-directory: survival-paradise/native-game
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK payload and version
        run: |
          set -e
          APK=survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/body.png'
          unzip -l "$APK" | grep -q 'assets/npc_idle_v56.png'
          unzip -l "$APK" | grep -q 'assets/sp_v109_characters.zip'
          mkdir -p artifacts
          cp "$APK" artifacts/SurvivalParadise_V119_Talk_Drag_Fix_Subtle_Gunfire.apk
          sha256sum artifacts/SurvivalParadise_V119_Talk_Drag_Fix_Subtle_Gunfire.apk > artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP_V119_Talk_Drag_Subtle_Gunfire_APK
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish V119 APK as direct GitHub prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=survival-paradise-v119-talk-drag-natural-gunfire
          APK=artifacts/SurvivalParadise_V119_Talk_Drag_Fix_Subtle_Gunfire.apk
          SUM=artifacts/SHA256.txt
          test -s "$APK" && test -s "$SUM"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" \
              --notes "V119 installs separately without replacing V118 or losing older saves. Fixes TALK button crashing during HUD drag: contextual button geometry is resolved safely without calling the legacy action geometry table. Mouse/finger anchoring, clamps and independent X/Y edits remain stable. Replaces V118's exaggerated long artificial glowing laser trails and giant flashes with short 13-pixel trails attached only to actual ballistic projectiles, plus 75ms small tapered muzzle flashes. Adds separate optional toggles for muzzle flash and bullet traces. No bullets, flashes or ammo use on the red axe or flashlight. Preserves all V118 settings categories, live character preview, movable HUD, squad commands, and all 200 approved source-locked sprites with original walking/foot geometry. JVM regression, pixel QA and APK compile passed."
          else
            gh release create "$TAG" "$APK" "$SUM" --target "$GITHUB_SHA" \
              -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Survival Paradise V119 — TALK Drag Crash Fixed / Natural Gunfire" \
              --notes "V119 fixes the HUD TALK-button drag crash, using contextual geometry and validated slider movement instead of the legacy ID table. Gunfire visuals are compact and natural: only real bullet projectiles leave 13px streaks and gun barrels show brief 75ms tapered flashes, both toggleable independently under Gameplay. Axe, flashlight and approved weapon rig keep their correct behavior; no melee bullets. Retains V118 segmented settings, editor coverage and companion squad orders, and all 200 approved V5 heads/51 overrides and original walking/body sprite geometry. Isolated installation preserves older apps."
          fi
