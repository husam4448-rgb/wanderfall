name: Survival Paradise V142 - Actual HUD and Character Emulator Visual QA
on:
  push:
    branches: [sp-native-v142-global-fit-hud-opacity-indoor-pan-20261115]
    paths: ['.github/workflows/sp-v142-hud-body-emulator-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download signed V142 debug test APK from public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sp142
          gh release download survival-paradise-v142-body-hud-indoor-pan-test \
            --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir /tmp/sp142
          test -s /tmp/sp142/*.apk
      - name: Enable Android emulator KVM access
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            ls -l /dev/kvm
          else
            echo "No /dev/kvm device: emulator may run slowly"
          fi
      - name: Launch app and capture actual Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 1536
          disable-animations: false
          script: |
            set -eu
            mkdir -p /tmp/sp142/visual
            adb wait-for-device
            # Avoid the Android first-run immersive-mode help overlay obscuring character art.
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            adb shell wm size 1920x1080 || true
            adb shell wm density 260 || true
            adb install /tmp/sp142/*.apk
            adb shell am start -n com.survivalparadise.nativegame.v142hudpantest/com.survivalparadise.nativegame.MainActivity
            sleep 8
            # Android's first immersive-mode launch can display a blue
            # "Viewing full screen" coach mark over the character preview.
            # Dismiss its safe-area "Got it" button before taking evidence.
            adb shell input tap 1130 330
            adb shell input tap 1140 335
            sleep 2
            adb shell screencap -p /sdcard/sp142_menu.png
            adb pull /sdcard/sp142_menu.png /tmp/sp142/visual/01_menu.png
            # The canvas menu is drawn with logical height 660. At 1920x1080,
            # its NEW GAME button center is approximately (744, 618).
            adb shell input tap 744 618
            sleep 8
            # Android may show the fullscreen coach mark only after gameplay
            # enters immersive mode; dismiss it a second time before capture.
            adb shell input tap 1130 330
            adb shell input tap 1140 335
            sleep 2
            adb shell screencap -p /sdcard/sp142_gameplay.png
            adb pull /sdcard/sp142_gameplay.png /tmp/sp142/visual/02_gameplay.png
            # Magnify the actual game character and nearby NPCs for closer art QA.
            adb shell input tap 1840 170
            adb shell input tap 1840 170
            sleep 2
            adb shell screencap -p /sdcard/sp142_gameplay_zoom.png
            adb pull /sdcard/sp142_gameplay_zoom.png /tmp/sp142/visual/03_gameplay_zoom.png
            # Capture live character and HUD settings rather than a
            # hypothetical reference or separately generated character.
            adb shell input tap 1796 48
            sleep 3
            adb shell screencap -p /sdcard/sp142_settings.png
            adb pull /sdcard/sp142_settings.png /tmp/sp142/visual/04_settings.png
            test -s /tmp/sp142/visual/04_settings.png
            adb logcat -d -t 1000 > /tmp/sp142/visual/logcat_tail.txt
            # Verify the package process still exists after menu and gameplay.
            adb shell pidof com.survivalparadise.nativegame.v142hudpantest
            if grep -E '(FATAL EXCEPTION|Process: com.survivalparadise.nativegame.v142hudpantest)' /tmp/sp142/visual/logcat_tail.txt; then echo 'Android runtime fatal exception detected'; exit 1; fi
            test -s /tmp/sp142/visual/01_menu.png
            test -s /tmp/sp142/visual/02_gameplay.png
            test -s /tmp/sp142/visual/03_gameplay_zoom.png
            test -s /tmp/sp142/visual/04_settings.png
      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP_V142_Outfit_Emulator_Visual_QA
          path: /tmp/sp142/visual/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish screenshots alongside test APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload survival-paradise-v142-body-hud-indoor-pan-test \
            /tmp/sp142/visual/01_menu.png /tmp/sp142/visual/02_gameplay.png /tmp/sp142/visual/03_gameplay_zoom.png /tmp/sp142/visual/04_settings.png \
            --clobber --repo "$GITHUB_REPOSITORY"
