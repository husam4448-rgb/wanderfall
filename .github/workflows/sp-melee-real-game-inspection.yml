name: SP Melee — Real Game Source Integration Inspection
on:
  push:
    branches: [sp-melee-six-angle-prototype]
    paths:
      - 'tools/inspect_sp_melee_integration.py'
      - '.github/workflows/sp-melee-real-game-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct original playable game source without writing to git
        run: |
          set -euo pipefail
          cat source_parts/part_*.b64 | base64 -d > /tmp/sp_source.tar.xz
          echo 'ae4eff17e5f281f5867ac2d82207fcf96e6c8b649432acd48816aebab76fa308  /tmp/sp_source.tar.xz' | sha256sum -c -
          mkdir -p /tmp/sp_melee_source_game
          tar -xJf /tmp/sp_source.tar.xz -C /tmp/sp_melee_source_game
          test -s /tmp/sp_melee_source_game/project.godot
      - name: Identify exact weapon, aim, mobile and player runtime integration points
        run: |
          set -euo pipefail
          python3 tools/inspect_sp_melee_integration.py /tmp/sp_melee_source_game
          test -s sp_melee_source_inspection.txt
      - name: Preserve source-inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP-Melee-RealGame-ReadOnlyInspection-${{ github.sha }}
          path: sp_melee_source_inspection.txt
          retention-days: 14
