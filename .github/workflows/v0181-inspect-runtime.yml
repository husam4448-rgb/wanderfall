name: Wanderfall v0.18.5 Combat Runtime Inspection

on:
  push:
    branches: [ main ]
    paths:
      - '.ci/trigger-v0181-inspect'

permissions:
  contents: read

env:
  SOURCE_SHA256: ae4eff17e5f281f5867ac2d82207fcf96e6c8b649432acd48816aebab76fa308
  SOURCE_ARCHIVE: /tmp/Wanderfall_Phase16_Game_Source.tar.xz
  PROJECT_DIR: game

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruct current test runtime
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part_*.b64 > /tmp/wanderfall_source.b64
          base64 --decode /tmp/wanderfall_source.b64 > "$SOURCE_ARCHIVE"
          echo "$SOURCE_SHA256  $SOURCE_ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT_DIR"
          tar -xJf "$SOURCE_ARCHIVE" -C "$PROJECT_DIR"
          python3 patches/apply_godot_47_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v017_ui_overhaul.py "$PROJECT_DIR"
          python3 patches/apply_v0171_inventory_polish.py "$PROJECT_DIR"
          python3 patches/apply_v0172_hud_customization.py "$PROJECT_DIR"
          python3 patches/fix_v0173_applicator_path.py
          python3 patches/apply_v0173_touch_layout_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v0174_ui_pause_completion.py "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patches/apply_v0175_hotbar_sensitivity.py')
          s = p.read_text(encoding='utf-8')
          old = '''replace_once(\n    "scripts/settings/settings_hud.gd",\n    '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n\\n    var pause_names :=',\n    '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n'\n    '    if movement_sensitivity_slider != null:\\n'\n    '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'\n    '    if movement_sensitivity_label != null:\\n'\n    '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'\n    '    var pause_names :=',\n)'''
          new = '''replace_once(\n    "scripts/settings/settings_hud.gd",\n    '    var pause_names :=',\n    '    if movement_sensitivity_slider != null:\\n'\n    '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'\n    '    if movement_sensitivity_label != null:\\n'\n    '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'\n    '    var pause_names :=',\n)'''
          if old not in s:
              raise SystemExit('Expected v0.17.5 applicator block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 patches/apply_v0175_hotbar_sensitivity.py "$PROJECT_DIR"
          python3 patches/apply_v0176_hotbar_deadzone.py "$PROJECT_DIR"
          python3 patches/apply_v0177_mobile_hotbar_layers.py "$PROJECT_DIR"
          python3 patches/apply_v0178_dedicated_hotbar_layer.py "$PROJECT_DIR"
          python3 patches/apply_v0179_quick_item_buttons.py "$PROJECT_DIR"
          true
      - name: Print D3D32.2 targets
        shell: bash
        run: |
          set -euo pipefail
          echo "=== PLAYER READY / DRAW / SHADOW / OCCLUSION ==="
          grep -nE 'func _ready|func _draw|shadow|occl|silhouette|hidden|canopy|player_actor|add_to_group|queue_redraw' game/scripts/player.gd || true
          echo "=== WORLD / TREE OCCLUSION ==="
          grep -RniE 'occl|silhouette|hidden|canopy|orange|tree.*shadow|shadow.*tree' game/scripts/world game/scripts/ecology game/scripts/art | head -n 300 || true
          echo "=== PLAYER.GD ==="
          sed -n '1,320p' game/scripts/player.gd
          echo "=== NATURAL RESOURCE OCCLUSION WINDOWS ==="
          grep -nE -C 12 'occl|silhouette|hidden|canopy|shadow' game/scripts/ecology/natural_resource.gd || true
          echo "=== WORLD CHUNK OCCLUSION WINDOWS ==="
          grep -nE -C 12 'occl|silhouette|hidden|canopy|shadow' game/scripts/world/world_chunk.gd || true
          echo "=== PRODUCTION SURVIVOR SCALE/DRAW ==="
          grep -nE -C 8 'PLAYER_WORLD_SPRITE_SCALE|shadow|silhouette|viewport_sprite.scale' game/scripts/art/production_survivor_visual.gd || true
      - name: Print D2D3 runtime targets
        shell: bash
        run: |
          set -euo pipefail
          echo "=== D2D3 RUNTIME TARGETS ==="
          sed -n '1,260p' game/scripts/player.gd
          echo "=== BANDIT ==="
          sed -n '1,260p' game/scripts/combat/bandit.gd
          echo "=== EQUIPMENT METHODS ==="
          grep -RniE 'class_name .*Equipment|get_visual_item|gear_changed|equipment_changed|weapon_changed|attachments_changed' game/scripts | head -n 300 || true
      - name: Collect combat runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inspect
          cp -R game/scripts inspect/scripts
          mkdir -p inspect/scenes inspect/data inspect/assets
          cp game/scenes/main.tscn inspect/scenes/main.tscn || true
          cp game/data/items.json inspect/data/items.json || true
          find game/assets -maxdepth 4 -type f | sort > inspect/assets/asset_manifest.txt || true
          find game/scripts -type f -name '*.gd' | sort > inspect/script_manifest.txt
          grep -RniE 'attack|shoot|firearm|melee|projectile|aim|crosshair|mobile_move|InputState' game/scripts > inspect/combat_index.txt || true
      - name: Print D2B2 animation integration snippets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("game/scripts/player.gd")
          s = p.read_text(encoding="utf-8").splitlines()
          keys = ("func _physics_process", "func _process", "func _draw", "func melee", "func _melee", "func perform", "func attack", "func _attack", "func quick_melee", "func _quick", "func set_crou", "func toggle_crou", "_facing", "_muzzle_flash_timer", "velocity", "crouch", "run")
          hits=[]
          for i,line in enumerate(s):
              if any(k in line for k in keys):
                  hits.append(i)
          shown=set()
          print("=== PLAYER D2B2 INTEGRATION WINDOWS ===")
          for i in hits:
              a=max(0,i-5); b=min(len(s),i+24)
              key=(a,b)
              if key in shown: continue
              shown.add(key)
              print(f"--- lines {a+1}-{b} ---")
              for j in range(a,b):
                  print(f"{j+1:04d}: {s[j]}")
          print("=== LAYERED ACTOR VISUAL SETTERS ===")
          q=Path("game/scripts/art/layered_actor_visual.gd")
          if q.is_file():
              for i,line in enumerate(q.read_text(encoding="utf-8").splitlines(),1):
                  if line.startswith("func set_") or line.startswith("func _process") or line.startswith("func _draw"):
                      print(f"{i:04d}: {line}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Wanderfall-v0.18.5-combat-runtime
          path: inspect
          retention-days: 2
          if-no-files-found: error
