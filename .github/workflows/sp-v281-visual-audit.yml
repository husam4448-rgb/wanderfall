name: SP281 NPC visual hot path audit
on:
  push:
    branches: [sp-v281-camp-cpu-profile-fix-20261023]
    paths: [.github/workflows/sp-v281-visual-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: husam4448-rgb/wanderfall
          run-id: 39902086073
          name: SP-D2D14-Original-HUD-World-Code
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backup
      - run: |
          set -euo pipefail
          mkdir src
          tar -xzf backup/SP_D2D14_Original_HUD_World_Source.tar.gz -C src
          python3 - <<'PY'
          from pathlib import Path
          root=Path('src')
          files={
           "scripts/art/layered_actor_visual.gd":[(1,195),(195,310)],
           "scripts/art/weapon_visual.gd":[(1,140)],
           "scripts/social/friendly_npc.gd":[(395,530)],
           "scripts/mobile_hud.gd":[(195,255)],
           "scripts/social/faction_camp.gd":[(80,185)]
          }
          for name,ranges in files.items():
              f=root/name
              if not f.exists():print('MISSING',name);continue
              s=f.read_text().splitlines()
              print('BEGIN_FILE',name,len(s))
              for begin,end in ranges:
                  for i in range(begin-1,min(end,len(s))):print("%04d | %s"%(i+1,s[i]))
              print('END_FILE',name)
          PY