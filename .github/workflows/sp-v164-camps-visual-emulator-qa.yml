name: Survival Paradise V164 - Genuine Android Camp Artwork Visual QA
on:
  push:
    branches: [sp-native-v164-settlement-camps-greenways-20261118]
    paths: ['.github/workflows/sp-v164-camps-visual-emulator-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-camp:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK and offline-compatible debug package
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build a temporary emulator-only signed debug APK
        working-directory: survival-paradise/native-game
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
          mkdir -p /tmp/sp164/visual
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/sp164/camp.apk
          test -s /tmp/sp164/camp.apk
      - name: Enable Android emulator hardware acceleration
        run: |
          if [ -c /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Prepare capture script
        run: |
          cat > /tmp/sp164/emulator_qa.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=com.survivalparadise.nativegame.v164camptest
          adb wait-for-device
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell wm size 1920x1080 || true
          adb shell wm density 260 || true
          adb install /tmp/sp164/camp.apk
          adb logcat -c
          timeout 28s adb shell am start -n "$PKG/com.survivalparadise.nativegame.MainActivity"
          sleep 9
          adb shell screencap -p /sdcard/v164_start.png
          adb pull /sdcard/v164_start.png /tmp/sp164/visual/01_menu.png
          if ! adb shell pidof "$PKG"; then
            echo 'ERROR: V164 app exited: capture process and Android runtime details'
            adb logcat -d > /tmp/sp164/visual/00_launch_failure_logcat.txt
            grep -E -A 30 -B 8 'FATAL EXCEPTION|Process: com.survivalparadise.nativegame.v164camptest|AndroidRuntime|OutOfMemoryError|NoClassDefFoundError|SP-V109|Fatal signal|ANR in' /tmp/sp164/visual/00_launch_failure_logcat.txt | tail -180 || true
            adb shell dumpsys activity activities | tail -80 || true
            exit 1
          fi
          adb shell input tap 1130 330
          adb shell input tap 740 620
          sleep 26
          adb shell screencap -p /sdcard/v164_camp.png
          adb pull /sdcard/v164_camp.png /tmp/sp164/visual/02_starter_camp.png
          adb shell input tap 1840 170
          adb shell input tap 1840 170
          sleep 2
          adb shell screencap -p /sdcard/v164_zoom.png
          adb pull /sdcard/v164_zoom.png /tmp/sp164/visual/03_low_zoom_camp.png
          adb logcat -d > /tmp/sp164/visual/logcat.txt
          adb shell pidof "$PKG"
          if grep -E '(FATAL EXCEPTION|Process: com.survivalparadise.nativegame.v164camptest)' /tmp/sp164/visual/logcat.txt; then
            echo 'ERROR: V164 Android app crashed';exit 1
          fi
          test -s /tmp/sp164/visual/02_starter_camp.png
          test -s /tmp/sp164/visual/03_low_zoom_camp.png
          echo 'PASS V164: native Android startup, real camp rendering, zoom and no FATAL EXCEPTION'
          SCRIPT
          chmod +x /tmp/sp164/emulator_qa.sh
      - name: Launch actual Android game and capture camp scene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 1536
          disable-animations: true
          script: bash /tmp/sp164/emulator_qa.sh
      - name: Preserve genuine screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP_V164_Camp_Art_Android_Visual_Evidence
          path: /tmp/sp164/visual/
          retention-days: 14
          if-no-files-found: warn
