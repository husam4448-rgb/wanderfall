name: Survival Paradise V162 - Android Emulator Visual Smoke QA
on:
  push:
    branches: [sp-native-v162-item-stats-road-inventory-20261117]
    paths: ['.github/workflows/sp-v162-emulator-smoke-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  visual-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get CI-verified V162 APK from successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sp157/visual
          gh run download 44167966992 --repo "$GITHUB_REPOSITORY" \
            --name Survival_Paradise_V162_Real_Stats_Roads_Test --dir /tmp/sp157
          test -s /tmp/sp157/Survival_Paradise_V162_Real_Stats_Roads_Test.apk
      - name: Enable Android emulator KVM
        run: |
          if [ -c /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Prepare one persistent-shell emulator test script
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sp157/emulator_test.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          PKG=com.survivalparadise.nativegame.v162statstest
          adb wait-for-device
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          adb shell wm size 1920x1080 || true
          adb shell wm density 260 || true
          adb install /tmp/sp157/Survival_Paradise_V162_Real_Stats_Roads_Test.apk
          adb logcat -c
          timeout 25s adb shell am start -n "com.survivalparadise.nativegame.v162statstest/com.survivalparadise.nativegame.MainActivity" || echo 'Activity launch command timed out; collect logcat'
          sleep 8
          adb logcat -d > /tmp/sp157/visual/logcat_startup.txt
          if ! adb shell pidof "$PKG"; then
            echo 'ERROR: game process exited before showing menu'
            grep -E -A 22 -B 6 'FATAL EXCEPTION|Process: com.survivalparadise.nativegame.v162statstest|AndroidRuntime|SP-V109' /tmp/sp157/visual/logcat_startup.txt | tail -160 || true
            exit 1
          fi
          adb shell input tap 1130 330
          adb shell input tap 1140 335
          sleep 2
          adb shell screencap -p /sdcard/v162_menu.png
          adb pull /sdcard/v162_menu.png /tmp/sp157/visual/01_menu.png
          adb shell input tap 744 618
          sleep 8
          adb shell input tap 1130 330
          sleep 2
          adb shell screencap -p /sdcard/v162_gameplay.png
          adb pull /sdcard/v162_gameplay.png /tmp/sp157/visual/02_gameplay.png
          adb shell input tap 1840 170
          adb shell input tap 1840 170
          sleep 2
          adb shell screencap -p /sdcard/v162_zoom.png
          adb pull /sdcard/v162_zoom.png /tmp/sp157/visual/03_gameplay_zoom.png
          adb logcat -d > /tmp/sp157/visual/logcat_tail.txt
          adb shell pidof "$PKG"
          if grep -E '(FATAL EXCEPTION|Process: com.survivalparadise.nativegame.v162statstest)' /tmp/sp157/visual/logcat_tail.txt; then
            echo 'ERROR: Android runtime fatal exception in V162'
            exit 1
          fi
          test -s /tmp/sp157/visual/01_menu.png
          test -s /tmp/sp157/visual/02_gameplay.png
          test -s /tmp/sp157/visual/03_gameplay_zoom.png
          echo 'PASS: V162 Android process, menu, gameplay, screenshots and logcat'
          SCRIPT
          chmod +x /tmp/sp157/emulator_test.sh
      - name: Install and visually smoke-test genuine Android game scene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 1536
          disable-animations: true
          script: bash /tmp/sp157/emulator_test.sh
      - name: Preserve actual emulator screenshots and logcat for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP_V162_Android_Emulator_Visual_Evidence
          path: /tmp/sp157/visual/
          if-no-files-found: warn
          retention-days: 14
