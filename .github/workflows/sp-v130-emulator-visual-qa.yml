name: SP V130 Emulator Visual QA
on:
  push:
    branches:
      - sp-native-v130-inventory-visibility-exteriors-20261106
    paths:
      - '.github/workflows/sp-v130-emulator-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  v130-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch already compiled V130 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/sp130
          gh release download survival-paradise-v130-inventory-vision-buildings-test \
            --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir /tmp/sp130
          test -s /tmp/sp130/*.apk
      - name: Render actual Android gameplay and native bag screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            adb shell wm size 1920x1080
            adb shell wm density 260
            adb install /tmp/sp130/*.apk
            adb shell am start -n com.survivalparadise.nativegame.v130worldpolish/com.survivalparadise.nativegame.MainActivity
            sleep 6
            mkdir -p /tmp/sp130/visual
            adb shell screencap -p /sdcard/qa_menu.png
            adb pull /sdcard/qa_menu.png /tmp/sp130/visual/01_menu.png
            adb shell input tap 741 618
            sleep 4
            adb shell screencap -p /sdcard/qa_world.png
            adb pull /sdcard/qa_world.png /tmp/sp130/visual/02_world.png
            adb shell input swipe 230 880 390 880 2000
            sleep 2
            adb shell screencap -p /sdcard/qa_exterior.png
            adb pull /sdcard/qa_exterior.png /tmp/sp130/visual/03_exterior.png
            adb shell input tap 1600 500
            sleep 3
            adb shell screencap -p /sdcard/qa_bag.png
            adb pull /sdcard/qa_bag.png /tmp/sp130/visual/04_bag.png
            test -s /tmp/sp130/visual/02_world.png
            test -s /tmp/sp130/visual/04_bag.png
      - name: Upload visual QA screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP_V130_Emulator_Visual_QA
          path: /tmp/sp130/visual/*.png
          if-no-files-found: warn
          retention-days: 14
