      - name: Prepare Android SDK and Gradle
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable permanent signing when secret-managed keystore is available
        env:
          SP_KEYSTORE_BASE64: ${{ secrets.SP_SIGNING_KEYSTORE_BASE64 }}
          SP_SIGNING_PASSWORD: ${{ secrets.SP_SIGNING_PASSWORD }}
          SP_SIGNING_KEY_PASSWORD: ${{ secrets.SP_SIGNING_KEY_PASSWORD }}
          SP_SIGNING_ALIAS: ${{ secrets.SP_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$SP_KEYSTORE_BASE64" ] && [ -n "$SP_SIGNING_PASSWORD" ]; then
            echo "$SP_KEYSTORE_BASE64" | base64 --decode > /tmp/sp_native_stable_keystore.jks
            echo "SP_SIGNING_STORE=/tmp/sp_native_stable_keystore.jks" >> "$GITHUB_ENV"
            echo "SP_SIGNING_PASSWORD=$SP_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "SP_SIGNING_KEY_PASSWORD=$SP_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SP_SIGNING_ALIAS=$SP_SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "V85 using stable secret-managed signing key."
          else
            echo "::warning::No stable signing key is set. APK cannot reliably upgrade earlier debug builds. Export saves before uninstalling."
          fi
      - name: Build REAL Android APK
        working-directory: survival-paradise/native-game
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify source art and all roles are actually inside the APK
        run: |
          set -euo pipefail
          ROOT=survival-paradise/native-game
          APK=$ROOT/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          for a in body.png gear.png approved_v44_walk_palette.png approved_v29_axe.png stable_v51_body.png npc_roles_v51.png npc_idle_v52.png npc_walk_v56.png npc_idle_v56.png crosshair_v62.png.b64 world_props_v74.png world_props_v74_manifest.json; do
            unzip -l "$APK" | grep -q "assets/$a"
            test "$(unzip -p "$APK" "assets/$a" | sha256sum | cut -d' ' -f1)" = \
                 "$(sha256sum "$ROOT/app/src/main/assets/$a" | cut -d' ' -f1)"
          done
          unzip -l "$APK" | grep -q 'classes.dex'
          echo "V51 BUILD PASS: immutable approved sprites plus 12 playable NPC identities bundled in native APK"
      - name: Package APK, source, and verified animation GIFs
        run: |
          mkdir -p artifacts
          R=survival-paradise/native-game
          cp "$R/app/build/outputs/apk/debug/app-debug.apk" artifacts/SurvivalParadise_V98_Equipment.apk
          cp "$R/previews/"*.gif "$R/previews/"*.png artifacts/
          cd survival-paradise
          zip -qr ../artifacts/SurvivalParadise_V98_Source.zip native-game \
            -x 'native-game/.gradle/*' 'native-game/app/build/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP_V98_Equipment
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish tested V91 APK as a direct GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=survival-paradise-v98-fitted-headgear-recolored-clothing
          APK=artifacts/SurvivalParadise_V98_Equipment.apk
          SRC=artifacts/SurvivalParadise_V98_Source.zip
          test -s "$APK" && test -s "$SRC"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" > artifacts/SurvivalParadise_V98_SHA256.txt
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SRC" artifacts/SurvivalParadise_V98_SHA256.txt --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SRC" artifacts/SurvivalParadise_V98_SHA256.txt \
              --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Survival Paradise V98 — Fitted headgear and torso-color replacements" \
              --notes "V98 keeps the 20 approved rear-layer backpacks and functional V97 NPC dialogues, shrinks/reanchors all four approved headgear items to actual V31 head geometry at 75/100/160 percent while tinting visor glass translucently, replaces the fake jacket/vest overlays with a lossless pixel-only torso recolor using approved V56 character palettes and retains the original black outline, skin, hands, pants, foot positions and four walking frames. Same Android package ID; versionCode 99. Stable signing still requires user-configured GitHub secrets; back up saves before reinstall if certificates differ."
          fi
      - name: Report V90 native Android build verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SP_RUN_ID: ${{ github.run_id }}
          SP_SHA: ${{ github.sha }}
          SP_STATUS: ${{ job.status }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/35/comments" \
            -f body="V90_NATIVE_ANDROID | $SP_STATUS | run $SP_RUN_ID | source $SP_SHA | https://github.com/$GITHUB_REPOSITORY/actions/runs/$SP_RUN_ID" || true
