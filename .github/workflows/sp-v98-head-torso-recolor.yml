          from pathlib import Path
          from PIL import Image
          import shutil,hashlib
          source=Path("assets/authored2d/unified_character")
          dest=Path("survival-paradise/native-game/app/src/main/assets/approved_equipment_v93")
          dest.mkdir(parents=True,exist_ok=True)
          original={
            "pack_civilian.png":"roles/civilian/male/backpack.png",
            "pack_guard.png":"roles/guard/male/backpack.png",
            "pack_medic.png":"roles/medic/male/backpack.png",
