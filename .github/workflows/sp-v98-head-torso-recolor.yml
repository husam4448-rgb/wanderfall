                    if original.getpixel((520+x,y))[3]>=220]
              if vals:
                  rgb=sorted(set(v[1][:3] for v in vals))
                  print("V98 sprite row",y,"visible",len(vals),"X",min(v[0] for v in vals),
                        max(v[0] for v in vals),"palette",rgb[:18])
          print("V98 original player torso editable pixel count:",len(eligible))
          assert len(eligible)>=6,"no editable torso colors identified in locked body"
          counts=[]
          for role in (2,7,10):
              changed=sum(1 for x,y in eligible if
                npc.getpixel((x,role*160+y))[3]>=220 and
                max(npc.getpixel((x,role*160+y))[:3])>=48 and
                original.getpixel((520+x,y))[:3]!=npc.getpixel((x,role*160+y))[:3])
              counts.append(changed)
          print("V98 approved role palette changed pixels:",counts)
          assert min(counts)>=4,"approved clothing palettes did not produce visible torso replacement"
          print("V98 PASS: outfits recolor only original torso, no skin/outline/geometry edits")
          PY
