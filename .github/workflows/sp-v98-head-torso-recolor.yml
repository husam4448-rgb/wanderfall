name: Survival Paradise V98 Fitted Headgear and Torso Palette Recolors
on:
  push:
    branches: [sp-native-v98-approved-head-torso-palette-20261102]
    paths:
      - 'survival-paradise/native-game/**'
      - 'assets/authored2d/**'
      - '.github/workflows/sp-v98-head-torso-recolor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'survival-paradise/native-game/**'
      - 'assets/authored2d/**'
      - '.github/workflows/sp-v98-head-torso-recolor.yml'
  workflow_dispatch:
concurrency:
  group: survival-paradise-v98-fitted-gear-torso-palette
  cancel-in-progress: true
jobs:
  native-android-game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write
    steps:
      - name: Report V90 native Android build run
        env:
          GH_TOKEN: ${{ github.token }}
          SP_RUN_ID: ${{ github.run_id }}
          SP_SHA: ${{ github.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/35/comments" \
            -f body="V90_NATIVE_ANDROID | STARTED | run $SP_RUN_ID | source $SP_SHA | https://github.com/$GITHUB_REPOSITORY/actions/runs/$SP_RUN_ID" || true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
            assets/authored2d
            assets/world
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare exact approved source assets
        run: |
          set -eu
          python3 -m pip install --user --quiet Pillow numpy
          python3 survival-paradise/native-game/tools/extract_locked_atlases.py
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          r=Path("survival-paradise/native-game")
          for encoded,dest,expected in [
             ("approved_v29_axe.png.b64","approved_v29_axe.png","f0d146757318e620024cae0c2a34243bdd9339a939a7f51e5428ae8250620dee"),
             ("approved_v44_walk_palette.png.b64","approved_v44_walk_palette.png","fd01230e9c13ffd3087e933abe976a2179d80e9adc9b0710f899a7bef7fc3d71")
          ]:
              data=base64.b64decode((r/"tools"/encoded).read_text().strip(),validate=True)
              assert hashlib.sha256(data).hexdigest()==expected
              (r/"app/src/main/assets"/dest).write_bytes(data)
          PY
          # No placeholder NPCs: this step REQUIRES the real approved
          # role art from the repository to generate twelve game-size atlases.
          python3 survival-paradise/native-game/tools/build_v51_assets.py
          python3 survival-paradise/native-game/tools/v51_previews.py
          # V51's idle preview was incorrect; remove it from the deliverables.
          rm -f survival-paradise/native-game/previews/SP_V51_Idle_Face_Stable.gif
          python3 survival-paradise/native-game/tools/build_v52_idle.py
          python3 survival-paradise/native-game/tools/fix_v53_skin_palette.py
          # Do not use reconstructed V51 as player/role animation artwork.
          # Build V56 directly from the immutable V44 source and canonical V31 idle.
          python3 survival-paradise/native-game/tools/build_v56_approved_character_atlases.py
          python3 survival-paradise/native-game/tools/v56_compare_preview.py
          python3 survival-paradise/native-game/tools/build_v74_biome_assets.py
          python3 survival-paradise/native-game/tools/v52_idle_preview.py
          # Exact V50 ORIGINAL body file MUST be present unedited.
          test "$(sha256sum survival-paradise/native-game/app/src/main/assets/body.png | cut -d' ' -f1)" = "141878713a6880d05879b7102c728581dddb55730434bcac8e050fe44b3d82ad"
      - name: Test walk, idle, exact face silhouette, NPC roles and terrain patches
        run: |
          set -eu
          mkdir -p /tmp/sp-v51-classes
          ROOT=survival-paradise/native-game
          P=$ROOT/app/src/main/java/com/survivalparadise/nativegame
          javac -d /tmp/sp-v51-classes \
            "$P"/AnimationCycle.java \
            "$P"/Ballistics.java \
            "$P"/CharacterCollision.java \
            "$P"/GameClockV47.java \
            "$P"/ShadowGeometryV47.java \
            "$P"/WalkAlignmentV48.java \
            "$P"/MuzzleGeometryV49.java \
            "$ROOT"/tools/AnimationCycleTest.java \
            "$ROOT"/tools/BallisticsTest.java \
            "$ROOT"/tools/CharacterCollisionTest.java \
            "$ROOT"/tools/ShadowDayNightV47Test.java \
            "$ROOT"/tools/WalkAlignmentV48Test.java \
            "$ROOT"/tools/MuzzleGeometryV49Test.java \
            "$ROOT"/tools/VisualCorrectionsV50Test.java \
            "$ROOT"/tools/V51CharacterTest.java \
            "$ROOT"/tools/V51WorldTest.java
          CP=/tmp/sp-v51-classes
          A=$ROOT/app/src/main/assets
          java -cp "$CP" com.survivalparadise.nativegame.AnimationCycleTest
          java -cp "$CP" com.survivalparadise.nativegame.BallisticsTest
          java -Djava.awt.headless=true -cp "$CP" com.survivalparadise.nativegame.CharacterCollisionTest "$A/body.png"
          java -cp "$CP" com.survivalparadise.nativegame.ShadowDayNightV47Test
          java -Djava.awt.headless=true -cp "$CP" com.survivalparadise.nativegame.WalkAlignmentV48Test "$A/approved_v44_walk_palette.png"
          java -Djava.awt.headless=true -cp "$CP" com.survivalparadise.nativegame.MuzzleGeometryV49Test "$A/gear.png"
          java -Djava.awt.headless=true -cp "$CP" com.survivalparadise.nativegame.VisualCorrectionsV50Test "$A/approved_v44_walk_palette.png" "$A/body.png"
          java -Djava.awt.headless=true -cp "$CP" com.survivalparadise.nativegame.V51CharacterTest "$A/stable_v51_body.png" "$A/npc_roles_v51.png" "$A/approved_v44_walk_palette.png"
          java -cp "$CP" com.survivalparadise.nativegame.V51WorldTest
      - name: V52 prove exact V40/V50 original planted idle for player and NPCs
        run: |
          set -euo pipefail
          ROOT=survival-paradise/native-game
          A=$ROOT/app/src/main/assets
          mkdir -p /tmp/sp-v52-classes
          javac -d /tmp/sp-v52-classes \
            "$ROOT/app/src/main/java/com/survivalparadise/nativegame/AnimationCycle.java" \
            "$ROOT/tools/V52ApprovedIdleTest.java"
          java -Djava.awt.headless=true -cp /tmp/sp-v52-classes \
            com.survivalparadise.nativegame.V52ApprovedIdleTest \
            "$A/body.png" "$A/npc_idle_v52.png" "$A/stable_v51_body.png"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/GameView.java').read_text()
          assert 'Bitmap idleSource=selectedIdle;' in p
          assert 'int sx=idleX;' in p
          assert 'static final int APPROVED_PLANTED_IDLE_FRAME=2;' in p
          assert 'static final int IDLE_HEAD_BODY_SPLIT=92;' in p
          assert 'static final int IDLE_HEAD_OVERLAP=101;' in p
          assert 'src.set(sx,sy+IDLE_HEAD_BODY_SPLIT,sx+260,sy+160);' in p
          assert 'src.set(sx,sy,sx+260,sy+IDLE_HEAD_OVERLAP);' in p
          assert 'float headBob=breath*s;' in p
          assert 'bodyMask=packAlpha(body);' in p and 'walkMask=packAlpha(approvedWalkColors);' in p
          assert 'if(breath==Float.POSITIVE_INFINITY)' in p # V51 walking remains
          assert 'npc_roles_v51.png' in p and 'stable_v51_body.png' in p
          assert 'void drawUniformHeadFrontOutline' not in p
          assert 'drawSpawnCamp(c)' in p and 'flameTongue(c,' in p
          print('V52 RUNTIME PASS: original V40 planted pixel data and head-only breathing, no V51 regenerated idle')
          PY
      - name: Verify all NPCs, shadows, support hand, camp, procedural map, and state machines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          v=(root/'GameView.java').read_text()
          m=(root/'MainActivity.java').read_text()
          assert 'stablePose(c,atlas' in v and 'drawUniformHeadFrontOutline' not in v
          assert 'npc_roles_v51.png' in v and 'stable_v51_body.png' in v
          assert 'ROLE_BANDIT=0' in v and 'ROLE_TRADER=8' in v
          assert 'new Bandit(x,y,i%2)' in v
          assert 'initCampStaff()' in v
          assert 'npc.animation.step(' in v and 'friend.animation.step(' in v and 'e.animation.step(' in v
          assert 'order.add(new DrawEntity(npc.y' in v
          assert 'order.sort((a,b)->Float.compare(a.y,b.y))' in v
          assert 'terrainChunks.draw(c,camX,camY,viewW,viewH)' in v and 'drawSpawnCamp(c)' in v
          assert 'flameTongue(c,' in v and 'void drawCampfire(' in v
          assert 'addCharacterShadow(f.x,f.y)' in v
          assert 'final LightingV47 lighting=new LightingV47()' in v
          assert 'clock.advance(' in v and 'final GameClockV47 clock=' in v
          assert 'void releaseControls(){stopWalking();' in v
          assert 'supportVertical=host.setting("supportY",0)' in v
          assert 'onWindowFocusChanged(boolean hasFocus)' in m
          assert 'WindowInsetsController' in m
          print('V51 INTEGRATION PASS: all NPC types use real approved role artwork, fixed head, camp, patches and V50 systems')
          PY
      - name: V54 streaming world, persistence, and no boundary regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          v=(p/'GameView.java').read_text()
          w=(p/'WorldChunkCache.java').read_text()
          m=(p/'WorldChunkModel.java').read_text()
          for clause in [
              'terrainChunks.draw(c,camX,camY,viewW,viewH);',
              'float nx=playerX+vx*speed*dt;',
              'float ny=playerY+vy*speed*dt;',
              'camX=playerX-viewW/(2*effectiveZoom)+cameraLookX;',
              'camY=playerY-viewH/(2*effectiveZoom)+cameraLookY;',
              'Float.isFinite(x)&&Float.isFinite(y)',
              'void saveProgress()',
          ]: assert clause in v,clause
          for forbidden in ['if(x<32||y<40||x>WORLD_W-32||y>WORLD_H-32)',
                  'nx<0||ny<0||nx>WORLD_W||ny>WORLD_H',
                  'float nx=clamp(playerX','float ny=clamp(playerY']:
              assert forbidden not in v,forbidden
          for required in ['Executors.newSingleThreadExecutor',
                           'Bitmap.Config.RGB_565','groundColorAt',
                           'MAX_PENDING','LinkedHashMap','fallback(canvas,cx,cy);']:
              assert required in w or required in m,required
          assert 'groundColorAt(' in m and 'float noise(' in m
          print('V54 PASS: background chunk rendering, bounded memory, seamless signed world')
          PY
      - name: V54 pure-JVM deterministic chunk regression tests
        run: |
          set -eu
          ROOT=survival-paradise/native-game
          mkdir -p /tmp/sp-v54-classes
          javac -d /tmp/sp-v54-classes \
            "$ROOT/app/src/main/java/com/survivalparadise/nativegame/BiomeWorldV74.java" \
             "$ROOT/app/src/main/java/com/survivalparadise/nativegame/WorldChunkModel.java" \
            "$ROOT/tools/V54WorldChunkTest.java"
          java -cp /tmp/sp-v54-classes com.survivalparadise.nativegame.V54WorldChunkTest
      - name: Verify original UI and live world-testing controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame")
          game=(root/"GameView.java").read_text()
          main=(root/"MainActivity.java").read_text()
          chunks=(root/"WorldChunkCache.java").read_text()
          controls=(root/"LegacyControlsV58.java").read_text()
          for original in [
            '"NEW GAME"','"CONTINUE"','"GAME SETTINGS"',
            '"RELOAD"','"SWAP"','"PAUSE"','"BAG"',
            '"LAMP ON"','"CAMP"','"FIRE"','"MOVE"',
            'void updateStick(', 'MotionEvent.ACTION_POINTER_DOWN',
            'void newGame()', 'void continueGame()', 'void switchWeapon()',
            'void saveProgress()', 'void drawWorld(Canvas c)'
          ]: assert original in game or original in controls,original
          for oldsetting in [
            '"scale"','"hand"','"support"','"supportY"','"speed"',
            '"survivors"','"gun"','"hands"','"weapons"','"anchors"',
            '"hitboxes"','"enemyAI"','"aimRotation"','"recoil"',
            '"loot"','"night"','"autoDayNight"','"dayLength"',
            '"darkness"','"beamReach"','"lampOn"','"campfiresLit"',
            '"neonLights"','"fullscreen"',
          ]: assert oldsetting in main,oldsetting
          for newsetting in [
            '"movePadSize"','"aimPadSize"','"moveSensitivity"',
            '"aimSensitivity"','"controlOpacity"','"cameraZoom"',
            '"testPerf"','"testChunkGrid"','"testCacheMax"',
            '"testPreloadRadius"'
          ]:
            assert newsetting in main and newsetting in game,newsetting
          for label in [
            'Return to original survivor camp',
            'Travel 8 chunks east', 'Travel 8 chunks west',
            'Travel 8 chunks north','Travel 8 chunks south',
            'View current FPS and chunk statistics'
          ]: assert label in main,label
          for member in ['void setLimits(', 'residentCount()','pendingCount()',
                         'residentLimit()', 'for(int radius=0;radius<=preloadRadius']:
            assert member in chunks,member
          assert 'terrainChunks.draw(c,camX,camY,viewW,viewH);' in game
          print("V54.1 PASS: legacy controls & all settings retained; test UI hooked up")
          PY
      - name: V55 visible-entity, physics and lighting source regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          g=(p/'GameView.java').read_text()
          l=(p/'LightingV47.java').read_text()
          a=(p/'MainActivity.java').read_text()
          f=(p/'WorldPerfV55.java').read_text()
          for clause in [
              'WorldPerfV55.segmentNearActor','WorldPerfV55.segmentNearRect',
              'WorldPerfV55.distantFrom','lastVisibleNpcs++',
              'lastCulledNpcs++','void drawChunkGrid(',
              'terrainChunks.draw(c,camX,camY,viewW,viewH);',
              'addCharacterShadow','PlayerMovementV77.gait(walkSpeedMultiplier,runHeld&&stamina>0)',
              'CharacterCollision.firstHit','WorldPerfV55.nearView',
          ]: assert clause in g,clause
          assert 'setPixelScale(' in l and 'screenDst.set(' in l
          assert 'npcSleepRadius' in a and 'lightResolution' in a
          assert 'WORLD_SEED' in (p/'WorldChunkModel.java').read_text()
          assert 'groundColorAt(' in (p/'WorldChunkModel.java').read_text()
          for legacy in [
            'Movement joystick size','Aiming joystick sensitivity',
            'Original' if False else 'Hand size (independent)',
            'Return to original survivor camp',
            'Automatic day / night cycle','Survivors (including player)'
          ]: assert legacy in a,legacy
          assert 'segmentNearActor' in f
          print('V55 PASS: legacy test UI retained, runtime broad phase and lighting quality installed')
          PY
      - name: V55 pure JVM broad-phase and AI regression
        run: |
          set -eu
          ROOT=survival-paradise/native-game
          mkdir -p /tmp/sp-v55-tests
          javac -d /tmp/sp-v55-tests \
            "$ROOT/app/src/main/java/com/survivalparadise/nativegame/BiomeWorldV74.java" \
             "$ROOT/app/src/main/java/com/survivalparadise/nativegame/WorldChunkModel.java" \
            "$ROOT/app/src/main/java/com/survivalparadise/nativegame/WorldPerfV55.java" \
            "$ROOT/tools/V55PerformanceTest.java"
          java -cp /tmp/sp-v55-tests com.survivalparadise.nativegame.V55PerformanceTest
      - name: V56 strict approved animation geometry, face and palette checks
        run: |
          set -euo pipefail
          ROOT=survival-paradise/native-game
          A="$ROOT/app/src/main/assets"
          mkdir -p /tmp/sp-v56-classes
          javac -d /tmp/sp-v56-classes "$ROOT/tools/V56ApprovedCharacterTest.java"
          java -Djava.awt.headless=true -cp /tmp/sp-v56-classes \
            com.survivalparadise.nativegame.V56ApprovedCharacterTest \
            "$A/approved_v44_walk_palette.png" "$A/body.png" \
            "$A/npc_walk_v56.png" "$A/npc_idle_v56.png"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          view=(root/'GameView.java').read_text()
          collision=(root/'CharacterCollision.java').read_text()
          activity=(root/'MainActivity.java').read_text()
          assert 'Bitmap atlas=npcVariant>=0?npcWalkV56:approvedWalkColors;' in view
          assert 'Bitmap idleSource=selectedIdle;' in view
          assert 'getAssets().open("npc_walk_v56.png")' in view
          assert 'c.drawBitmap(walkingAtlas,src,dest,pixel);' in view
          assert 'final float visibleX=actorX;' in collision
          assert 'walkMask=packAlpha(approvedWalkColors);' in view and 'Bitmap atlas=npcVariant>=0?npcWalkV56:approvedWalkColors;' in view
          assert 'setView(shell)' in activity
          assert 'private void resizeSettingsWindow(' in activity
          assert 'scroll.setOnScrollChangeListener' in activity
          assert 'fastScroll.setOnSeekBarChangeListener' in activity
          for key in ['testWindowWidth','testWindowHeight','"CHARACTER"','"WORLD"','"ACTIONS"']:
            assert key in activity,key
          # The known buggy reconstructed sprites must NEVER be runtime-selected.
          assert 'npcVariant>=0?npcRoleAtlas:stableBody' not in view
          assert 'npc?npcIdleAtlas:body' not in view
          print('V56 PASS: original art selected, exact walk collision, resizable accessible UI')
          PY
      - name: V58 strict interaction, art geometry, camera and settings gate
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          r=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          g=(r/'GameView.java').read_text()
          m=(r/'MainActivity.java').read_text()
          w=(r/'WorldChunkModel.java').read_text()
          cl=(r/'WorldChunkCache.java').read_text()
          for token in [
            'fireLeftPointer=pointer','firePointer=pointer',
            'firing=firePointer>=0||fireLeftPointer>=0',
            'knifeDirection=LegacyControlsV58.quantizeKnife',
            'knifeHitPending=false','drawKnifeSwing(c,s)',
            'lastVisibleNpcs++','showCrosshair','cameraLookX',
            'cameraLookY','rightPointer>=0','lookAheadThreshold',
            'drawStatusBar(c,"HP"','drawStatusBar(c,"STA"',
            'drawStatusBar(c,"HUN TEST"','drawStatusBar(c,"THR TEST"',
            'drawStatusBar(c,"FAT TEST"','drawStatusBar(c,"ENC TEST"',
            'LegacyControlsV58.COUNT','editPointer=id',
            'getAssets().open("npc_walk_v56.png")',
            'Bitmap atlas=npcVariant>=0?npcWalkV56:approvedWalkColors;',
            'Bitmap idleSource=selectedIdle;',
            'c.drawBitmap(walkingAtlas,src,dest,pixel);'
          ]: assert token in g,token
          assert 'firing=gun!=3' not in g
          assert 'c.translate(WalkAlignmentV48.sourceOffsetX(f)*s,0);' not in g
          assert 'c.translate(-23*s,-48*s);' not in g
          for token in ['LegacyControlsV58.NAMES','"selectedButton"',
                        '"editControls"','"uiEnabled"+control',
                        '"uiSize"+control','"uiAlpha"+control',
                        '"uiX"+control','"uiY"+control','"showStatusBars"',
                        '"showCrosshair"','"lookAheadEnabled"',
                        '"lookAheadThreshold"','"lookAheadStrength"',
                        'leftRail.setOnTouchListener(railScroll)',
                        'fastScroll.setOnSeekBarChangeListener']:
            assert token in m,token
          assert 'groundColorAt(' in w and 'float noise(' in w
          assert 'Executors.newSingleThreadExecutor' in cl
          print('V58 PASS: independent 4 buttons, eight-way knife, status bars, zoom, crosshair, lookahead, sprite lock')
          PY
      - name: V58 JVM independent button and melee sector regression
        run: |
          set -eu
          ROOT=survival-paradise/native-game
          mkdir -p /tmp/sp-v58-tests
          javac -d /tmp/sp-v58-tests \
            "$ROOT/app/src/main/java/com/survivalparadise/nativegame/LegacyControlsV58.java" \
            "$ROOT/tools/V58LegacyControlsTest.java"
          java -cp /tmp/sp-v58-tests com.survivalparadise.nativegame.V58LegacyControlsTest
      - name: V59 immutable face compositor pixel tests and GIF proof
        run: |
          python3 survival-paradise/native-game/tools/v59_verify_locked_compositor.py
      - name: V71 original joystick travel and no acceleration regression
        run: |
          set -euo pipefail
          P=survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame
          mkdir -p /tmp/sp-v71-tests
          javac -d /tmp/sp-v71-tests \
            "$P/ClassicAimV71.java" "$P/BoundedCameraV69.java" \
            "$P/Ballistics.java" "$P/RadialAimV65.java" \
            "$P/AnimationCycle.java" \
            "survival-paradise/native-game/tools/V71ClassicAimTest.java" \
            "survival-paradise/native-game/tools/V69BoundedCameraTest.java" \
            "survival-paradise/native-game/tools/V67BallisticAimTest.java" \
            "survival-paradise/native-game/tools/V66ReachGaitTest.java"
          java -cp /tmp/sp-v71-tests com.survivalparadise.nativegame.V71ClassicAimTest
          java -cp /tmp/sp-v71-tests com.survivalparadise.nativegame.V69BoundedCameraTest
          java -cp /tmp/sp-v71-tests com.survivalparadise.nativegame.V67BallisticAimTest
          java -cp /tmp/sp-v71-tests com.survivalparadise.nativegame.V66ReachGaitTest
          python3 - <<'PY'
          from pathlib import Path
          p=Path("survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame")
          g=(p/"GameView.java").read_text()
          m=(p/"MainActivity.java").read_text()
          checks=[
            'ClassicAimV71.heading(dx,heading,aimX)',
            'ClassicAimV71.heading(dy,heading,aimY)',
            'ClassicAimV71.distance(rest,maxAim,aimDeflection)',
            'aimStickX=dx;aimStickY=dy;',
            'rx+aimStickX*59*aimPadScale',
            'ry+aimStickY*59*aimPadScale',
            'aimStickX=0f;aimStickY=0f;',
            'aimStickX=0;aimStickY=0;',
            'lookAheadEnabled=host.option("classicAimCameraV71",true)',
            'WeaponCameraV72.distance(gun,Math.round(cameraPanLimit),',
            'ClassicAimV71.panFactor(aimDeflection,lookAheadThreshold)',
            'cursorWorldX=playerX+aimX*aimCursorDistance;',
            'Ballistics.unobstructedTravel(gun)+muzzleOffset',
            'drawHotbar(c);',
            'new V62InventoryPreview' if False else 'drawBrightCrosshair(canvas);',
            'PlayerMovementV77.gait(walkSpeedMultiplier,runHeld&&stamina>0)*',
            'final int split=110',
            'Bitmap locked=selectedIdle;',
            'postInvalidateOnAnimation();',
          ]
          for token in checks: assert token in g,token
          assert 'AimZonesV70.reach(aimCursorDistance' not in g
          assert 'StableAimV68.angularStep(aimX,aimY,targetAimX' not in g
          assert 'RadialAimV65.distance(aimCursorDistance,gun,maxAim' not in g
          assert 'cursorSpeed*dt' not in g
          for token in (
            'CLASSIC V61 AIM RESTORED',
            'check(root,"Circular camera look-ahead (ON by default)","classicAimCameraV71",true)',
            'slider(root,"Released crosshair distance (weapon-relative)"',
            'slider(root,"Aiming joystick sensitivity"',
            'new V62InventoryPreview(this,game)',
            'closeBag.setOnClickListener(v->dialog.dismiss())'
          ):assert token in m,token
          for removed in (
            'V70 AIM ZONES',
