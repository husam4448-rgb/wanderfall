name: Wanderfall v0.17 Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.ci/trigger-android-build'

permissions:
  contents: read

env:
  SOURCE_SHA256: ae4eff17e5f281f5867ac2d82207fcf96e6c8b649432acd48816aebab76fa308
  SOURCE_ARCHIVE: /tmp/Wanderfall_Phase16_Game_Source.tar.xz
  PROJECT_DIR: game
  GODOT_ZIP: /tmp/Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_BIN: /tmp/Godot_v4.7.2-stable_linux.x86_64
  GODOT_TEMPLATES_TPZ: /tmp/Godot_v4.7.2-stable_export_templates.tpz
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
  APK_PATH: Wanderfall-v0.17.0-debug.apk
  MAX_APK_BYTES: '419430400'

jobs:
  build_android:
    name: Export and validate Wanderfall v0.17 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Reconstruct exact Phase 16 source
        shell: bash
        run: |
          set -euo pipefail
          test -f source_parts/SOURCE_BUNDLE_INFO.txt
          test "$(find source_parts -maxdepth 1 -name 'part_*.b64' -type f | wc -l)" -eq 9
          cat source_parts/part_*.b64 > /tmp/wanderfall_source.b64
          base64 --decode /tmp/wanderfall_source.b64 > "$SOURCE_ARCHIVE"
          echo "$SOURCE_SHA256  $SOURCE_ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT_DIR"
          tar -xJf "$SOURCE_ARCHIVE" -C "$PROJECT_DIR"
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"
          test -f "$PROJECT_DIR/scenes/main.tscn"
          test -f "$PROJECT_DIR/tools/preflight.py"
          echo "Reconstructed files: $(find "$PROJECT_DIR" -type f | wc -l)"

      - name: Apply Godot 4.7 compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/apply_godot_47_fixes.py "$PROJECT_DIR"

      - name: Apply Wanderfall v0.17 UI/menu overhaul
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/apply_v017_ui_overhaul.py "$PROJECT_DIR"

      - name: Static structural preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/preflight.py" "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK required by Godot 4.7
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$ANDROID_SDK"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

          test -x "$ANDROID_SDK/platform-tools/adb"
          test -x "$ANDROID_SDK/build-tools/35.0.1/apksigner"
          test -x "$ANDROID_SDK/build-tools/35.0.1/aapt"
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_SDK"

      - name: Download verified Godot 4.7.2 editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$GODOT_ZIP" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $GODOT_ZIP" | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp
          test -x "$GODOT_BIN"
          "$GODOT_BIN" --version

          curl -fL --retry 3 --retry-delay 2 \
            -o "$GODOT_TEMPLATES_TPZ" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "$GODOT_TEMPLATES_SHA256  $GODOT_TEMPLATES_TPZ" | sha256sum -c -

          rm -rf /tmp/godot_export_templates
          mkdir -p /tmp/godot_export_templates
          unzip -q "$GODOT_TEMPLATES_TPZ" -d /tmp/godot_export_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot_export_templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"
          ls -lh "$TEMPLATE_DIR/android_debug.apk" "$TEMPLATE_DIR/android_release.apk"

      - name: Reconfirm parser-clean source in build environment
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --quit --verbose 2>&1 | tee godot-build-parser.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Failed to create an autoload|Compile Error:|Parse Error:' godot-build-parser.log; then
            echo '::error::Godot reported parser or compile errors before Android export.'
            exit 1
          fi

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$APK_PATH"
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-debug Android "$GITHUB_WORKSPACE/$APK_PATH" 2>&1 | tee android-export.log
          test -s "$APK_PATH"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to export project|Export failed' android-export.log; then
            echo '::error::Godot reported an export failure.'
            exit 1
          fi

      - name: Validate APK structure, identity, signature and size
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/$APK_PATH"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.1/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"

          test -s "$APK"
          unzip -t "$APK" > apk-zip-test.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$AAPT" dump badging "$APK" | tee apk-badging.txt

          grep -q "package: name='org.wanderfall.game'" apk-badging.txt
          grep -q "versionCode='17'" apk-badging.txt
          grep -q "versionName='0.17.0'" apk-badging.txt
          grep -q "application-label:'Wanderfall'" apk-badging.txt

          APK_BYTES="$(stat -c%s "$APK")"
          echo "APK bytes: $APK_BYTES"
          if [ "$APK_BYTES" -ge "$MAX_APK_BYTES" ]; then
            echo "::error::APK exceeds the 400 MiB project target."
            exit 1
          fi

          sha256sum "$APK" | tee Wanderfall-v0.17.0-debug.apk.sha256
          ls -lh "$APK"

      - name: Upload validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wanderfall-Android-v0.17.0-debug
          path: |
            Wanderfall-v0.17.0-debug.apk
            Wanderfall-v0.17.0-debug.apk.sha256
            android-export.log
            godot-build-parser.log
            apk-signature.txt
            apk-badging.txt
            apk-zip-test.txt
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Wanderfall-v0.17-Android-Build-Diagnostics
          path: |
            android-export.log
            godot-build-parser.log
          retention-days: 7
          if-no-files-found: ignore
