          SUM=artifacts/SHA256.txt
          test -s "$APK" && test -s "$SUM"
          NOTE="V139 experimental run-gait preview: the original four walk poses accelerate gradually to 1.8x playback speed when RUN is held, then decelerate smoothly. Movement speed/stamina behavior, approved artwork, invisible headgear policy, NPCs and saves remain unchanged. This preview does NOT include the pending twenty-style torso/pants image pack. Installed V138 remains untouched thanks to a different test package ID."
