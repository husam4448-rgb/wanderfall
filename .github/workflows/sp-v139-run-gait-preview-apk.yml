      - name: V137 pixel exact approved 16px centered underbody
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          import numpy as np
          from PIL import Image
          asset=Path("survival-paradise/native-game/app/src/main/assets/sp_v109_characters.zip")
          assert asset.is_file()
          with ZipFile(asset) as z:
              image=Image.open(BytesIO(z.read("body_walk.png"))).convert("RGBA")
          src=np.asarray(image.crop((200,0,400,260))).copy()
          assert src.shape==(260,200,4)
          assert np.all(src[220:240,60:120]==[0,0,0,255])
          assert not src[220:240,120:140,3].any()
          altered=src.copy()
          altered[220:240,60:140]=[0,0,0,0]
          altered[220:236,60:140]=[0,0,0,255]
          assert np.all(altered[220:236,60:140]==[0,0,0,255])
          assert not altered[236:240,60:140,3].any()
          # No pixel outside the bottom contour can change, even before coloring.
          mask=np.ones((260,200),bool)
          mask[220:240,60:140]=False
          assert np.array_equal(src[mask],altered[mask])
          changed=np.any(src!=altered,axis=2)
          assert int(changed.sum())==560
          print("PASS V137: 80x16 centered underside, matching the blue-band width and leaving all other outline pixels locked")
          PY
