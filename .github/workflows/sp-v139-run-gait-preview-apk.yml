name: Survival Paradise V139 - Run Gait Preview
on:
  push:
    branches: [sp-native-v139-outfits-run-gait-20261114]
    paths:
      - 'survival-paradise/native-game/**'
      - '.github/workflows/sp-v139-run-gait-preview-apk.yml'
  workflow_dispatch:

concurrency:
  group: survival-paradise-v139-run-gait-preview
  cancel-in-progress: true

jobs:
  verify-native-character-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
            assets/authored2d
            assets/world
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate the exact locked V31/V56 source art
        run: |
          set -euo pipefail
          python3 -m pip install --user -q Pillow numpy
          python3 survival-paradise/native-game/tools/extract_locked_atlases.py
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          r=Path("survival-paradise/native-game")
          for encoded,dest,sha in [
             ("approved_v29_axe.png.b64","approved_v29_axe.png","f0d146757318e620024cae0c2a34243bdd9339a939a7f51e5428ae8250620dee"),
             ("approved_v44_walk_palette.png.b64","approved_v44_walk_palette.png","fd01230e9c13ffd3087e933abe976a2179d80e9adc9b0710f899a7bef7fc3d71")
          ]:
              data=base64.b64decode((r/"tools"/encoded).read_text().strip(),validate=True)
              assert hashlib.sha256(data).hexdigest()==sha,encoded
              (r/"app/src/main/assets"/dest).write_bytes(data)
          PY
          python3 survival-paradise/native-game/tools/build_v51_assets.py
          python3 survival-paradise/native-game/tools/build_v52_idle.py
          python3 survival-paradise/native-game/tools/fix_v53_skin_palette.py
          python3 survival-paradise/native-game/tools/build_v56_approved_character_atlases.py
          python3 survival-paradise/native-game/tools/build_v74_biome_assets.py
          test "$(sha256sum survival-paradise/native-game/app/src/main/assets/body.png | cut -d' ' -f1)" = "141878713a6880d05879b7102c728581dddb55730434bcac8e050fe44b3d82ad"
      - name: Verify V122 approved art and isolated APK package identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("survival-paradise/native-game")
          source=(root/"app/src/main/java/com/survivalparadise/nativegame/CharacterSkinsV109.java").read_text()
          gradle=(root/"app/build.gradle").read_text()
          assert "versionCode 139" in gradle
          assert "applicationId 'com.survivalparadise.nativegame.v139rungaittest'" in gradle
          assert "sp_v109_characters.zip" in source
          assert "CharacterAnimationV110.breathOffset" in source
          assert "CharacterAnimationV110.bodyFrame" in source
          assert "new Fit(base)" in source
          assert "boolean walking" in source
          print("V122 immutable 200 original characters/V5 fitting + isolated test APK: PASS")
          PY
      - name: Test V122 all original regressions, NPC 360-degree aiming and gunfire geometry (pure JVM)
        run: |
          set -e
          R=survival-paradise/native-game
          mkdir -p /tmp/sp-v112-jvm
          javac -d /tmp/sp-v112-jvm "$R/app/src/main/java/com/survivalparadise/nativegame/AnimationCycle.java" "$R/tools/AnimationCycleTest.java" "$R/app/src/main/java/com/survivalparadise/nativegame/CharacterAnimationV110.java" "$R/tools/CharacterAnimationV110Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/Ballistics.java" "$R/app/src/main/java/com/survivalparadise/nativegame/HeadAimV111.java" "$R/tools/HeadAimV111Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/HeadFitOffsetsV112.java" "$R/tools/HeadFitOffsetsV112Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/CharacterScopeV113.java" "$R/tools/CharacterScopeV113Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/TorsoWidthV114.java" "$R/tools/TorsoWidthV114Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/PelvisWidthV115.java" "$R/tools/PelvisWidthV115Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/PelvisLegRigV116.java" "$R/tools/PelvisLegRigV116Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/WeaponPivotV117.java" "$R/tools/WeaponPivotV117Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/FollowFormationV61.java" "$R/app/src/main/java/com/survivalparadise/nativegame/CompanionOrdersV118.java" "$R/app/src/main/java/com/survivalparadise/nativegame/GunEffectsV118.java" "$R/tools/V118RegressionTest.java" "$R/app/src/main/java/com/survivalparadise/nativegame/HudDragV119.java" "$R/app/src/main/java/com/survivalparadise/nativegame/GunEffectsV119.java" "$R/tools/V119RegressionTest.java" "$R/app/src/main/java/com/survivalparadise/nativegame/BodyAlignmentV120.java" "$R/tools/BodyAlignmentV120Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/LegacyControlsV58.java" "$R/app/src/main/java/com/survivalparadise/nativegame/TopHudV76.java" "$R/app/src/main/java/com/survivalparadise/nativegame/WorldUiV86.java" "$R/app/src/main/java/com/survivalparadise/nativegame/ScreenshotDefaultsV121.java" "$R/tools/ScreenshotDefaultsV121Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/NpcAimV122.java" "$R/app/src/main/java/com/survivalparadise/nativegame/NpcGunfireV122.java" "$R/tools/NpcAimV122Test.java"
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.AnimationCycleTest
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.CharacterAnimationV110Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.HeadAimV111Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.HeadFitOffsetsV112Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.CharacterScopeV113Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.TorsoWidthV114Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.PelvisWidthV115Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.PelvisLegRigV116Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.WeaponPivotV117Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.V118RegressionTest
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.V119RegressionTest
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.BodyAlignmentV120Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.ScreenshotDefaultsV121Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.NpcAimV122Test
      - name: Test V126 traced source-alpha roof contours, world-scale props, safe camp and old V124 roads
        run: |
          set -euo pipefail
