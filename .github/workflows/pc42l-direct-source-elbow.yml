name: PC42L Direct Source Elbow Five-Angle Godot QA
on:
  push:
    branches: [pc42l-direct-local-production]
    paths:
      - '.github/workflows/pc42l-direct-source-elbow.yml'
      - 'pc42-static-prototype/Main.gd'
      - 'tools/qa_pc42l_direct_source_arm.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
env:
  SP_PHASE: PC42L_NATIVE_ELBOW_ART
  GODOT_BIN: /tmp/Godot_v4.7.2-stable_linux.x86_64
jobs:
  direct-art-rifle-elbow-test:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Report source test started
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_ci_monitor.py emit STARTED "PC42L source-only elbow ownership: run actual PC42H-vs-PC42L five-angle and 32-frame Godot; NO APK/no visual approval." || true
      - name: Generate approved original male RIGHT source-part textures
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy opencv-python-headless
          python3 -m py_compile tools/qa_pc42l_direct_source_arm.py
          python3 tools/pc42_reference_cutout.py
          python3 tools/pc42h_articulated_arm_atlas.py
          test -s pc42-static-prototype/assets/pc42h_far_elbow.png
          test -s pc42-static-prototype/assets/pc42h_far_forearm.png
          echo "PC42L_SOURCE_READY original-pixel artwork, no new generation"
      - name: Report source prepared
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_ci_monitor.py emit SOURCE_READY "Original approved source layers reconstructed; elbow upper-bone opt-in changes owner only; rifle IK and original textures unchanged." || true
      - name: Install pinned Godot and virtual display
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
      - name: Actual Godot compile
        run: |
          "$GODOT_BIN" --headless --editor --path pc42-static-prototype --quit >pc42l-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' pc42l-import.log; then cat pc42l-import.log; exit 1; fi
      - name: Report real compilation
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_ci_monitor.py emit GODOT_COMPILED "Real Godot 4.7.2 compiled. Original PC42H baseline and opt-in original-art PC42L 32-frame capture next." || true
      - name: Render PC42H baseline and PC42L upper-bone cuff owner
        run: |
          set -euo pipefail
          mkdir -p pc42-static-prototype/evidence
          PC42C_CAPTURE=1 timeout 160s xvfb-run -a "$GODOT_BIN" --path pc42-static-prototype --resolution 1580x660 >pc42l-baseline.log 2>&1
          grep -q 'PC42C_REAL_IK_CONTACT_SWEEP_OK' pc42l-baseline.log
          for a in m10 m05 p00 p05 p10; do
            cp "pc42-static-prototype/evidence/pc42c_pose_$a.png" "pc42-static-prototype/evidence/pc42l_original_$a.png"
          done
          PC42L_DIRECT_SOURCE_ARM=1 PC42C_CAPTURE=1 timeout 160s xvfb-run -a "$GODOT_BIN" --path pc42-static-prototype --resolution 1580x660 >pc42l-candidate-motion.log 2>&1
          grep -q 'PC42L_DIRECT_SOURCE_ARM_READY' pc42l-candidate-motion.log
          grep -q 'PC42C_REAL_IK_CONTACT_SWEEP_OK' pc42l-candidate-motion.log
          grep -q 'PC42D_FAR_ARM_TWO_BONE_IK_OK' pc42l-candidate-motion.log
          python3 tools/qa_pc42l_direct_source_arm.py
      - name: Report rendered evidence, visual approval pending
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_ci_monitor.py emit VISUAL_QA_PENDING "PC42L actual five-angle Godot A/B and 32-frame GIF generated. Inspect elbow; technical checks never imply art acceptance." || true
      - name: Preserve images, GIF and error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP-PC42L-OriginalSource-Elbow-${{ github.sha }}
          path: |
            pc42-static-prototype/evidence/
            pc42l-*.log
          retention-days: 14
      - name: Final status
        if: always()
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            python3 tools/sp_ci_monitor.py emit COMPLETED "PC42L experimental native art Godot evidence complete; visually UNAPPROVED until actual image inspection; no APK." || true
          else
            python3 tools/sp_ci_monitor.py emit FAILED "PC42L source-art / Godot QA workflow failed. Inspect logs and artifact; no approved art or APK." || true
          fi
