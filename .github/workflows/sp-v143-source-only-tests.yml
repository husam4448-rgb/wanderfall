name: Survival Paradise V143 - Source-Only Tests (NO APK)
on:
  push:
    branches: [sp-native-v143-indoor-pan-trading-nuts-weapon-variety-20261115]
    paths:
      - '.github/workflows/sp-v143-source-only-tests.yml'
      - 'survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/**'
      - 'survival-paradise/native-game/tools/V143EconomyWeaponTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: No-APK V143 exact currency, trade, NPC loot and caliber tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=survival-paradise/native-game
          C="$ROOT/app/src/main/java/com/survivalparadise/nativegame"
          mkdir -p /tmp/v143-javac
          javac -d /tmp/v143-javac \
            "$C/OutfitInventoryV140.java" \
            "$C/AmmoInventoryV143.java" \
            "$C/NutWalletV143.java" \
            "$C/NpcTradeLedgerV143.java" \
            "$C/TradeQuantityV143.java" \
            "$C/NpcGearV143.java" \
            "$C/UnifiedBagSlotsV141.java" \
            "$C/BanditLootV87.java" \
            "$C/DroppedItemsV129.java" \
            "$ROOT/tools/V143EconomyWeaponTest.java" \
            "$ROOT/tools/V141CorpseInventoryTest.java"
          java -cp /tmp/v143-javac com.survivalparadise.nativegame.V143EconomyWeaponTest
          java -cp /tmp/v143-javac com.survivalparadise.nativegame.V141CorpseInventoryTest
      - name: Source-level integration safeguards - no game package assembled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          g=(c/'GameView.java').read_text()
          ui=(c/'MainActivity.java').read_text()
          loot=(c/'BanditLootV87.java').read_text()
          clinic=(c/'ClinicActorsV90.java').read_text()
          for needle in (
              'updateIndoorCameraPanV143(dt)',
              'indoorCameraPanV142?cameraLookX:0f',
              'indoorCameraPanV142?cameraLookY:0f',
              'if(id==TOP_PAUSE_EDITOR)return TopHudV76.Y',
              'playerNutsV143.encode()',
              'npcTradesV143.encode()',
              'playerAmmoV143.encode()',
              'tradeV143(String npcId',
              'shoot(e.x,e.y,e.aimX,e.aimY,e.gun,true',
              'character(c,e.x,e.y,e.gun',
              'remains.ammoExtraV143',
              'remains.nutsV143',
              'lootBanditV87',
          ):
              if needle=='lootBanditV87':continue
              assert needle in g,needle
          assert 'V143' in clinic or 'NpcGearV143' in clinic
          for needle in ('npcTradeWindowV143','"BUY SELECTED"','"SELL SELECTED"',
                         'GameView.CORPSE_NUT_KIND_V143',
                         'AmmoInventoryV143.valid(type)',
                         'selectedQuantity[0]', 'TradeQuantityV143.buyMaximum'):
              assert needle in ui,needle
          assert 'takeNutsV143' in loot and 'takeAmmoV143' in loot
          assert 'wearableArtV96.drawHead(' not in g
          print('PASS V143 integration contract; no APK generated')
          PY
