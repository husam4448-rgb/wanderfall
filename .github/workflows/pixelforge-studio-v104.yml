name: Pixel Forge Studio v1.0.4 — Python + Android
on:
  push:
    branches:
      - pixelforge-studio-unified-v104-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pixelforge_studio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless dependencies
        run: python -m pip install -r pixelforge_studio/headless/requirements.txt
      - name: Validate production engine
        working-directory: pixelforge_studio/headless
        run: python -m unittest discover -s tests -v
      - name: Verify example editable asset export
        working-directory: pixelforge_studio/headless
        run: |
          python -m pixelforge_pipeline demo /tmp/pixelforge-demo
          test -f /tmp/pixelforge-demo/spritesheets/SP_walk_right.png
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pixelforge_studio/android/v1.0.4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)
          if [ -z "$SDKM" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q /tmp/android-tools.zip -d /tmp/android-setup
            mv /tmp/android-setup/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable Android editor APK
        working-directory: pixelforge_studio/android/v1.0.4
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature
        run: |
          APK=pixelforge_studio/android/v1.0.4/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "name='com.survivalparadise.pixelforge.v104'"
          unzip -p "$APK" assets/index.html | grep -q "PF104_BRUSH_SHAPES"
      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-v1.0.4-Unified-APK
          path: pixelforge_studio/android/v1.0.4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
