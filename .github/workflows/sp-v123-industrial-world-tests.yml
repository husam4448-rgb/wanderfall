name: V123 Industrial World Seed and Geometry Tests
on:
  push:
    branches: [sp-native-v123-industrial-world-experiment-20261106]
    paths:
      - 'survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/IndustrialWorldV123.java'
      - 'survival-paradise/native-game/tools/IndustrialWorldV123Test.java'
      - '.github/workflows/sp-v123-industrial-world-tests.yml'
  workflow_dispatch:
jobs:
  seeded-industrial-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate deterministic industrial biome and save isolation
        run: |
          R=survival-paradise/native-game
          mkdir -p /tmp/sp-v123-test
          javac -d /tmp/sp-v123-test "$R/app/src/main/java/com/survivalparadise/nativegame/IndustrialWorldV123.java" "$R/tools/IndustrialWorldV123Test.java"
          java -cp /tmp/sp-v123-test com.survivalparadise.nativegame.IndustrialWorldV123Test
