name: Survival Paradise V84 — Publish direct APK
on:
  push:
    branches: [sp-native-v84-scrap-placement-icons-20261101]
    paths: ['.github/workflows/sp-v84-direct-apk-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release-v84:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download complete verified V84 Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/spv84
          gh run download 41259428825 -R "$GITHUB_REPOSITORY" \
            -n SP_V84_ScrapPlaceIcons -D /tmp/spv84
          APK=/tmp/spv84/SurvivalParadise_V84_ScrapPlaceIcons.apk
          SOURCE=/tmp/spv84/SurvivalParadise_V84_Source.zip
          test -s "$APK"
          test -s "$SOURCE"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          for a in body.png approved_v44_walk_palette.png npc_idle_v56.png approved_v29_axe.png gear.png world_props_v74.png; do
            unzip -l "$APK" | grep -q "assets/$a"
          done
          sha256sum "$APK" > /tmp/spv84/V84_APK_SHA256.txt
          cat /tmp/spv84/V84_APK_SHA256.txt
      - name: Publish installable V84 direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=survival-paradise-v84-scrap-placement-icons
          APK=/tmp/spv84/SurvivalParadise_V84_ScrapPlaceIcons.apk
          SOURCE=/tmp/spv84/SurvivalParadise_V84_Source.zip
          HASH=/tmp/spv84/V84_APK_SHA256.txt
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SOURCE" "$HASH" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SOURCE" "$HASH" \
              -R "$GITHUB_REPOSITORY" \
              --target 3e75abcae3a1ce1fe0ba704653c96847d8af16c0 \
              --title "Survival Paradise V84 — Scrap, Portable Camps, Item Icons and Knife Cut" \
              --notes "Native Android test build from successful 42-step CI: 3e75abcae3a1ce1fe0ba704653c96847d8af16c0. Crafting barricades and light posts now adds stored inventory items, not immediate world objects. Tap crafted BAG item or assign quickbar, choose a world location with drag-and-release; consume one on valid placement only, use BAG to cancel, save/continue preserves stored and placed objects. Added chunky pixel inventory/quickbar icons. New deterministic rusted cars, junk heaps and barrels provide SCRAP through the three/four-hit crowbar salvage animation, with saved depletion and no instant rewards. Replaced V83 knife laser/bar effect with a pointed, curved double-layer cut tangent to the blade's travel path. Approved original character pixels, existing movement/camera, V81 animations and light system preserved. On-phone visuals and FPS still require acceptance." \
              --prerelease
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" \
            --json url,assets --jq '{url:.url,assets:[.assets[]|{name:.name,url:.url}]}'
