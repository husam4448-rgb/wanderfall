name: PC42B Real Bone2D First Pose Diagnostic
on:
  push:
    branches: [pc42b-skeleton2d-rest-equivalence]
    paths: ['.github/workflows/pc42b-bones.yml', 'pc42-static-prototype/**', 'tools/qa_pc42b_bone_tree.py']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
env:
  SP_PHASE: PC42B
  GODOT_BIN: /tmp/Godot_v4.7.2-stable_linux.x86_64
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Report started
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_live_ci.py STARTED "PC42B first real Skeleton2D/Bone2D anatomical source-art rest comparison"
      - name: Prepare source layers
        run: |
          python3 -m pip install --quiet pillow numpy opencv-python-headless
          python3 tools/pc42_reference_cutout.py
      - name: Install Godot runtime
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
      - name: Validate real Godot bones
        run: |
          "$GODOT_BIN" --headless --editor --path pc42-static-prototype --quit >pc42b-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' pc42b-import.log; then cat pc42b-import.log; exit 1; fi
      - name: Capture actual rest and small pose stress
        run: |
          mkdir -p pc42-static-prototype/evidence
          timeout 90s xvfb-run -a "$GODOT_BIN" --path pc42-static-prototype --resolution 1580x660 >pc42b-rest.log 2>&1
          PC42B_POSE_STRESS=1 timeout 90s xvfb-run -a "$GODOT_BIN" --path pc42-static-prototype --resolution 1580x660 >pc42b-stress.log 2>&1
          grep -q 'PC42B_SKELETON2D_BUILT' pc42b-rest.log
          grep -q 'PC42B_ROTATION_STRESS_DIAGNOSTIC' pc42b-stress.log
          python3 tools/qa_pc42_static_reference.py
          python3 tools/qa_pc42b_bone_tree.py
      - name: Evidence status
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_live_ci.py VISUAL_EVIDENCE_READY "PC42B real Bone2D source art rest and diagnostic small pose captures ready; motion remains unapproved"
      - name: Preserve images and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalParadise-PC42B-BoneFirstGate-${{ github.sha }}
          path: |
            pc42-static-prototype/evidence/
            pc42-static-prototype/assets/
            pc42b-*.log
      - name: Terminal independent status
        if: always()
        env:
          GH_STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sp_live_ci.py "${{ job.status == 'success' && 'COMPLETED' || 'FAILED' }}" "Bone2D first static/rest-stress test done, human motion review required; no APK"
