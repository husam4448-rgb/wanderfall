name: Survival Paradise V161 - Source and Android Java QA
on:
  push:
    branches: [sp-native-v161-v160-feedback-fixes-20261117]
    paths:
      - '.github/workflows/sp-v161-source-android-qa.yml'
      - 'survival-paradise/native-game/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Regression test seeded interiors and world saves
        shell: bash
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          P="$R/app/src/main/java/com/survivalparadise/nativegame"
          mkdir -p /tmp/v161-java
          javac -sourcepath "$P" -d /tmp/v161-java \
            "$R/tools/V161NeighborhoodInteriorTest.java" \
            "$R/tools/V160SeededGeographyTest.java" \
            "$R/tools/V159WorldPlanTest.java" \
            "$R/tools/NeighborhoodV154Test.java"
          for test in V161NeighborhoodInteriorTest V160SeededGeographyTest \
                      V159WorldPlanTest NeighborhoodV154Test; do
            java -Xmx512m -cp /tmp/v161-java \
              com.survivalparadise.nativegame."$test"
          done
      - name: Verify world UI fixes and approved head-only constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          game=(p/'GameView.java').read_text()
          menu=(p/'MainActivity.java').read_text()
          assert 'NeighborhoodInteriorV161.siteId' in game
          assert 'NeighborhoodInteriorV161.saveKey' in game
          assert 'NeighborhoodInteriorArtV161.furniture' in game
          assert 'NeighborhoodInteriorArtV161.floor' in game
          assert 'salvageOnIndustrialRoadV161(x,y)' in game
          assert 'terrainChunks.draw(c,camX,camY,viewW,viewH,renderZoomV90)' in game
          assert 'bagItemStatsV161' in menu
          assert 'lootIconV134(kind)' in menu
          assert 'int footerDp=dp118(33);' in menu
          assert 'if(index==1)return;' in game
          assert (p/'NeighborhoodInteriorV161.java').exists()
          print('PASS V161: interactions, interior art, compact item stats, road safety, and headgear ban')
          PY
      - name: Install Android 35 SDK for source-only Java compilation
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile the Android app without packaging an APK
        working-directory: survival-paradise/native-game
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugJavaWithJavac
