name: Survival Paradise V162 - Real Item Stats and Road Junctions Standalone APK
on:
  push:
    branches: [sp-native-v162-item-stats-road-inventory-20261117]
    paths:
      - '.github/workflows/sp-v162-real-stats-roads-test-apk.yml'
      - 'survival-paradise/native-game/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
            assets/authored2d
            assets/world
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore exact 200 approved characters and all legacy runtime atlases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user -q Pillow numpy
          python3 survival-paradise/native-game/tools/restore_runtime_assets_v157.py
      - name: Test 8 seeds, realistic climate, saved maps and old geometry
        shell: bash
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          P="$R/app/src/main/java/com/survivalparadise/nativegame"
          mkdir -p /tmp/v162-java
          javac -sourcepath "$R/app/src/main/java" -d /tmp/v162-java \
            "$P/Ballistics.java" \
            "$P/ClinicInteriorV89.java" \
            "$P/ExpeditionSitesV88.java" \
            "$P/ExteriorFootprintV130.java" \
            "$P/NeighborhoodV154.java" \
            "$P/IndustrialWorldV123.java" \
            "$P/IndustrialOpenWorldV124.java" \
            "$P/IndustrialComplexV155.java" \
            "$P/IndustrialFacadeShapeV126.java" \
            "$P/IndustrialPropLayoutV126.java" \
            "$P/IndustrialBiomeBridgeV128.java" \
            "$P/WorldChunkModel.java" \
            "$P/BiomeWorldV74.java" \
            "$P/ResourceWorldV80.java" \
            "$P/WorldCivilizationV159.java" \
            "$P/IndustrialPerimeterV159.java" \
            "$P/WorldGeographyV160.java" \
            "$R/tools/V161NeighborhoodInteriorTest.java" \
            "$R/tools/GearStatsV162Test.java" \
            "$R/tools/V160SeededGeographyTest.java" \
            "$R/tools/V159WorldPlanTest.java" \
            "$R/tools/ExteriorFootprintV130Test.java" \
            "$R/tools/NeighborhoodV154Test.java"
          for test in GearStatsV162Test V161NeighborhoodInteriorTest V160SeededGeographyTest V159WorldPlanTest \
                      ExteriorFootprintV130Test NeighborhoodV154Test; do
            java -Xmx512m -cp /tmp/v162-java com.survivalparadise.nativegame."$test"
          done
      - name: Verify full game generation, harvesting, texture seed and no headgear visuals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('survival-paradise/native-game')
          p=root/'app/src/main/java/com/survivalparadise/nativegame'
          g=(p/'GameView.java').read_text()
          m=(p/'MainActivity.java').read_text()
          c=(p/'WorldChunkCache.java').read_text()
          r=(p/'ResourceWorldV80.java').read_text()
          land=(p/'WorldGeographyV160.java').read_text()
          assert 'geographyV160=WorldGeographyV160.decode(' in g
          assert 'world_geography_v160' in g
          assert 'resetTerrainCacheV160(geographyV160)' in g
          assert 'WorldChunkCache((int)CAMP_X,(int)CAMP_Y,next)' in g
          assert 'NaturalGroundArtV157.draw(c,camX,camY,viewW,viewH,geographyV160,renderZoomV90<.70f)' in g
          assert 'ResourceWorldV80.seed(cx,cy,k,geographyV160)' in g
          assert g.count('WORLD_W,WORLD_H,geographyV160);')==2
          assert 'WorldGeographyV160.prepare(' in m
          assert 'WorldCivilizationV159.generate(' in m
          assert 'game.completeNewGameV159(layout,geography)' in m
          assert 'geography.colorAt(worldX,worldY)' in c
          assert 'geography.prop(x,y,h)' in r
          assert 'geography==null?BiomeWorldV74.prop(x,y,h)' in r
          assert 'NeighborhoodInteriorV161.siteId' in g
          assert 'GearStatsV162.damageAfterArmor(amount,equipmentBonusesV162())' in g
          assert 'GearStatsV162.movementFactor(equipmentBonusesV162())' in g
          assert 'equipmentBonusesV162().regenHpPerSecond*dt' in g
          assert 'ItemDetailsV162.describe(game,type,quantity)' in m
          assert 'refreshQuickV162[0]' in m
          assert 'int footerDp=dp118(26);' in m
          assert 'canvas.translate(w*.57f,h*.76f)' in (p/'V62InventoryPreview.java').read_text()
          assert 'for(float xx:vertical)for(float yy:horizontal)' in (p/'NeighborhoodArtV154.java').read_text()
          assert 'NeighborhoodInteriorArtV161.furniture' in g
          assert 'salvageOnIndustrialRoadV161(x,y)' in g
          assert 'bagItemStatsV162' in m
          assert 'lootIconV134(kind)' in m
          assert 'if(index==1)return;' in g
          assert (p/'GearStatsV162.java').exists()
          assert (p/'ItemDetailsV162.java').exists()
          assert "applicationId 'com.survivalparadise.nativegame.v162statstest'" in (
              root/'app/build.gradle').read_text()
          print('PASS: V162 seeded generation, saved interiors, zoom perf, item stats, door access, road bounds, headgear ban')
          PY
          python3 survival-paradise/native-game/tools/test_headgear_visuals_v138.py
      - name: Install Android 35 SDK/build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble V162 standalone signed-debug APK
        working-directory: survival-paradise/native-game
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
      - name: Independently verify APK payload, original pixels, package, signature and ZIP
        shell: bash
        run: |
          set -euo pipefail
          APK=survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1 | grep -F 'No errors detected'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,zipfile,json
          apk=Path('survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as a:
              original=[
                'assets/body.png','assets/gear.png','assets/npc_idle_v56.png',
                'assets/npc_walk_v56.png','assets/approved_v44_walk_palette.png',
                'assets/world_props_v74.png','assets/sp_v109_characters.zip',
                'assets/sp_v139_outfits.zip',
                'assets/industrial_v123/SP_Industrial_Factory_Double_Bay_01.webp']
              for name in original:
                  assert name in a.namelist(),f'APPROVED ART MISSING FROM APK: {name}'
                  assert len(a.read(name))>100,name
              assert hashlib.sha256(a.read('assets/body.png')).hexdigest()==\
                  '141878713a6880d05879b7102c728581dddb55730434bcac8e050fe44b3d82ad'
              raw=a.read('assets/sp_v109_characters.zip')
              assert hashlib.sha256(raw).hexdigest()==\
                  'c8e364bc1485eb5251fa9494889977038268cbac10f455fa844d7b8a46f6dc3a'
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None
                  assert all(f'heads/{n:03}.png' in z.namelist() for n in range(1,201))
                  assert len(json.loads(z.read('v5_fittings.json'))['characterOverrides'])==51
              factory=sum(n.startswith('assets/industrial_v123/') and n.endswith('.webp')
                          for n in a.namelist())
              assert factory==24,f'industrial source-art count changed: {factory}'
          print('PASS: 200 heads, 5 animation sources, 51 fits, 24 industrial sprites and immutable SHA inside installable APK')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v162-badging.txt
          grep -F "name='com.survivalparadise.nativegame.v162statstest'" /tmp/v162-badging.txt
          grep -F "versionCode='162'" /tmp/v162-badging.txt
          grep -F "sdkVersion:'24'" /tmp/v162-badging.txt
          grep -F "application-label:'Survival Paradise V162 Test'" /tmp/v162-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          mkdir -p deliverables
          cp "$APK" deliverables/Survival_Paradise_V162_Real_Stats_Roads_Test.apk
          sha256sum deliverables/Survival_Paradise_V162_Real_Stats_Roads_Test.apk | tee deliverables/SHA256.txt
          wc -c deliverables/Survival_Paradise_V162_Real_Stats_Roads_Test.apk
      - name: Upload verified installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Survival_Paradise_V162_Real_Stats_Roads_Test
          path: deliverables/
          if-no-files-found: error
          compression-level: 0
          retention-days: 21
