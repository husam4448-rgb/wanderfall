name: Survival Paradise V85 — Publish Direct APK
on:
  push:
    branches: [sp-native-v85-save-ground-pickups-20261101]
    paths: ['.github/workflows/sp-v85-direct-apk-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-v85:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve V85 verified installable APK and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/spv85
          gh run download 41261169069 -R "$GITHUB_REPOSITORY" \
            -n SP_V85_SavesResourcesIcons -D /tmp/spv85
          APK=/tmp/spv85/SurvivalParadise_V85_SavesResourcesIcons.apk
          SOURCE=/tmp/spv85/SurvivalParadise_V85_Source.zip
          test -s "$APK" && test -s "$SOURCE"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q classes.dex
          for a in body.png approved_v44_walk_palette.png npc_idle_v56.png approved_v29_axe.png gear.png world_props_v74.png; do
            unzip -l "$APK" | grep -q "assets/$a"
          done
          sha256sum "$APK" > /tmp/spv85/V85_APK_SHA256.txt
          cat /tmp/spv85/V85_APK_SHA256.txt
      - name: Publish public direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=survival-paradise-v85-saves-ground-resources
          APK=/tmp/spv85/SurvivalParadise_V85_SavesResourcesIcons.apk
          SOURCE=/tmp/spv85/SurvivalParadise_V85_Source.zip
          HASH=/tmp/spv85/V85_APK_SHA256.txt
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SOURCE" "$HASH" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SOURCE" "$HASH" \
              -R "$GITHUB_REPOSITORY" \
              --target 54c26813a2eaaf777a02618cf4999484dcf74faa \
              --title "Survival Paradise V85 — Save Transfer, Ground Resources & Large Icons" \
              --notes "V85 verified Android APK from 54c26813a2eaaf777a02618cf4999484dcf74faa. Adds additional guaranteed forest/camp stone outcrops and loose ground stone, wood and scrap pickups using USE, with saved depletion. Backpack icons are enlarged to 35dp above names (78dp rows); quick-assignment icons 31dp above labels (74dp rows), and game hotbar icons enlarged to 32px. Settings includes lossless JSON EXPORT/IMPORT game save through the Android file picker, with Android Auto Backup enabled; preserves world, inventory, camera and HUD settings when explicitly exported and restored. APK package ID remains com.survivalparadise.nativegame and versionCode increases to 86. IMPORTANT: legacy Gradle debug signing keys were not pinned; this build may NOT install directly over V84. Uninstalling deletes game data. Save V84 using USB/ADB before uninstall, or keep V84 installed. Future in-place updates require a permanent keystore in the repo Actions secrets, supported but not yet guaranteed by this test release. No source sprites changed; on-device visual/FPS review pending." \
              --prerelease
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" \
            --json url,assets --jq '{url:.url,assets:[.assets[]|{name:.name,url:.url}]}'
