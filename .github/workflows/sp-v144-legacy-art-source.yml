name: Survival Paradise V144 - Exact Legacy Artwork and Android Java Compile (NO APK)
on:
  push:
    branches: [sp-native-v144-legacy-equipment-art-20261115]
    paths:
      - '.github/workflows/sp-v144-legacy-art-source.yml'
      - 'survival-paradise/native-game/tools/build_v144_legacy_equipment.py'
      - 'survival-paradise/native-game/tools/V144LegacyVisualTest.java'
      - 'survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/ApprovedOutfitArtV139.java'
      - 'survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/BootArtV133.java'
      - 'survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/LegacyOutfitVisualV144.java'
      - 'survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/GameView.java'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  art-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline art tooling
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Generate the nine source-locked PNGs and one optional archive
        run: |
          python survival-paradise/native-game/tools/build_v144_legacy_equipment.py
      - name: Validate all nine unique assets and exact original alpha
        shell: bash
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          root=Path('survival-paradise/native-game')
          a=root/'app/src/main/assets/sp_v144_legacy_equipment.zip'
          report=json.loads((root/'tools/generated/validation.json').read_text())
          assert len(report)==9,report
          assert all(r['alpha_exact'] and r['different_pixels']>100 for r in report.values())
          with zipfile.ZipFile(a) as z:
              assert len([n for n in z.namelist() if n.endswith('.png')])==9
              assert z.testzip() is None
              for category,count in [('torsos',3),('pants',3),('boots',3)]:
                  assert len([n for n in z.namelist() if n.startswith(category+'/') and n.endswith('.png')])==count
          assert all(r['width']==68 and r['height']==52 for r in report.values() if r['type']=='boots')
          print('PASS: nine exact-size, exact-alpha legacy equipment assets, original black outlines unchanged')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure Java equipment type and headgear-visibility regression
        shell: bash
        run: |
          set -euo pipefail
          C=survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame
          javac -d /tmp/sp-v144-tests "$C/LegacyOutfitVisualV144.java" survival-paradise/native-game/tools/V144LegacyVisualTest.java
          java -cp /tmp/sp-v144-tests com.survivalparadise.nativegame.V144LegacyVisualTest
      - name: Prepare Android API 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android Java compilation only (NO APK)
        working-directory: survival-paradise/native-game
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Assert APK has not been produced
        shell: bash
        run: |
          test ! -f survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk
          echo "PASS: Java compilation only; no Android package generated"
      - name: Publish visually reviewable art proof (no APK)
        uses: actions/upload-artifact@v4
        with:
          name: sp-v144-nine-legacy-sprites-qa
          path: |
            survival-paradise/native-game/tools/generated/
            survival-paradise/native-game/app/src/main/assets/sp_v144_legacy_equipment.zip
          if-no-files-found: error
      - name: Commit verified generated ZIP to the isolated V144 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add survival-paradise/native-game/app/src/main/assets/sp_v144_legacy_equipment.zip
          if git diff --cached --quiet; then
            echo "Artwork already matches V144 branch"
          else
            git commit -m "V144 validated nine original-dimension legacy equipment sprites"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
