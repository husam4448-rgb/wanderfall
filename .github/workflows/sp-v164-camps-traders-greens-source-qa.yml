name: Survival Paradise V164 - Camps, Traders, Green Lots and Backpacks QA
on:
  push:
    branches: [sp-native-v164-settlement-camps-greenways-20261118]
    paths:
      - '.github/workflows/sp-v164-camps-traders-greens-source-qa.yml'
      - 'survival-paradise/native-game/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Regression test seeded interiors and world saves
        shell: bash
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          P="$R/app/src/main/java/com/survivalparadise/nativegame"
          mkdir -p /tmp/v164-java
          javac -sourcepath "$R/app/src/main/java" -d /tmp/v164-java \
            "$R/tools/V161NeighborhoodInteriorTest.java" \
            "$R/tools/GearStatsV162Test.java" \
            "$R/tools/V163InteriorLayoutTest.java" \
            "$R/tools/V164SettlementCampTest.java" \
            "$R/tools/V160SeededGeographyTest.java" \
            "$R/tools/V159WorldPlanTest.java" \
            "$R/tools/NeighborhoodV154Test.java"
          for test in V164SettlementCampTest V163InteriorLayoutTest GearStatsV162Test V161NeighborhoodInteriorTest V160SeededGeographyTest \
                      V159WorldPlanTest NeighborhoodV154Test; do
            java -Xmx512m -cp /tmp/v164-java \
              com.survivalparadise.nativegame."$test"
          done
      - name: Verify world UI fixes and approved head-only constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          game=(p/'GameView.java').read_text()
          menu=(p/'MainActivity.java').read_text()
          assert 'NeighborhoodInteriorV161.siteId' in game
          assert 'CampWorldV164.generate(industrialSeedV123,civilizationV159)' in game
          assert 'campCachesV164.encode()' in game
          assert 'lootCampChestV164' in menu
          assert 'CampArtV164.drawStructures' in game
          assert 'CityGreensV164.draw' in game
          assert '(Math.floorMod(npcVariant*31+skinIdV109,10)!=0)' in game
          assert 'Math.floorMod(h,100)>=19' in (p/'CampWorldV164.java').read_text()
          assert 'expandTraderV164' in (p/'NpcTradeLedgerV143.java').read_text()
          assert 'if(!camp.starter)' in game
          assert (p/'CampArtV164.java').exists()
          assert 'NeighborhoodLayoutV163' in game or 'NeighborhoodLayoutV163' in (p/'NeighborhoodInteriorV161.java').read_text()
          assert 'sceneDoorPositionsV163' in game
          assert 'sceneLabelPositionsV163' in game
          assert 'game.organizeBagV131(1)' in menu
          assert 'showSocketInspectorV163' in menu
          assert 'showItemInspectorV163' in menu
          assert 'lootItemKindV163' in menu
          assert 'NpcTradeLedgerV143.resale(type)' in menu
          assert 'comparisonDetailsV163' in menu
          assert 'layoutV163.blocked(x,y,r)' in (p/'NeighborhoodInteriorV161.java').read_text()
          assert 'GearStatsV162.damageAfterArmor(amount,equipmentBonusesV162())' in game
          assert 'equipmentBonusesV162().regenHpPerSecond*dt' in game
          assert 'GearStatsV162.movementFactor(equipmentBonusesV162())' in game
          assert 'GearStatsV162.encumbrance(inventoryLoadV162(),bonus)' in game
          assert 'ItemDetailsV162.describe(game,type,quantity)' in menu
          assert 'refreshQuickV162[0]' in menu
          assert 'roadBottom=camY+viewH+4f' in game
          assert 'NeighborhoodInteriorV161.saveKey' in game
          assert 'NeighborhoodInteriorArtV161.furniture' in game
          assert 'NeighborhoodInteriorArtV161.floor' in game
          assert 'salvageOnIndustrialRoadV161(x,y)' in game
          assert 'terrainChunks.draw(c,camX,camY,viewW,viewH,renderZoomV90)' in game
          assert 'bagItemStatsV162' in menu
          assert 'lootIconV134(kind)' in menu
          assert 'int footerDp=dp118(26);' in menu
          road=(p/'NeighborhoodArtV154.java').read_text()
          assert 'for(float xx:vertical)for(float yy:horizontal)' in road
          assert 'if(!intersection)box(c,p,x+cx' in road
          portrait=(p/'V62InventoryPreview.java').read_text()
          assert 'canvas.translate(w*.57f,h*.76f)' in portrait
          assert 'if(index==1)return;' in game
          assert (p/'NeighborhoodInteriorV161.java').exists()
          print('PASS V164: live gear combat bonuses, true item inspector, dynamic refresh, connected roads, immutable heads')
          PY
      - name: Install Android 35 SDK for source-only Java compilation
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile the Android app without packaging an APK
        working-directory: survival-paradise/native-game
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugJavaWithJavac
