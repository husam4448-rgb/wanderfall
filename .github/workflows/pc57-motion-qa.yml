name: PC57 Original Motion QA
on:
  push:
    branches: [pc57-motion-playback-qa]
    paths:
      - 'tools/pc57_motion_acceptance.py'
      - 'tools/test_pc57_motion_acceptance.py'
      - '.github/workflows/pc57-motion-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify world-space stance and rifle-grip QA rejects known defects
        run: python3 tools/test_pc57_motion_acceptance.py
