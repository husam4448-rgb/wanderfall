name: Survival Paradise V157 - Solid Buildings and Natural World APK
on:
  push:
    branches: [sp-native-v157-solid-buildings-natural-world-20261117]
    paths:
      - '.github/workflows/sp-v157-world-polish-apk.yml'
      - 'survival-paradise/native-game/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
            assets/authored2d
            assets/world
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore exact 200 approved characters and all legacy runtime atlases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user -q Pillow numpy
          python3 survival-paradise/native-game/tools/restore_runtime_assets_v157.py
      - name: Verify solid walls, roof-exclusion, analog ground and swept movement
        shell: bash
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          P="$R/app/src/main/java/com/survivalparadise/nativegame"
          mkdir -p /tmp/v157-geometry
          javac -d /tmp/v157-geometry             "$P/WorldChunkModel.java"             "$P/BiomeWorldV74.java"             "$P/Ballistics.java"             "$P/ClinicInteriorV89.java"             "$P/ExpeditionSitesV88.java"             "$P/ExteriorFootprintV130.java"             "$P/NeighborhoodV154.java"             "$P/NaturalGroundV157.java"             "$P/SweptWorldCollisionV157.java"             "$P/IndustrialWorldV123.java"             "$P/IndustrialOpenWorldV124.java"             "$P/IndustrialComplexV155.java"             "$P/IndustrialFacadeShapeV126.java"             "$P/IndustrialPropLayoutV126.java"             "$P/IndustrialCampV125.java"             "$P/IndustrialBiomeBridgeV128.java"             "$P/WorldBuildingV157.java"             "$R/tools/ExteriorFootprintV130Test.java"             "$R/tools/NeighborhoodV154Test.java"             "$R/tools/V157WorldPolishTest.java"             "$R/tools/IndustrialComplexV155Test.java"             "$R/tools/IndustrialFitV125Test.java"             "$R/tools/IndustrialGeometryV126Test.java"
          for test in ExteriorFootprintV130Test NeighborhoodV154Test                  V157WorldPolishTest IndustrialComplexV155Test                  IndustrialFitV125Test IndustrialGeometryV126Test; do
            java -cp /tmp/v157-geometry com.survivalparadise.nativegame."$test"
          done
      - name: Verify legacy game mechanics, opaque original heads and draw depth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('survival-paradise/native-game')
          base=root/'app/src/main/java/com/survivalparadise/nativegame'
          src=(base/'GameView.java').read_text()
          manifests=(root/'app/build.gradle').read_text()
          assert "applicationId 'com.survivalparadise.nativegame.v157worldfix'" in manifests
          assert 'pixel.setAlpha(255);' in src
          assert 'V157: missing approved character/weapon assets' in src
          assert src.index('drawSalvageWorldV84(c);') < src.index('NeighborhoodArtV154.draw(c,p,camX,camY,viewW,viewH,night);')
          assert src.index('drawLooseGroundPickupsV85(c);') < src.index('drawExpeditionSitesV88(c);')
          assert 'NaturalGroundArtV157.draw(c,camX,camY,viewW,viewH)' in src
          assert 'WorldBuildingV157.sceneryRectBlocked(' in src
          assert src.count('SweptWorldCollisionV157.clear(')>=8
          assert 'new IllegalStateException("V157: missing approved character/weapon assets")' in src
          assert (base/'IndustrialComplexArtV155.java').exists()
          print('PASS: 200 original heads mandatory, solid buildings, 8 industries, naturalized terrain, anti-tunneling')
          PY
          python3 survival-paradise/native-game/tools/test_headgear_visuals_v138.py
      - name: Install Android 35 SDK/build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble V157 standalone signed-debug APK
        working-directory: survival-paradise/native-game
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
      - name: Independently verify APK payload, original pixels, package, signature and ZIP
        shell: bash
        run: |
          set -euo pipefail
          APK=survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1 | grep -F 'No errors detected'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,zipfile,json
          apk=Path('survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as a:
              original=[
                'assets/body.png','assets/gear.png','assets/npc_idle_v56.png',
                'assets/npc_walk_v56.png','assets/approved_v44_walk_palette.png',
                'assets/world_props_v74.png','assets/sp_v109_characters.zip',
                'assets/sp_v139_outfits.zip',
                'assets/industrial_v123/SP_Industrial_Factory_Double_Bay_01.webp']
              for name in original:
                  assert name in a.namelist(),f'APPROVED ART MISSING FROM APK: {name}'
                  assert len(a.read(name))>100,name
              assert hashlib.sha256(a.read('assets/body.png')).hexdigest()==\
                  '141878713a6880d05879b7102c728581dddb55730434bcac8e050fe44b3d82ad'
              raw=a.read('assets/sp_v109_characters.zip')
              assert hashlib.sha256(raw).hexdigest()==\
                  'c8e364bc1485eb5251fa9494889977038268cbac10f455fa844d7b8a46f6dc3a'
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None
                  assert all(f'heads/{n:03}.png' in z.namelist() for n in range(1,201))
                  assert len(json.loads(z.read('v5_fittings.json'))['characterOverrides'])==51
              factory=sum(n.startswith('assets/industrial_v123/') and n.endswith('.webp')
                          for n in a.namelist())
              assert factory==24,f'industrial source-art count changed: {factory}'
          print('PASS: 200 heads, 5 animation sources, 51 fits, 24 industrial sprites and immutable SHA inside installable APK')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/v157-badging.txt
          grep -F "name='com.survivalparadise.nativegame.v157worldfix'" /tmp/v157-badging.txt
          grep -F "versionCode='157'" /tmp/v157-badging.txt
          grep -F "sdkVersion:'24'" /tmp/v157-badging.txt
          grep -F "application-label:'Survival Paradise V157 World'" /tmp/v157-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          mkdir -p deliverables
          cp "$APK" deliverables/Survival_Paradise_V157_World_Fix.apk
          sha256sum deliverables/Survival_Paradise_V157_World_Fix.apk | tee deliverables/SHA256.txt
          wc -c deliverables/Survival_Paradise_V157_World_Fix.apk
      - name: Upload verified installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Survival_Paradise_V157_World_Fix
          path: deliverables/
          if-no-files-found: error
          compression-level: 0
          retention-days: 21
