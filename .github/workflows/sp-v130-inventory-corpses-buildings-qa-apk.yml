name: Survival Paradise V130 - Inventory, Corpses, Lighting and Full-Scale Buildings QA APK
on:
  push:
    branches: [sp-native-v130-inventory-corpses-light-buildings-20261106]
    paths:
      - 'survival-paradise/native-game/**'
      - '.github/workflows/sp-v130-inventory-corpses-buildings-qa-apk.yml'
  workflow_dispatch:

concurrency:
  group: survival-paradise-v127-indoor-vision
  cancel-in-progress: true

jobs:
  verify-native-character-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
            assets/authored2d
            assets/world
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate the exact locked V31/V56 source art
        run: |
          set -euo pipefail
          python3 -m pip install --user -q Pillow numpy
          python3 survival-paradise/native-game/tools/extract_locked_atlases.py
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib
          r=Path("survival-paradise/native-game")
          for encoded,dest,sha in [
             ("approved_v29_axe.png.b64","approved_v29_axe.png","f0d146757318e620024cae0c2a34243bdd9339a939a7f51e5428ae8250620dee"),
             ("approved_v44_walk_palette.png.b64","approved_v44_walk_palette.png","fd01230e9c13ffd3087e933abe976a2179d80e9adc9b0710f899a7bef7fc3d71")
          ]:
              data=base64.b64decode((r/"tools"/encoded).read_text().strip(),validate=True)
              assert hashlib.sha256(data).hexdigest()==sha,encoded
              (r/"app/src/main/assets"/dest).write_bytes(data)
          PY
          python3 survival-paradise/native-game/tools/build_v51_assets.py
          python3 survival-paradise/native-game/tools/build_v52_idle.py
          python3 survival-paradise/native-game/tools/fix_v53_skin_palette.py
          python3 survival-paradise/native-game/tools/build_v56_approved_character_atlases.py
          python3 survival-paradise/native-game/tools/build_v74_biome_assets.py
          test "$(sha256sum survival-paradise/native-game/app/src/main/assets/body.png | cut -d' ' -f1)" = "141878713a6880d05879b7102c728581dddb55730434bcac8e050fe44b3d82ad"
      - name: Verify V122 approved art and isolated APK package identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("survival-paradise/native-game")
          source=(root/"app/src/main/java/com/survivalparadise/nativegame/CharacterSkinsV109.java").read_text()
          gradle=(root/"app/build.gradle").read_text()
          assert "versionCode 130" in gradle
          assert "applicationId 'com.survivalparadise.nativegame.v130survivalqa'" in gradle
          assert "sp_v109_characters.zip" in source
          assert "CharacterAnimationV110.breathOffset" in source
          assert "CharacterAnimationV110.bodyFrame" in source
          assert "new Fit(base)" in source
          assert "boolean walking" in source
          print("V122 immutable 200 original characters/V5 fitting + isolated test APK: PASS")
          PY
      - name: Test V122 all original regressions, NPC 360-degree aiming and gunfire geometry (pure JVM)
        run: |
          set -e
          R=survival-paradise/native-game
          mkdir -p /tmp/sp-v112-jvm
          javac -d /tmp/sp-v112-jvm "$R/app/src/main/java/com/survivalparadise/nativegame/AnimationCycle.java" "$R/tools/AnimationCycleTest.java" "$R/app/src/main/java/com/survivalparadise/nativegame/CharacterAnimationV110.java" "$R/tools/CharacterAnimationV110Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/Ballistics.java" "$R/app/src/main/java/com/survivalparadise/nativegame/HeadAimV111.java" "$R/tools/HeadAimV111Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/HeadFitOffsetsV112.java" "$R/tools/HeadFitOffsetsV112Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/CharacterScopeV113.java" "$R/tools/CharacterScopeV113Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/TorsoWidthV114.java" "$R/tools/TorsoWidthV114Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/PelvisWidthV115.java" "$R/tools/PelvisWidthV115Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/PelvisLegRigV116.java" "$R/tools/PelvisLegRigV116Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/WeaponPivotV117.java" "$R/tools/WeaponPivotV117Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/FollowFormationV61.java" "$R/app/src/main/java/com/survivalparadise/nativegame/CompanionOrdersV118.java" "$R/app/src/main/java/com/survivalparadise/nativegame/GunEffectsV118.java" "$R/tools/V118RegressionTest.java" "$R/app/src/main/java/com/survivalparadise/nativegame/HudDragV119.java" "$R/app/src/main/java/com/survivalparadise/nativegame/GunEffectsV119.java" "$R/tools/V119RegressionTest.java" "$R/app/src/main/java/com/survivalparadise/nativegame/BodyAlignmentV120.java" "$R/tools/BodyAlignmentV120Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/LegacyControlsV58.java" "$R/app/src/main/java/com/survivalparadise/nativegame/TopHudV76.java" "$R/app/src/main/java/com/survivalparadise/nativegame/WorldUiV86.java" "$R/app/src/main/java/com/survivalparadise/nativegame/ScreenshotDefaultsV121.java" "$R/tools/ScreenshotDefaultsV121Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/NpcAimV122.java" "$R/app/src/main/java/com/survivalparadise/nativegame/NpcGunfireV122.java" "$R/tools/NpcAimV122Test.java"
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.AnimationCycleTest
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.CharacterAnimationV110Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.HeadAimV111Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.HeadFitOffsetsV112Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.CharacterScopeV113Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.TorsoWidthV114Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.PelvisWidthV115Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.PelvisLegRigV116Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.WeaponPivotV117Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.V118RegressionTest
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.V119RegressionTest
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.BodyAlignmentV120Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.ScreenshotDefaultsV121Test
          java -cp /tmp/sp-v112-jvm com.survivalparadise.nativegame.NpcAimV122Test
      - name: Test V126 traced source-alpha roof contours, world-scale props, safe camp and old V124 roads
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          mkdir -p /tmp/sp-v123-jvm
          javac -d /tmp/sp-v123-jvm "$R/app/src/main/java/com/survivalparadise/nativegame/IndustrialWorldV123.java" "$R/app/src/main/java/com/survivalparadise/nativegame/IndustrialOpenWorldV124.java" "$R/tools/IndustrialWorldV123Test.java" "$R/tools/IndustrialOpenWorldV124Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/IndustrialCampV125.java" "$R/tools/IndustrialFitV125Test.java" "$R/app/src/main/java/com/survivalparadise/nativegame/IndustrialFacadeShapeV126.java" "$R/app/src/main/java/com/survivalparadise/nativegame/IndustrialPropLayoutV126.java" "$R/tools/IndustrialGeometryV126Test.java"
          java -cp /tmp/sp-v123-jvm com.survivalparadise.nativegame.IndustrialWorldV123Test
          java -cp /tmp/sp-v123-jvm com.survivalparadise.nativegame.IndustrialOpenWorldV124Test
          java -cp /tmp/sp-v123-jvm com.survivalparadise.nativegame.IndustrialFitV125Test
          java -cp /tmp/sp-v123-jvm com.survivalparadise.nativegame.IndustrialGeometryV126Test
      - name: Verify V127 NPC visibility, wall occlusion and cone masking
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          P="$R/app/src/main/java/com/survivalparadise/nativegame"
          mkdir -p /tmp/sp-v127-vision
          javac -d /tmp/sp-v127-vision \
            "$P/ClinicInteriorV89.java" \
            "$P/ClinicActorsV90.java" \
            "$P/ClinicVisionV90.java" \
            "$P/IndoorCharacterVisionV127.java" \
            "$R/tools/IndoorCharacterVisionV127Test.java"
          java -cp /tmp/sp-v127-vision com.survivalparadise.nativegame.IndoorCharacterVisionV127Test
          python3 - <<'PY'
          from pathlib import Path
          s=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/GameView.java').read_text()
          assert s.count('drawIndoorVisibleEntityV127(c,')>=4
          assert s.count('!indoorCharacterVisibleV127(')>=5
          assert 'c.clipPath(clinicVisionPathV90);' in s
          assert 'sorted.add(new DrawEntity(playerY,()->character' in s
          assert 'indoorOrderV92.add(new DrawEntity(playerY,()->{' in s
          print('PASS: NPC, companion, speech clipping in both indoor paths; player preserved')
          PY
      - name: Validate V128 connected road, seed-stable biome, doors and save coordinates
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          P="$R/app/src/main/java/com/survivalparadise/nativegame"
          mkdir -p /tmp/sp-v128-stitch
          javac -d /tmp/sp-v128-stitch \
            "$P/IndustrialWorldV123.java" \
            "$P/IndustrialOpenWorldV124.java" \
            "$P/IndustrialFacadeShapeV126.java" \
            "$P/IndustrialPropLayoutV126.java" \
            "$P/IndustrialBiomeBridgeV128.java" \
            "$R/tools/IndustrialBiomeBridgeV128Test.java"
          java -cp /tmp/sp-v128-stitch com.survivalparadise.nativegame.IndustrialBiomeBridgeV128Test
          python3 - <<'PY'
          from pathlib import Path
          d=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          g=(d/'GameView.java').read_text()
          m=(d/'MainActivity.java').read_text()
          assert 'final boolean industrialModeV123=false;' in g
          assert 'final boolean stitchedIndustrialV128=true;' in g
          assert 'IndustrialBiomeSceneV128.draw' in g
          assert 'IndustrialBiomeBridgeV128.nearestEntrance' in g
          assert 'IndustrialBiomeBridgeV128.worldX(target.doorX)' in g
          assert 'IndustrialBiomeBridgeV128.blocked' in g
          assert 'IndustrialBiomeBridgeV128.localX(playerX)' in g
          assert '.putBoolean("v128_world_coords",true)' in g
          assert 'drawBiomePropsV74(c)' in g
          assert 'drawExpeditionSitesV88(c)' in g
          assert 'drawSpawnCamp(c)' in g
          assert 'TRAVEL TO INDUSTRIAL HIGHWAY ENTRANCE' in m
          assert 'Start a new seeded world?' in m
          print('PASS V128 integrated native old-world+industrial rendering, save keys, interactions, and UI travel')
          PY
      - name: Verify V129 persistent item drops and permanent corpse saves
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          P="$R/app/src/main/java/com/survivalparadise/nativegame"
          mkdir -p /tmp/sp-v129-tests
          javac -d /tmp/sp-v129-tests \
            "$P/DroppedItemsV129.java" \
            "$P/BanditLootV87.java" \
            "$R/tools/V129DropsCorpsesTest.java"
          java -cp /tmp/sp-v129-tests com.survivalparadise.nativegame.V129DropsCorpsesTest
          python3 - <<'PY'
          from pathlib import Path
          root=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          game=(root/'GameView.java').read_text()
          menu=(root/'MainActivity.java').read_text()
          assert 'lighting.point(f.x,f.y,190f' in game
          assert 'drawFireLightingV130(c)' in game
          assert 'p.setStrokeWidth(1.8f)' in game
          assert 'hitBloodV129(' in game and 'hurtDirectionalV129(' in game
          assert 'banditLootV87.spawnCorpse(' in game
          assert 'drawFallenBodyV129(' in game and 'drawIndoorCorpsesV129(c)' in game
          assert 'searchIndoorCorpseV129(' in game
          assert 'ground_drops_v129' in game
          assert 'droppedItemsV129.expire(gameTimeV129())' in game
          assert 'drawDroppedItemsV129(c)' in game
          assert 'dropInventoryV129(' in game and 'takeDroppedV129(' in game
          assert 'dropQuantityDialogV129(' in menu
          assert 'android.R.drawable.ic_menu_delete' in menu
          assert 'dropByListV129(' in menu
          assert 'groundDropDaysV129' in menu
          assert 'searchIndoorCorpseDialogV129(' in menu
          assert 'v128_world_coords' in game and 'IndustrialBiomeSceneV128.draw' in game
          assert 'drawIndoorVisibleEntityV127(c,' in game
          print('PASS V129 native render, directional damage, interactive drop, corpse and V128 preservation')
          PY
      - name: V130 verify item-stack conservation, 26 large buildings and source art
        run: |
          set -euo pipefail
          P=survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame
          mkdir -p /tmp/sp-v130-tests
          javac -d /tmp/sp-v130-tests \
            "$P/InventorySplitV130.java" \
            "$P/ExpeditionSitesV88.java" \
            "$P/WorldSafetyV92.java" \
            "$P/SiteExteriorScaleV130.java" \
            survival-paradise/native-game/tools/V130InventorySiteTest.java
          java -cp /tmp/sp-v130-tests com.survivalparadise.nativegame.V130InventorySiteTest
          python3 - <<'PY'
          from pathlib import Path
          root=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          game=(root/'GameView.java').read_text()
          menu=(root/'MainActivity.java').read_text()
          shader=(root/'GunEffectsV119.java').read_text()
          assert 'clinicVisionPathV90.addCircle(' not in game
          assert 'c.drawCircle(ox,oy,ClinicVisionV90.NEAR,p)' not in game
          assert 'characterSkinsV109.draw(c,skin,false,0,0f' in game
          assert 'if(actor.type==ClinicActorsV90.FERAL)' in game
          assert 'drawFireLightingV130(c)' in game
          assert 'FLASH_SECONDS=.155f' in shader
          assert 'SiteExteriorScaleV130.scale(s.kind)' in game
          assert 'SiteExteriorScaleV130.blocked(x,y,r)' in game
          assert 'bagSlotItemV130(' in game and 'bagSlotCountV130(' in game
          assert 'inventory_split_v130' in game
          assert 'splitQuantityDialogV130(' in menu
          assert 'inventoryItemMenuV130(' in menu
          assert 'InventoryDragScrollV130' in menu
          assert 'draggedOutsideV130[0]' in menu
          assert 'dropBagSlotDialogV130(' in menu
          assert 'droppedItemsV129.expire' in game
          assert 'IndustrialBiomeSceneV128.draw' in game
          print('PASS V130: removed circular reveal, static animal/human remains, real muzzle light, full-scale collision and input UI')
          PY
      - name: Prepare Android 35 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use stable key when already configured
        env:
          SP_KEYSTORE_BASE64: ${{ secrets.SP_SIGNING_KEYSTORE_BASE64 }}
          SP_SIGNING_PASSWORD: ${{ secrets.SP_SIGNING_PASSWORD }}
          SP_SIGNING_KEY_PASSWORD: ${{ secrets.SP_SIGNING_KEY_PASSWORD }}
          SP_SIGNING_ALIAS: ${{ secrets.SP_SIGNING_ALIAS }}
        run: |
          if [ -n "$SP_KEYSTORE_BASE64" ] && [ -n "$SP_SIGNING_PASSWORD" ]; then
            echo "$SP_KEYSTORE_BASE64" | base64 --decode > /tmp/sp_native_stable_keystore.jks
            echo "SP_SIGNING_STORE=/tmp/sp_native_stable_keystore.jks" >> "$GITHUB_ENV"
            echo "SP_SIGNING_PASSWORD=$SP_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "SP_SIGNING_KEY_PASSWORD=$SP_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SP_SIGNING_ALIAS=$SP_SIGNING_ALIAS" >> "$GITHUB_ENV"
          else
            echo "::warning::No stable signing configured; resulting debug build might not upgrade existing installation."
          fi
      - name: Reconstruct and verify 200 approved character sources + V5 fittings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,io,json,hashlib
          root=Path("survival-paradise/native-game")
          parts=sorted((root/"source_v109").glob("part_*.bin"))
          assert len(parts)==8, f"expected 8 exact lossless source segments, found {len(parts)}"
          data=b"".join(p.read_bytes() for p in parts)
          actual=hashlib.sha256(data).hexdigest()
          expected="c8e364bc1485eb5251fa9494889977038268cbac10f455fa844d7b8a46f6dc3a"
          assert actual==expected,(actual,expected)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None,"corrupt source ZIP"
              for i in range(1,201):
                  assert f"heads/{i:03}.png" in z.namelist(),f"head {i} missing"
              pack=json.loads(z.read("v5_fittings.json"))
              assert pack["totalCharacters"]==200
              assert pack["animation"]["idleMode"]=="head-only-breathing"
              assert len(pack["characterOverrides"])==pack["overrideCount"]==51
              assert len(z.read("body_idle.png"))>100
              assert len(z.read("body_walk.png"))>100
          target=root/"app/src/main/assets/sp_v109_characters.zip"
          target.write_bytes(data)
          print("VERIFIED: 200 exact heads, 4 walk poses, static idle body, V5 51 overrides",len(data),actual)
          PY
      - name: Verify V114 approved source pixels, original pants and feet in all poses
        run: python3 survival-paradise/native-game/tools/test_v114_torso_source.py
      - name: V122 verify original five idle/walk poses and original foot pixels
        run: python3 survival-paradise/native-game/tools/test_v116_legs_exact.py
      - name: "V122 verify all gameplay, original fittings and world+indoor NPC gunfire integration"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path("survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame")
          game=(d/"GameView.java").read_text()
          skins=(d/"CharacterSkinsV109.java").read_text()
          menu=(d/"MainActivity.java").read_text()
          assert 'characterSkinsV109.draw(c,skinIdV109' in game
          assert 'else if(characterSkinsV109!=null||!bandit)' in game
          assert 'if(characterSkinsV109==null){ // legacy equipment is hidden' in game
          assert 'playerSkinV109' in menu
          assert 'float breathing=CharacterAnimationV110.breathOffset' in skins
          assert 'CharacterAnimationV110.bodyFrame' in skins
          assert 'idleBreathingSpeedV110' in game and 'idleBreathingSpeedV110' in menu
          assert 'walkingAnimationMultiplierV79,' in game
          assert 'player?fitWalkFpsV108:npcWalkFpsV113' in game
          assert 'player?fitIdleBreathV108:npcBreathPixelsV113' in game
          assert 'HeadAimV111.neckX' in skins and 'HeadAimV111.neckY' in skins
          assert 'c.rotate(Math.max(-HeadAimV111.MAX_DEGREES' in skins
          assert 'playerHeadTiltV111=HeadAimV111.follow' in game
          assert 'headAimTiltV111' in game and 'headAimTiltV111' in menu
          assert 'player?playerHeadTiltV111:' in game
          assert 'HeadFitOffsetsV112.x(hw,fit.horizontal,headOffsetX)' in skins
          assert 'HeadFitOffsetsV112.y(hh,fit.vertical,breathing,headOffsetY)' in skins
          assert 'player?fitHeadXV108:npcHeadFitXV113' in game
          assert 'player?fitHeadYV108:npcHeadFitYV113' in game
          assert 'player?playerHeadSizeV113:npcHeadSizeV113,' in game
          assert 'player?playerTorsoWidthV114:npcTorsoWidthV114,' in game
          assert 'player?playerPelvisWidthV115:npcPelvisWidthV115);' in game
          assert 'PelvisWidthV115.percent(host.setting("pelvisWidthV115",100))' in game
          assert 'PelvisWidthV115.percent(host.setting("pelvisWidthV115NpcV113",100))' in game
          assert 'TorsoWidthV114.percent(host.setting("bodyWidthV114",100))' in game
          assert 'TorsoWidthV114.percent(host.setting("bodyWidthV114NpcV113",100))' in game
          assert 'drawBody(c,body,bodyFrame,fit.blend,left,top,unit,' in skins
          assert 'PelvisLegRigV116.part(frame,x,row+PelvisLegRigV116.PELVIS_TOP)' in skins
          assert 'BodyAlignmentV120.rearBootShift(pelvisWidth)' in skins
          assert 'BodyAlignmentV120.frontBootShift(' in skins
          assert 'Bitmap.createBitmap(separated[PelvisLegRigV116.LEFT_FOOT]' in skins
          assert 'Bitmap.createBitmap(separated[PelvisLegRigV116.RIGHT_FOOT]' in skins
          assert 'canvas.drawBitmap(layers.left,pelvisRigSource,destination,pixels);' in skins
          assert 'canvas.drawBitmap(layers.right,pelvisRigSource,destination,pixels);' in skins
          assert 'canvas.drawBitmap(layers.overlap,pelvisRigSource,destination,pixels);' in skins
          assert 'PELVIS_BAND_BOTTOM=240' in (d/'PelvisLegRigV116.java').read_text()
          assert 'PelvisWidthV115.LEGS_TOP' not in skins
          assert 'TorsoWidthV114.LOWER_BODY_TOP' in skins
          assert 'CharacterScopeV113.key("bodyWidthV114",scope)' in menu
          assert '"bodyWidthV114"' in menu
