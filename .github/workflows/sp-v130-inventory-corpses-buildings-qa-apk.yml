      - name: Verify V122 original 200-character and front foot exact source pixel regression
        run: python3 survival-paradise/native-game/tools/test_v120_alignment.py
      - uses: actions/upload-artifact@v4
        with:
          name: SP_V122_Character_Regression
          path: survival-paradise/native-game/artifacts/V120_idle_walk_fitted_preview.png
          retention-days: 14
          if-no-files-found: error
      - name: Compile Android debug APK
        working-directory: survival-paradise/native-game
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK payload and version
        run: |
          set -e
          APK=survival-paradise/native-game/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/body.png'
          unzip -l "$APK" | grep -q 'assets/npc_idle_v56.png'
          unzip -l "$APK" | grep -q 'assets/sp_v109_characters.zip'
          unzip -l "$APK" | grep -q 'assets/industrial_v123/SP_Industrial_Factory_Double_Bay_01.webp'
          unzip -l "$APK" | grep -q 'assets/industrial_v123/SP_Industrial_Forklift_01.webp'
          INDUSTRIAL_COUNT="$(unzip -Z1 "$APK" | grep -c '^assets/industrial_v123/.*[.]webp$')"
          test "$INDUSTRIAL_COUNT" -eq 24
          echo "Verified $INDUSTRIAL_COUNT V130 industrial sprites in APK"
          mkdir -p artifacts
          cp "$APK" artifacts/SurvivalParadise_V130_Inventory_Buildings_Visual_QA.apk
          sha256sum artifacts/SurvivalParadise_V130_Inventory_Buildings_Visual_QA.apk > artifacts/SHA256.txt
      - name: V130 real Android visual QA - camp, full-size motel, interiors
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash survival-paradise/native-game/tools/v130_android_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP_V130_Inventory_Buildings_Visual_QA_APK
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish V130 inventory, corpses, lighting and buildings APK as a separate test prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=survival-paradise-v130-inventory-buildings-visual-qa
          APK=artifacts/SurvivalParadise_V130_Inventory_Buildings_Visual_QA.apk
          SUM=artifacts/SHA256.txt
          test -s "$APK" && test -s "$SUM"
          for shot in artifacts/SP_V130_Outdoor_Camp_QA.png artifacts/SP_V130_Enlarged_Motel_QA.png artifacts/SP_V130_Interior_Cone_QA.png; do
            test -s "$shot"
          done
          NOTE="V130 QA test based on V129/V128. Inventory drags autoscroll along both visible ends of the 40-slot bag; an Android drag outside the window offers the same drop-quantity slider as the trash icon. Every item opens an item-specific menu with actual stack splitting, dropping, using, equipping or quickslot options. Saved split slot allocations preserve exact global inventory totals. Dead humans use a frozen original idle character atlas with zero head/breathing movement, no weapon animation; dead infected canines remain animal-shaped. Removed the unwanted indoor circular near-player reveal. Every true muzzle flash now casts a bright short warm reflection in daylight or darkness, with 155ms illumination and existing slightly thicker bullets. All 26 original-world facility exteriors have physically scaled 1.65-2.25x silhouettes and source-aligned solid hulls. Crowded sites are placed away from the original paved road, from each other, and the survivor camp/NPC paths; facility indexes, indoor saves and loot remain compatible. The industrial procedural biome is unchanged. Android emulator captured original camp, enlarged motel and live indoor visibility QA screenshots. Isolated V130 test app leaves V129 saves intact; use save export/import."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" artifacts/SP_V130_*_QA.png --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes "$NOTE"
          else
            gh release create "$TAG" "$APK" "$SUM" artifacts/SP_V130_*_QA.png --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" --prerelease --title "Survival Paradise V130 - Inventory, Corpses, Lighting and Full-Scale Buildings QA" --notes "$NOTE"
          fi
