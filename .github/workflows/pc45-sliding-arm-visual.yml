name: PC45 Sliding Arm Native Visual Trial
on:
  push:
    branches: [pc45-restore-pc42-body-constrained-arms]
    paths:
      - 'pc42-static-prototype/**'
      - 'tools/pc42_reference_cutout.py'
      - 'tools/pc42h_articulated_arm_atlas.py'
      - '.github/workflows/pc45-sliding-arm-visual.yml'
      - 'tools/pc45_hidden_cuff_art.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-godot-pose-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct original source artwork unchanged
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow numpy opencv-python-headless
          python tools/pc42_reference_cutout.py
          python tools/pc42h_articulated_arm_atlas.py
          python tools/pc45_hidden_cuff_art.py
          test -s pc42-static-prototype/assets/pc45_hidden_support_cuff.png
          test -s pc42-static-prototype/assets/approved_reference_panel.png
      - name: Acquire pinned Godot 4.7.2 and Xvfb
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null
      - name: Compile restored original Godot body
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path pc42-static-prototype --quit >pc45-import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' pc45-import.log; then cat pc45-import.log; exit 1; fi
      - name: Render minimal sliding sleeves over original artwork
        run: |
          set -euo pipefail
          mkdir -p pc42-static-prototype/evidence
          PC42N_SOURCE_FIRST_PREVIEW=1 PC45_SLIDING_ARM_TEST=1 timeout 90s xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --path pc42-static-prototype --resolution 1580x660 >pc45-sliding.log 2>&1
          grep -q 'PC45_SLIDING_ARM_CAPTURED poses=3' pc45-sliding.log
          test "$(ls pc42-static-prototype/evidence/pc45_sliding_*.png | wc -l)" -eq 3
      - name: Compose full weapon proof
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          p=Path('pc42-static-prototype/evidence')
          out=Image.new('RGB',(1380,562),'#25292d')
          d=ImageDraw.Draw(out)
          for i,k in enumerate(['m12','0','12']):
              im=Image.open(p/('pc45_sliding_'+k+'.png')).convert('RGB')
              assert im.size==(1580,660)
              out.paste(im.crop((565,55,1025,575)),(i*460,42))
              d.text((i*460+12,12),'GODOT SLIDING AIM '+k,fill='white')
          out.save(p/'pc45_sliding_3pose_comparison.png')
          PY
      - name: Upload real screenshots and QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PC45-Sliding-Arm-${{ github.sha }}
          path: |
            pc45-import.log
            pc45-sliding.log
            pc42-static-prototype/evidence/pc45_sliding_*.png
          if-no-files-found: ignore
          retention-days: 14
