name: Survival Paradise V162 - Gameplay Item Stats and Road Junction Source QA
on:
  push:
    branches: [sp-native-v162-item-stats-road-inventory-20261117]
    paths:
      - '.github/workflows/sp-v162-item-stats-road-source-qa.yml'
      - 'survival-paradise/native-game/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            survival-paradise
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Regression test seeded interiors and world saves
        shell: bash
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          P="$R/app/src/main/java/com/survivalparadise/nativegame"
          mkdir -p /tmp/v162-java
          javac -sourcepath "$R/app/src/main/java" -d /tmp/v162-java \
            "$R/tools/V161NeighborhoodInteriorTest.java" \
            "$R/tools/GearStatsV162Test.java" \
            "$R/tools/V160SeededGeographyTest.java" \
            "$R/tools/V159WorldPlanTest.java" \
            "$R/tools/NeighborhoodV154Test.java"
          for test in GearStatsV162Test V161NeighborhoodInteriorTest V160SeededGeographyTest \
                      V159WorldPlanTest NeighborhoodV154Test; do
            java -Xmx512m -cp /tmp/v162-java \
              com.survivalparadise.nativegame."$test"
          done
      - name: Verify world UI fixes and approved head-only constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame')
          game=(p/'GameView.java').read_text()
          menu=(p/'MainActivity.java').read_text()
          assert 'NeighborhoodInteriorV161.siteId' in game
          assert 'GearStatsV162.damageAfterArmor(amount,equipmentBonusesV162())' in game
          assert 'equipmentBonusesV162().regenHpPerSecond*dt' in game
          assert 'GearStatsV162.movementFactor(equipmentBonusesV162())' in game
          assert 'GearStatsV162.encumbrance(inventoryLoadV162(),bonus)' in game
          assert 'ItemDetailsV162.describe(game,type,quantity)' in menu
          assert 'refreshQuickV162[0]' in menu
          assert 'roadBottom=camY+viewH+4f' in game
          assert 'NeighborhoodInteriorV161.saveKey' in game
          assert 'NeighborhoodInteriorArtV161.furniture' in game
          assert 'NeighborhoodInteriorArtV161.floor' in game
          assert 'salvageOnIndustrialRoadV161(x,y)' in game
          assert 'terrainChunks.draw(c,camX,camY,viewW,viewH,renderZoomV90)' in game
          assert 'bagItemStatsV162' in menu
          assert 'lootIconV134(kind)' in menu
          assert 'int footerDp=dp118(26);' in menu
          road=(p/'NeighborhoodArtV154.java').read_text()
          assert 'for(float xx:vertical)for(float yy:horizontal)' in road
          assert 'if(!intersection)box(c,p,x+cx' in road
          portrait=(p/'V62InventoryPreview.java').read_text()
          assert 'canvas.translate(w*.57f,h*.76f)' in portrait
          assert 'if(index==1)return;' in game
          assert (p/'NeighborhoodInteriorV161.java').exists()
          print('PASS V162: live gear combat bonuses, true item inspector, dynamic refresh, connected roads, immutable heads')
          PY
      - name: Install Android 35 SDK for source-only Java compilation
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile the Android app without packaging an APK
        working-directory: survival-paradise/native-game
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugJavaWithJavac
