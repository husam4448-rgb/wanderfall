name: Survival Paradise V147 - Android Touch Bag QA
on:
  push:
    branches: [sp-native-v147-mobile-trade-wallet-ui-20261116]
    paths: ['.github/workflows/sp-v147-mobile-ui-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mobile-bag-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download verified V147 release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sp147/visual
          gh release download survival-paradise-v147-mobile-trade-wallet-test \
            --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --pattern SHA256.txt --dir /tmp/sp147
          (cd /tmp/sp147 && sha256sum -c SHA256.txt)
      - name: Enable emulator virtualization
        run: if [ -c /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Launch native app and open bag currency window
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -no-metrics
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            adb shell wm size 1280x720
            adb shell wm density 220
            adb logcat -c
            adb install /tmp/sp147/SurvivalParadise_V147_Mobile_Trade_Wallet_Test.apk
            adb shell pm path com.survivalparadise.nativegame.v147tradetest
            adb shell am start -n com.survivalparadise.nativegame.v147tradetest/com.survivalparadise.nativegame.MainActivity
            sleep 4
            adb shell input tap 496 412
            sleep 4
            adb shell input tap 1047 323
            sleep 3
            adb shell screencap -p /sdcard/sp147_bag.png
            adb pull /sdcard/sp147_bag.png /tmp/sp147/visual/01_player_bag_wallet.png
            adb logcat -d -t 1200 > /tmp/sp147/visual/logcat_tail.txt
            adb shell pidof com.survivalparadise.nativegame.v147tradetest
            test -s /tmp/sp147/visual/01_player_bag_wallet.png
            if grep -Eq '(FATAL EXCEPTION|Process: com.survivalparadise.nativegame.v147tradetest)' /tmp/sp147/visual/logcat_tail.txt; then echo "FAIL: V147 app fatal exception"; exit 1; fi
            echo "PASS: V147 installed, entered gameplay and bag window captured. Requires visual review."
      - name: Save actual Android screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP_V147_Bag_Mobile_Wallet_QA
          path: /tmp/sp147/visual/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bag screenshot with V147 release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload survival-paradise-v147-mobile-trade-wallet-test \
            /tmp/sp147/visual/01_player_bag_wallet.png --clobber -R "$GITHUB_REPOSITORY"
