name: Survival Paradise V89 — Publish Direct APK
on:
  push:
    branches: [sp-native-v89-field-clinic-interior-20261101]
    paths: ['.github/workflows/sp-v89-direct-apk-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-v89:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve verified Android V89 package and source checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/spv89
          gh run download 41293078311 -R "$GITHUB_REPOSITORY" \
            -n SP_V89_ClinicInterior -D /tmp/spv89
          APK=/tmp/spv89/SurvivalParadise_V89_ClinicInterior.apk
          SOURCE=/tmp/spv89/SurvivalParadise_V89_Source.zip
          test -s "$APK" && test -s "$SOURCE"
          unzip -t "$APK" >/dev/null
          unzip -t "$SOURCE" >/dev/null
          unzip -l "$APK" | grep -q classes.dex
          for a in body.png approved_v44_walk_palette.png npc_idle_v56.png approved_v29_axe.png gear.png world_props_v74.png; do
            unzip -l "$APK" | grep -q "assets/$a"
          done
          sha256sum "$APK" > /tmp/spv89/V89_APK_SHA256.txt
          cat /tmp/spv89/V89_APK_SHA256.txt
      - name: Release V89 with direct installable APK and complete source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=survival-paradise-v89-field-clinic-interior
          APK=/tmp/spv89/SurvivalParadise_V89_ClinicInterior.apk
          SOURCE=/tmp/spv89/SurvivalParadise_V89_Source.zip
          HASH=/tmp/spv89/V89_APK_SHA256.txt
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SOURCE" "$HASH" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" "$SOURCE" "$HASH" \
              -R "$GITHUB_REPOSITORY" \
              --target 4b349c82ff49b854413ad9aea93c664c29810087 \
              --title "Survival Paradise V89 — Full-Scale Enterable Field Clinic" \
              --notes "V89 fully compiled native Android APK, verified with CI run 41293078311 and source commit 4b349c82ff49b854413ad9aea93c664c29810087. The Field Clinic outside world is enlarged to about 380x290 logical pixels with full roof, medical symbol, entrance canopy and concrete access path. Approach its south entrance and press USE to enter a separate 1600x1120 room map. Six connected medical departments (triage, operating theatre, diagnostics lab, pharmacy, reception, recovery ward), a wide corridor, walls, doorway gaps, collision, medical beds, treatment tables, lab benches, computer desks, medical carts and 14 distinct searchable storage containers. Interact using USE, loot individually via two-panel square-icon inventory with tap/LOOT or drag across to player, or LOOT ALL. All partial loot/container depletion persists on save/Continue, including saves while indoors. Press USE near the interior exit to return to precisely the same outdoor Field Clinic entrance. Outdoor world geometry, chunks, bandits, companions and rendering are suspended while indoors for low-end Android performance; companions remain correctly outside when continuing an indoor save. All V88 world sites, approved V31 art, classic aiming, customized HUD, existing crafting, items and V85 portable save export/import remain. App versionCode 90. Note: only the Field Clinic is enterable in this version; other building interiors are future expansions. Device visual/FPS testing is pending. Important: seamless Android installation over previous versions still requires consistent signing certificates; export previous save before uninstalling." \
              --prerelease
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" \
            --json url,assets --jq '{url:.url,assets:[.assets[]|{name:.name,url:.url}]}'
