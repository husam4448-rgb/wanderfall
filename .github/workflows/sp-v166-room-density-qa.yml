name: Survival Paradise V166 - Fast Room Density QA
on:
  push:
    branches:
      - sp-native-v166-world-art-overhaul-20261118
    paths:
      - 'survival-paradise/native-game/app/src/main/java/com/survivalparadise/nativegame/**'
      - 'survival-paradise/native-game/tools/V163InteriorLayoutTest.java'
      - '.github/workflows/sp-v166-room-density-qa.yml'
  workflow_dispatch:
jobs:
  density:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and inspect all six rooms in 89 seeded buildings
        run: |
          set -euo pipefail
          R=survival-paradise/native-game
          mkdir -p /tmp/sp-v166-room-qa
          javac -sourcepath "$R/app/src/main/java" -d /tmp/sp-v166-room-qa "$R/tools/V163InteriorLayoutTest.java"
          java -Xmx512m -cp /tmp/sp-v166-room-qa com.survivalparadise.nativegame.V163InteriorLayoutTest
