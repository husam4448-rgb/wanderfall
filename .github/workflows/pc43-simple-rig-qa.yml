name: PC43 Minimal Mirrored Character Rig Smoke QA
on:
  push:
    branches: [pc43-simple-mirrored-character]
    paths:
      - 'character_rebuild/**'
      - '.github/workflows/pc43-simple-rig-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Recover approved original art from protected PC42Y source branch
        uses: actions/checkout@v4
        with:
          ref: pc42y-authentic-arm-artwork
          path: protected_art_source
      - name: Stage only approved male RIGHT reference for isolated PC43 test
        run: |
          set -eu
          SOURCE=protected_art_source/assets/authored2d/unified_character/rig/reference/male_east_rifle.png
          TARGET=assets/authored2d/unified_character/rig/reference/male_east_rifle.png
          test -s "$SOURCE"
          mkdir -p "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"
          file "$TARGET"
          sha256sum "$TARGET" | tee pc43_original_art_sha256.txt
      - name: Acquire Godot 4.4.1 headless-capable editor
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --version
      - name: Import, parse and run actual PC43 mirrored rig
        run: |
          set -o pipefail
          GODOT=./Godot_v4.4.1-stable_linux.x86_64
          timeout 90s "$GODOT" --headless --path character_rebuild --editor --import --quit | tee pc43_import.log
          timeout 45s "$GODOT" --headless --path character_rebuild --script res://test_pc43_rig.gd | tee pc43_test.log
          grep -q 'PC43_RIG_SMOKE_PASS' pc43_test.log
          timeout 75s "$GODOT" --headless --path character_rebuild --script res://test_pc43_source_intake.gd | tee pc43_source.log
          grep -q 'PC43_SOURCE_INTAKE_PASS' pc43_source.log
      - name: Upload real Godot QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PC43-Godot-Smoke-${{ github.sha }}
          path: |
            pc43_original_art_sha256.txt
            pc43_import.log
            pc43_test.log
            pc43_source.log
            character_rebuild/evidence/*.png
          if-no-files-found: ignore
          retention-days: 14
