            tools/build_sp_v2654_reclaimed_art.py
            tools/build_sp_v2655_source_art.py
            source_art/v2655
            source_art/v2656
            combat/sp_v2656_tracer_fx.gd
            tools/build_sp_v2656_zombie_source.py
            patches/apply_sp_v2656_tracer_zombie.py
            tools/qa_sp_v2656_shot_and_zombie.gd
            tools/build_sp_v2657_camp_animal_art.py
            patches/apply_sp_v2657_art_convergence.py
            tools/qa_sp_v2657_real_camp_animals.gd
            tools/build_sp_v2658_camp_props.py
            patches/apply_sp_v2658_prop_art.py
            patches/apply_sp_v266_world_assets.py
            patches/apply_sp_v267_live_world_props.py
            patches/apply_sp_v268_lowend_world.py
            patches/apply_sp_v269_lowend_core_render.py
            patches/apply_sp_v270_s8_ab_diagnostics.py
            patches/apply_sp_v271_true_pause_diagnostics.py
            patches/apply_sp_v272_s8_physics_recovery.py
            patches/apply_sp_v273_regions_and_sight.py
            patches/apply_sp_v273_npc_los.py
            patches/apply_sp_v274_region_shadow_correction.py
            patches/apply_sp_v275_s8_render_isolation.py
            patches/apply_sp_v276_independent_hud_settings.py
            patches/apply_sp_v277_camera_visible_chunk_culling.py
            patches/apply_sp_v278_static_scenery_cache.py
            patches/apply_sp_v279_cpu_loot_batch.py
            tools/qa_sp_v279_loot_cpu_batch.gd
            patches/apply_sp_v280_interior_stream_cpu.py
            tools/qa_sp_v280_interior_stream.gd
            patches/apply_sp_v281_camp_fps_only.py
            tools/qa_sp_v281_camp_fps_only.gd
            patches/apply_sp_v282_hud_fps_visibility.py
            tools/qa_sp_v282_hud_fps_visibility.gd
            patches/apply_sp_v283_hud_motion.py
            patches/apply_sp_v283_shared_npc_player.py
            tools/qa_sp_v283_hud_motion_npc.gd
            npc_visuals/sp_v283_shared_survivor_npc.gd
            npc_visuals/sp_v284_shared_survivor_npc.gd
            patches/apply_sp_v284_fps_slider.py
            patches/apply_sp_v284_smooth_vision.py
            patches/apply_sp_v284_all_npc_pixel.py
            patches/apply_sp_v284_test_bandit_pixel.py
            patches/adapt_sp_v262_visual_qa_for_v284.py
            patches/adapt_sp_v281_fps_qa_for_v284.py
            tools/qa_sp_v284_fps_vision_npc.gd
            patches/bake_sp_v285_npc_roles.py
            patches/apply_sp_v285_npc_roles_and_flip.py
            npc_visuals/sp_v285_distinct_roles_stable_facing.gd
            patches/bake_sp_v286_anatomical_npc.py
            patches/apply_sp_v286_npc_anatomy.py
