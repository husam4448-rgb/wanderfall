            tools/qa_sp_v286_render_frames.gd
            tools/qa_sp_v285_unique_npc_antiflip.gd
            assets/authored2d/npc_specializations
            assets/authored2d/npc_faces
            patches/adapt_sp_v262_visual_qa_for_v283.py
            regions/sp_v278_static_raster_cache.gd
            tools/qa_sp_v278_static_scenery_cache.gd
            tools/qa_sp_v277_camera_visible_chunk_culling.gd
            tools/qa_sp_v276_independent_hud_settings.gd
            tools/qa_sp_v275_s8_render_isolation.gd
            regions/sp_v274_large_regions_precise_sight.gd
            regions/sp_v274_large_region_gates.gd
            tools/qa_sp_v274_large_regions_vision.gd
            regions/sp_v273_regions_and_sight.gd
            regions/sp_v273_region_gates.gd
            tools/qa_sp_v273_regions_and_sight.gd
            performance/sp_v272_remote_actor_physics_lod.gd
            tools/qa_sp_v272_s8_physics_lod.gd
            performance/sp_v271_s8_true_pause_diagnostic.gd
            tools/qa_sp_v271_true_pause_diagnostics.gd
            performance/sp_v270_s8_isolation.gd
            tools/qa_sp_v270_s8_ab_diagnostics.gd
            tools/build_sp_v268_android_atlases.py
            tools/build_sp_v267_authored_props.py
            tools/qa_sp_v266_world_assets.gd
            tools/qa_sp_v2658_camp_props.gd
            patches/apply_sp_v2654_props_scale.py
            tools/qa_sp_v2654_props_scale.gd
            tools/build_sp_v265_biome_art.py
            tools/qa_sp_v265_environment.gd
            worldgen
            tools/qa_sp_v263_world_atlas.gd
            tools/qa_sp_v264_biome_art.gd
            occlusion
            tools/qa_sp_v261_real_game_visuals.gd
            tools/qa_sp_v262_uniform_opacity.gd
            melee-six-prototype
            tools/build_sp_melee_walk_layers.py
            tools/qa_sp_v257_restored_world_hud.gd

      - name: Checkout 281 verified terrain source assets for opt-in live integration
        uses: actions/checkout@v4
        with:
          ref: sp-assets-batch03-no-passages-20261021
          path: terrain_source
          sparse-checkout: |
            assets/world/terrain_prototype/v01/extracted/GameAssets

      - name: Checkout approved 21 Batch03 art sheets for genuine sprite extraction
        uses: actions/checkout@v4
        with:
          ref: sp-assets-batch03-no-passages-20261021
          path: sp267_sheets
          sparse-checkout: |
            art_source/world_assets/batch03_20261021/published

      - name: Reconstruct source and apply Quick-Use v0.17.9
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part_*.b64 > /tmp/wanderfall_source.b64
          base64 --decode /tmp/wanderfall_source.b64 > "$SOURCE_ARCHIVE"
          echo "$SOURCE_SHA256  $SOURCE_ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT_DIR"
          tar -xJf "$SOURCE_ARCHIVE" -C "$PROJECT_DIR"
          python3 patches/apply_godot_47_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v017_ui_overhaul.py "$PROJECT_DIR"
          python3 patches/apply_v0171_inventory_polish.py "$PROJECT_DIR"
          python3 patches/apply_v0172_hud_customization.py "$PROJECT_DIR"
          python3 patches/fix_v0173_applicator_path.py
          python3 patches/apply_v0173_touch_layout_fixes.py "$PROJECT_DIR"
          python3 patches/apply_v0174_ui_pause_completion.py "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('patches/apply_v0175_hotbar_sensitivity.py')
          s = p.read_text(encoding='utf-8')
          old = '''replace_once(\n    "scripts/settings/settings_hud.gd",\n    '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n\\n    var pause_names :=',\n    '    if ui_buttons.has("quickbar_visible"):\\n        ui_buttons["quickbar_visible"].text = "QUICKBAR: %s" % ("ON" if GameSettings.quickbar_visible else "OFF")\\n'\n    '    if movement_sensitivity_slider != null:\\n'\n    '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'\n    '    if movement_sensitivity_label != null:\\n'\n    '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'\n    '    var pause_names :=',\n)'''
          new = '''replace_once(\n    "scripts/settings/settings_hud.gd",\n    '    var pause_names :=',\n    '    if movement_sensitivity_slider != null:\\n'\n    '        movement_sensitivity_slider.set_value_no_signal(GameSettings.movement_stick_sensitivity)\\n'\n    '    if movement_sensitivity_label != null:\\n'\n    '        movement_sensitivity_label.text = "×%.2f" % GameSettings.movement_stick_sensitivity\\n\\n'\n    '    var pause_names :=',\n)'''
          if old not in s:
              raise SystemExit('Expected v0.17.5 applicator block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 patches/apply_v0175_hotbar_sensitivity.py "$PROJECT_DIR"
          python3 patches/apply_v0176_hotbar_deadzone.py "$PROJECT_DIR"
          python3 patches/apply_v0177_mobile_hotbar_layers.py "$PROJECT_DIR"
          python3 patches/apply_v0178_dedicated_hotbar_layer.py "$PROJECT_DIR"
          python3 patches/apply_v0179_quick_item_buttons.py "$PROJECT_DIR"
          # Fetch Quaternius D3D.1 character assets (same CC0 model contained in the uploaded pack).
          echo "Fetch Quaternius D3D.1 character assets"
          MODEL_DIR="$PROJECT_DIR/assets/models/superhero_male"
          mkdir -p "$MODEL_DIR"
          MODEL_BASE="https://raw.githubusercontent.com/robert-porter/sprite-renderer/fb8b9ee247ed2e5d9b5dfebd408382156be3b57f/assets/quaternius/universal/universal-base-characters/Universal%20Base%20Characters%5BStandard%5D/Base%20Characters/Godot%20-%20UE"
          curl -g -fL --retry 3 -o "$MODEL_DIR/Superhero_Male_FullBody.gltf" "$MODEL_BASE/Superhero_Male_FullBody.gltf"
          curl -g -fL --retry 3 -o "$MODEL_DIR/Superhero_Male_FullBody.bin" "$MODEL_BASE/Superhero_Male_FullBody.bin"
          curl -g -fL --retry 3 -o "$MODEL_DIR/T_Hair_1_BaseColor.png" "$MODEL_BASE/T_Hair_1_BaseColor.png"
          curl -g -fL --retry 3 -o "$MODEL_DIR/T_Eye_Brown.png" "$MODEL_BASE/T_Eye_Brown.png"
          curl -g -fL --retry 3 -o "$MODEL_DIR/T_Superhero_Male_Dark.png" "$MODEL_BASE/T_Superhero_Male_Dark.png"

          # Mobile prototype keeps only albedo maps; remove multi-megabyte normal/roughness
          # references while preserving geometry, weights, skeleton and original base colors.
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("game/assets/models/superhero_male/Superhero_Male_FullBody.gltf")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["images"] = [
              {"mimeType":"image/png","name":"HairBase","uri":"T_Hair_1_BaseColor.png"},
              {"mimeType":"image/png","name":"EyeBase","uri":"T_Eye_Brown.png"},
              {"mimeType":"image/png","name":"BodyBase","uri":"T_Superhero_Male_Dark.png"},
          ]
          d["samplers"] = [{"magFilter":9729,"minFilter":9987,"wrapS":10497,"wrapT":10497}]
          d["textures"] = [
              {"sampler":0,"source":0},
              {"sampler":0,"source":1},
              {"sampler":0,"source":2},
          ]
          for i, mat in enumerate(d.get("materials", [])):
              mat.pop("normalTexture", None)
              pbr = mat.setdefault("pbrMetallicRoughness", {})
              pbr["baseColorTexture"] = {"index": i}
              pbr.pop("metallicRoughnessTexture", None)
              pbr["metallicFactor"] = 0.0
              pbr["roughnessFactor"] = 0.72
          p.write_text(json.dumps(d, separators=(",",":")), encoding="utf-8")
          PY
          # Legacy D3D compatibility data is removed before optimized APK export.
          test -s "$MODEL_DIR/Superhero_Male_FullBody.bin"

          echo "Fetch Quaternius Ranger outfit assets"
          OUTFIT_BASE="https://raw.githubusercontent.com/joega/check-and-conquer/b2a3a3418dc080e782c1e5d386d258145346a218/assets/characters/quaternius/outfits"
          curl -fL --retry 3 -o "$MODEL_DIR/Male_Ranger.gltf" "$OUTFIT_BASE/Male_Ranger.gltf"
          curl -fL --retry 3 -o "$MODEL_DIR/Male_Ranger.bin" "$OUTFIT_BASE/Male_Ranger.bin"
          curl -fL --retry 3 -o "$MODEL_DIR/T_Ranger_BaseColor.png" "$OUTFIT_BASE/T_Ranger_BaseColor.png"
          curl -fL --retry 3 -o "$MODEL_DIR/T_Regular_Male_Dark_BaseColor.png" "$OUTFIT_BASE/T_Regular_Male_Dark_BaseColor.png"

          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("game/assets/models/superhero_male/Male_Ranger.gltf")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["images"] = [
              {"mimeType":"image/png","name":"RangerBase","uri":"T_Ranger_BaseColor.png"},
              {"mimeType":"image/png","name":"RegularMaleBase","uri":"T_Regular_Male_Dark_BaseColor.png"},
          ]
          d["samplers"] = [{"magFilter":9729,"minFilter":9987,"wrapS":10497,"wrapT":10497}]
          d["textures"] = [
              {"sampler":0,"source":0},
              {"sampler":0,"source":1},
          ]
          mats = d.get("materials", [])
          if len(mats) >= 1:
              mats[0].pop("normalTexture", None)
              pbr = mats[0].setdefault("pbrMetallicRoughness", {})
              pbr["baseColorTexture"] = {"index":0}
              pbr.pop("metallicRoughnessTexture", None)
              pbr["metallicFactor"] = 0.0
              pbr["roughnessFactor"] = 0.78
          if len(mats) >= 2:
              mats[1].pop("normalTexture", None)
              pbr = mats[1].setdefault("pbrMetallicRoughness", {})
              pbr["baseColorTexture"] = {"index":1}
              pbr.pop("metallicRoughnessTexture", None)
              pbr["metallicFactor"] = 0.0
              pbr["roughnessFactor"] = 0.82
          p.write_text(json.dumps(d, separators=(",",":")), encoding="utf-8")
          PY
          # Legacy D3D compatibility data is removed before optimized APK export.
          test -s "$MODEL_DIR/Male_Ranger.bin"

          echo "Fetch Quaternius Peasant outfit assets"
          OUTFIT_BASE="https://raw.githubusercontent.com/joega/check-and-conquer/b2a3a3418dc080e782c1e5d386d258145346a218/assets/characters/quaternius/outfits"
          curl -fL --retry 3 -o "$MODEL_DIR/Male_Peasant.gltf" "$OUTFIT_BASE/Male_Peasant.gltf"
          curl -fL --retry 3 -o "$MODEL_DIR/Male_Peasant.bin" "$OUTFIT_BASE/Male_Peasant.bin"
          curl -fL --retry 3 -o "$MODEL_DIR/T_Peasant_BaseColor.png" "$OUTFIT_BASE/T_Peasant_BaseColor.png"

          echo "Fetch compatible D3D.9 survivor hair"
          curl -fL --retry 3 -o "$MODEL_DIR/Hair_SimpleParted.gltf" "https://raw.githubusercontent.com/joega/check-and-conquer/b2a3a3418dc080e782c1e5d386d258145346a218/assets/characters/quaternius/hair/Hair_SimpleParted.gltf"
          curl -fL --retry 3 -o "$MODEL_DIR/Hair_SimpleParted.bin" "https://raw.githubusercontent.com/joega/check-and-conquer/b2a3a3418dc080e782c1e5d386d258145346a218/assets/characters/quaternius/hair/Hair_SimpleParted.bin"
          curl -fL --retry 3 -o "$MODEL_DIR/T_Hair_1_Normal.png" "https://raw.githubusercontent.com/joega/check-and-conquer/b2a3a3418dc080e782c1e5d386d258145346a218/assets/characters/quaternius/hair/T_Hair_1_Normal.png"
          echo "Fetch Quaternius D3D.22 long female hair"
          FEMALE_HAIR_BASE="https://raw.githubusercontent.com/robert-porter/sprite-renderer/fb8b9ee247ed2e5d9b5dfebd408382156be3b57f/assets/quaternius/universal/universal-base-characters/Universal%20Base%20Characters%5BStandard%5D/Hairstyles/Rigged%20to%20Head%20Bone/glTF%20(Godot%20-Unreal)"
          curl -g -fL --retry 3 -o "$MODEL_DIR/Hair_Long.gltf" "$FEMALE_HAIR_BASE/Hair_Long.gltf"
          curl -g -fL --retry 3 -o "$MODEL_DIR/Hair_Long.bin" "$FEMALE_HAIR_BASE/Hair_Long.bin"
          curl -g -fL --retry 3 -o "$MODEL_DIR/T_Hair_2_Normal.png" "$FEMALE_HAIR_BASE/T_Hair_2_Normal.png"
          curl -g -fL --retry 3 -o "$MODEL_DIR/T_Hair_2_BaseColor.png" "$FEMALE_HAIR_BASE/T_Hair_2_BaseColor.png"
          test -s "$MODEL_DIR/Hair_Long.bin"


          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("game/assets/models/superhero_male/Male_Peasant.gltf")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["images"] = [
              {"mimeType":"image/png","name":"PeasantBase","uri":"T_Peasant_BaseColor.png"},
              {"mimeType":"image/png","name":"RegularMaleBase","uri":"T_Regular_Male_Dark_BaseColor.png"},
          ]
          d["samplers"] = [{"magFilter":9729,"minFilter":9987,"wrapS":10497,"wrapT":10497}]
          d["textures"] = [
              {"sampler":0,"source":0},
              {"sampler":0,"source":1},
          ]
          mats = d.get("materials", [])
          if len(mats) >= 1:
              mats[0].pop("normalTexture", None)
              pbr = mats[0].setdefault("pbrMetallicRoughness", {})
              pbr["baseColorTexture"] = {"index":0}
              pbr.pop("metallicRoughnessTexture", None)
              pbr["metallicFactor"] = 0.0
              pbr["roughnessFactor"] = 0.82
          if len(mats) >= 2:
              mats[1].pop("normalTexture", None)
              pbr = mats[1].setdefault("pbrMetallicRoughness", {})
              pbr["baseColorTexture"] = {"index":1}
              pbr.pop("metallicRoughnessTexture", None)
              pbr["metallicFactor"] = 0.0
              pbr["roughnessFactor"] = 0.86
          p.write_text(json.dumps(d, separators=(",",":")), encoding="utf-8")
          PY
          # Legacy D3D compatibility data is removed before optimized APK export.
          test -s "$MODEL_DIR/Male_Peasant.bin"

          echo "Fetch Quaternius D3D.21 female template assets"
          curl -g -fL --retry 3 -o "$MODEL_DIR/Superhero_Female_FullBody.gltf" "$MODEL_BASE/Superhero_Female_FullBody.gltf"
          curl -g -fL --retry 3 -o "$MODEL_DIR/Superhero_Female_FullBody.bin" "$MODEL_BASE/Superhero_Female_FullBody.bin"
          curl -g -fL --retry 3 -o "$MODEL_DIR/T_Hair_2_BaseColor.png" "$MODEL_BASE/T_Hair_2_BaseColor.png"
          curl -g -fL --retry 3 -o "$MODEL_DIR/T_Superhero_Female_Dark_BaseColor.png" "$MODEL_BASE/T_Superhero_Female_Dark_BaseColor.png"
          curl -fL --retry 3 -o "$MODEL_DIR/Female_Ranger.gltf" "$OUTFIT_BASE/Female_Ranger.gltf"
          curl -fL --retry 3 -o "$MODEL_DIR/Female_Ranger.bin" "$OUTFIT_BASE/Female_Ranger.bin"
          curl -fL --retry 3 -o "$MODEL_DIR/Female_Peasant.gltf" "$OUTFIT_BASE/Female_Peasant.gltf"
          curl -fL --retry 3 -o "$MODEL_DIR/Female_Peasant.bin" "$OUTFIT_BASE/Female_Peasant.bin"
          curl -fL --retry 3 -o "$MODEL_DIR/T_Regular_Female_Dark_BaseColor.png" "$OUTFIT_BASE/T_Regular_Female_Dark_BaseColor.png"

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("game/assets/models/superhero_male")

          p=root/"Superhero_Female_FullBody.gltf"
          d=json.loads(p.read_text(encoding="utf-8"))
          d["images"]=[
              {"mimeType":"image/png","name":"HairBase","uri":"T_Hair_2_BaseColor.png"},
              {"mimeType":"image/png","name":"EyeBase","uri":"T_Eye_Brown.png"},
              {"mimeType":"image/png","name":"BodyBase","uri":"T_Superhero_Female_Dark_BaseColor.png"},
          ]
          d["samplers"]=[{"magFilter":9729,"minFilter":9987,"wrapS":10497,"wrapT":10497}]
          d["textures"]=[{"sampler":0,"source":0},{"sampler":0,"source":1},{"sampler":0,"source":2}]
          for i,mat in enumerate(d.get("materials",[])):
              mat.pop("normalTexture",None)
              pbr=mat.setdefault("pbrMetallicRoughness",{})
              pbr["baseColorTexture"]={"index":i}
              pbr.pop("metallicRoughnessTexture",None)
              pbr["metallicFactor"]=0.0
              pbr["roughnessFactor"]=0.76
          p.write_text(json.dumps(d,separators=(",",":")),encoding="utf-8")

          p=root/"Female_Ranger.gltf"
          d=json.loads(p.read_text(encoding="utf-8"))
          d["images"]=[
              {"mimeType":"image/png","name":"RangerBase","uri":"T_Ranger_BaseColor.png"},
              {"mimeType":"image/png","name":"RegularFemaleBase","uri":"T_Regular_Female_Dark_BaseColor.png"},
          ]
          d["samplers"]=[{"magFilter":9729,"minFilter":9987,"wrapS":10497,"wrapT":10497}]
          d["textures"]=[{"sampler":0,"source":0},{"sampler":0,"source":1}]
          for i,mat in enumerate(d.get("materials",[])):
              mat.pop("normalTexture",None)
              pbr=mat.setdefault("pbrMetallicRoughness",{})
              pbr["baseColorTexture"]={"index":min(i,1)}
              pbr.pop("metallicRoughnessTexture",None)
              pbr["metallicFactor"]=0.0
              pbr["roughnessFactor"]=0.82
          p.write_text(json.dumps(d,separators=(",",":")),encoding="utf-8")

          p=root/"Female_Peasant.gltf"
