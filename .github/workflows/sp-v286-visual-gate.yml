      - name: Install verified Godot editor and templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$GODOT_ZIP" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $GODOT_ZIP" | sha256sum -c -
          unzip -q "$GODOT_ZIP" -d /tmp
          curl -fL --retry 3 --retry-delay 2 -o "$GODOT_TEMPLATES_TPZ" "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "$GODOT_TEMPLATES_SHA256  $GODOT_TEMPLATES_TPZ" | sha256sum -c -
          rm -rf /tmp/godot_export_templates
          mkdir -p /tmp/godot_export_templates
          unzip -q "$GODOT_TEMPLATES_TPZ" -d /tmp/godot_export_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot_export_templates/templates/. "$TEMPLATE_DIR/"

      - name: Godot validate v286 NPC anatomy and compile scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import > sp286_import.log 2>&1 || { tail -100 sp286_import.log; exit 1; }
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:' sp286_import.log; then exit 1; fi
          echo SP286_GODOT_IMPORT_PASS
      - name: Godot REAL-render NPC characters and capture actual camp, walk, aim
        shell: bash
        run: |
          set -euo pipefail
          cp v257_overlay/tools/qa_sp_v286_render_frames.gd "$PROJECT_DIR/sp286_qa.gd"
          timeout 130s xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_BIN" --path "$PROJECT_DIR" --resolution 1064x518 --script res://sp286_qa.gd > sp286_visual.log 2>&1 || { tail -140 sp286_visual.log; exit 1; }
          cat sp286_visual.log | tail -35
          grep -q SP286_NATIVE_REAL_GODOT_RENDER_PASS sp286_visual.log
          for kind in world idle walk aim aim_left walk_left; do test -s "$PROJECT_DIR/sp286_qa_${kind}.png"; done
      - name: Print visual-review JPEG evidence and retain original PNG
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64,io
          for label in ('idle','walk','aim','aim_left','walk_left','world'):
              p=Path('game')/('sp286_qa_'+label+'.png')
              im=Image.open(p).convert('RGB')
              # World image can be visually inspected at 1064x518.
              buf=io.BytesIO()
              im.save(buf,format='JPEG',quality=84,optimize=True)
              print('SP286_VISUAL_'+label.upper()+'_BEGIN')
              print(base64.b64encode(buf.getvalue()).decode('ascii'))
              print('SP286_VISUAL_'+label.upper()+'_END')
              print('SP286_VISUAL_IMAGE',label,im.size,len(buf.getvalue()))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SP286-PreAPK-Human-Visual-Gate
          path: |
            game/sp286_qa_*.png
            sp286_visual.log
            sp286_import.log
          retention-days: 21
