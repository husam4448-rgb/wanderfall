name: Survival Paradise V157 - Android Emulator Visual Smoke QA
on:
  push:
    branches: [sp-native-v157-solid-buildings-natural-world-20261117]
    paths: ['.github/workflows/sp-v157-android-emulator-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  visual-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get CI-verified V157 APK from successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sp157/visual
          gh run download 44051568525 --repo "$GITHUB_REPOSITORY" \
            --name Survival_Paradise_V157_World_Fix --dir /tmp/sp157
          test -s /tmp/sp157/Survival_Paradise_V157_World_Fix.apk
      - name: Enable Android emulator KVM
        run: |
          if [ -c /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Install and visually smoke-test genuine Android game scene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 1536
          disable-animations: true
          script: |
            set -eux
            export PKG=com.survivalparadise.nativegame.v157worldfix
            adb wait-for-device
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            adb shell wm size 1920x1080 || true
            adb shell wm density 260 || true
            adb install /tmp/sp157/Survival_Paradise_V157_World_Fix.apk
            # Capture startup exceptions BEFORE boot/system noise can evict them.
            adb logcat -c
            adb shell am start -n "$PKG/com.survivalparadise.nativegame.MainActivity"
            sleep 7
            adb logcat -d > /tmp/sp157/visual/logcat_startup.txt
            if ! adb shell pidof "$PKG"; then
              echo 'ERROR: game process exited before menu screenshot'
              grep -E -A 20 -B 8 'FATAL EXCEPTION|Process: com.survivalparadise.nativegame.v157worldfix|AndroidRuntime|SP-V109' /tmp/sp157/visual/logcat_startup.txt | tail -140 || true
              exit 1
            fi
            adb shell input tap 1130 330
            adb shell input tap 1140 335
            sleep 2
            adb shell screencap -p /sdcard/v157_menu.png
            adb pull /sdcard/v157_menu.png /tmp/sp157/visual/01_menu.png
            # Base logical UI H660 rendered at 1920x1080.
            adb shell input tap 744 618
            sleep 9
            adb shell input tap 1130 330
            sleep 2
            adb shell screencap -p /sdcard/v157_gameplay.png
            adb pull /sdcard/v157_gameplay.png /tmp/sp157/visual/02_gameplay.png
            # Capture close-up with the existing HUD zoom button.
            adb shell input tap 1840 170
            adb shell input tap 1840 170
            sleep 3
            adb shell screencap -p /sdcard/v157_zoom.png
            adb pull /sdcard/v157_zoom.png /tmp/sp157/visual/03_gameplay_zoom.png
            adb logcat -d > /tmp/sp157/visual/logcat_tail.txt
            adb shell pidof "$PKG"
            if grep -E '(FATAL EXCEPTION|Process: com.survivalparadise.nativegame.v157worldfix)' /tmp/sp157/visual/logcat_tail.txt; then
              echo 'FAIL: Android runtime fatal exception'
              exit 1
            fi
            test -s /tmp/sp157/visual/02_gameplay.png
            test -s /tmp/sp157/visual/03_gameplay_zoom.png
            echo 'PASS: V157 native Android process, menu, gameplay and zoom screenshots captured'
      - name: Preserve actual emulator screenshots and logcat for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SP_V157_Android_Emulator_Visual_Evidence
          path: /tmp/sp157/visual/
          if-no-files-found: warn
          retention-days: 14
